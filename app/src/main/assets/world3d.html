<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>LazyFitBike 3D Cockpit &amp; Holographic Visor HUD</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #09090B;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    #viewport-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #three-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #fullmap-container {
      display: none;
      position: absolute;
      top: 60px;
      bottom: 74px;
      left: 310px;
      right: 14px;
      border-radius: 14px;
      border: 2px solid #F97316;
      background: #0F172A;
      overflow: hidden;
      z-index: 50;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.75);
    }
    #fullmap-canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }
    #map-hint {
      position: absolute;
      bottom: 8px;
      left: 10px;
      right: 10px;
      background: rgba(9, 9, 11, 0.90);
      color: #F4F4F5;
      border: 1px solid #27272A;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      pointer-events: none;
      font-variant-numeric: tabular-nums;
    }
    #fallback-2d-canvas {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
    }
  </style>
  <script src="js/three.min.js"></script>
</head>
<body>
  <div id="viewport-container">
    <canvas id="three-canvas"></canvas>
    <canvas id="fallback-2d-canvas"></canvas>
  </div>

  <div id="fullmap-container">
    <canvas id="fullmap-canvas"></canvas>
    <div id="map-hint">OpenStreetMap Live View: Tap any 2 points on the map to build an OSRM road route.</div>
  </div>

  <script>
    // State management & telemetry bridge
    const state = {
      speedKmh: 0,
      rpm: 0,
      watts: 0,
      gradePercent: 0,
      distanceMeters: 0,
      cameraMode: 'CHASE',
      lat: 45.0592,
      lon: 6.0358,
      curvature: 0,
      isMapModalOpen: false,
      crankAngleRad: 0,
      // Extended telemetry
      bpm: 0,
      wattsPerKg: 0.0,
      ftpWatts: 200,
      powerZone: 1,
      hrZone: 1,
      elapsedSeconds: 0,
      activeRouteName: "Alpe d'Huez Climb",
      wheelRotationRad: 0,
      // Structured Workout State
      isWorkoutActive: false,
      workoutName: '',
      workoutTargetWatts: 0,
      workoutTargetRpm: 0,
      workoutStepRemainingSec: 0,
      workoutStepIndex: 0,
      workoutTotalSteps: 0,
      workoutStepName: '',
      workoutCompliancePercent: 100,
      workoutEarnedStars: 0,
      workoutPacingPrompt: '',
      workoutIntensityBiasPercent: 0,
      isWorkoutPaused: false
    };

    let routeWaypoints = [
      [45.0592, 6.0358, 724],
      [45.0655, 6.0431, 860],
      [45.0721, 6.0472, 1118],
      [45.0832, 6.0555, 1420],
      [45.0924, 6.0706, 1815]
    ];

    const ZONE_COLORS = {
      1: '#94A3B8', // Zone 1 Gray: Active Recovery
      2: '#38BDF8', // Zone 2 Blue: Endurance
      3: '#34D399', // Zone 3 Green: Tempo
      4: '#F97316', // Zone 4 Orange: Threshold
      5: '#F43F5E'  // Zone 5 Red: VO2 Max / Anaerobic
    };

    const ZONE_NAMES = {
      1: 'Z1 RECOVERY',
      2: 'Z2 ENDURANCE',
      3: 'Z3 TEMPO',
      4: 'Z4 THRESHOLD',
      5: 'Z5 VO2 MAX'
    };

    const bots = [
      { name: 'Bot A (1.8 W/kg)', speedMs: 7.2, dist: 40, color: '#38bdf8', laneOffset: 0.8 },
      { name: 'Bot B (2.2 W/kg)', speedMs: 8.1, dist: 95, color: '#a3e635', laneOffset: -0.7 },
      { name: 'Bot C (2.5 W/kg)', speedMs: 8.8, dist: 18, color: '#fbbf24', laneOffset: 0.5 },
      { name: 'Bot D (3.0 W/kg)', speedMs: 9.8, dist: 180, color: '#f472b6', laneOffset: -0.6 },
      { name: 'Bot E (3.6 W/kg)', speedMs: 10.9, dist: 310, color: '#c084fc', laneOffset: 0.7 }
    ];

    // Android bridge entry points
    window.setRoutePolyline = function(jsonArrayStr) {
      try {
        const parsed = typeof jsonArrayStr === 'string' ? JSON.parse(jsonArrayStr) : jsonArrayStr;
        if (Array.isArray(parsed) && parsed.length >= 2) {
          routeWaypoints = parsed;
        }
      } catch (e) {}
    };

    window.updateRideState = function(
      speedKmh, rpm, watts, gradePercent, distanceMeters,
      cameraMode, lat, lon, curvature, isMapModalOpen,
      bpm, wattsPerKg, ftpWatts, powerZone, hrZone, elapsedSeconds, activeRouteName
    ) {
      state.speedKmh = Number(speedKmh) || 0;
      state.rpm = Number(rpm) || 0;
      state.watts = Math.max(0, Math.round(Number(watts) || 0));
      state.gradePercent = Number(gradePercent) || 0;
      state.distanceMeters = Number(distanceMeters) || 0;
      state.cameraMode = cameraMode || 'CHASE';
      if (lat !== undefined) state.lat = Number(lat) || state.lat;
      if (lon !== undefined) state.lon = Number(lon) || state.lon;
      if (curvature !== undefined) state.curvature = Number(curvature) || 0;

      if (bpm !== undefined) state.bpm = Math.max(0, Math.round(Number(bpm) || 0));
      if (wattsPerKg !== undefined) state.wattsPerKg = Number(wattsPerKg) || 0;
      if (ftpWatts !== undefined && Number(ftpWatts) > 0) state.ftpWatts = Number(ftpWatts);
      if (powerZone !== undefined && Number(powerZone) >= 1) state.powerZone = Math.min(5, Math.max(1, Math.round(Number(powerZone))));
      if (hrZone !== undefined && Number(hrZone) >= 1) state.hrZone = Math.min(5, Math.max(1, Math.round(Number(hrZone))));
      if (elapsedSeconds !== undefined) state.elapsedSeconds = Math.max(0, Math.round(Number(elapsedSeconds) || 0));
      if (activeRouteName) state.activeRouteName = String(activeRouteName);

      const shouldShowMap = Boolean(isMapModalOpen);
      if (shouldShowMap !== state.isMapModalOpen) {
        state.isMapModalOpen = shouldShowMap;
        fullMapContainer.style.display = shouldShowMap ? 'block' : 'none';
        resize();
      }
    };

    window.updateWorkoutHud = function(
      active, name, targetWatts, targetRpm, remainingSec, stepIdx, totalSteps,
      stepName, compliancePct, earnedStars, prompt, biasPct, paused
    ) {
      state.isWorkoutActive = Boolean(active);
      state.workoutName = name ? String(name) : '';
      state.workoutTargetWatts = Math.max(0, Math.round(Number(targetWatts) || 0));
      state.workoutTargetRpm = Math.max(0, Math.round(Number(targetRpm) || 0));
      state.workoutStepRemainingSec = Math.max(0, Math.round(Number(remainingSec) || 0));
      state.workoutStepIndex = Math.max(0, Math.round(Number(stepIdx) || 0));
      state.workoutTotalSteps = Math.max(0, Math.round(Number(totalSteps) || 0));
      state.workoutStepName = stepName ? String(stepName) : '';
      state.workoutCompliancePercent = Math.min(100, Math.max(0, Number(compliancePct) || 100));
      state.workoutEarnedStars = Math.max(0, Math.round(Number(earnedStars) || 0));
      state.workoutPacingPrompt = prompt ? String(prompt) : '';
      state.workoutIntensityBiasPercent = Math.round(Number(biasPct) || 0);
      state.isWorkoutPaused = Boolean(paused);
    };

    // OpenStreetMap 2D Map support (Modal & MAP mode)
    const osmTileCache = {};
    let tapStartLatLon = null;
    const fullMapContainer = document.getElementById('fullmap-container');
    const fullMapCanvas = document.getElementById('fullmap-canvas');
    const fullMapCtx = fullMapCanvas.getContext('2d');
    const mapHintEl = document.getElementById('map-hint');

    const fallback2dCanvas = document.getElementById('fallback-2d-canvas');
    const fallbackCtx = fallback2dCanvas.getContext('2d');

    function lonToTileX(lon, zoom) {
      return ((lon + 180) / 360) * Math.pow(2, zoom);
    }
    function latToTileY(lat, zoom) {
      const rad = (lat * Math.PI) / 180;
      return (((1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2) * Math.pow(2, zoom));
    }
    function tileXToLon(tileX, zoom) {
      return (tileX / Math.pow(2, zoom)) * 360 - 180;
    }
    function tileYToLat(tileY, zoom) {
      const n = Math.PI - (2 * Math.PI * tileY) / Math.pow(2, zoom);
      return (180 / Math.PI) * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
    }

    function getOsmTile(z, x, y) {
      const maxTile = Math.pow(2, z);
      const wrappedX = ((x % maxTile) + maxTile) % maxTile;
      if (y < 0 || y >= maxTile) return null;
      const key = z + '/' + wrappedX + '/' + y;
      const existing = osmTileCache[key];
      if (existing) {
        if (existing.failedAt && (Date.now() - existing.failedAt > 6000)) {
          delete osmTileCache[key];
        } else {
          return existing;
        }
      }
      const img = new Image();
      img.loadedOk = false;
      img.triedFallback = false;
      img.onload = function() { img.loadedOk = true; };
      img.onerror = function() {
        if (!img.triedFallback) {
          img.triedFallback = true;
          img.src = 'https://a.basemaps.cartocdn.com/rastertiles/voyager/' + key + '.png';
        } else {
          img.failedAt = Date.now();
        }
      };
      img.src = 'https://tile.openstreetmap.org/' + key + '.png';
      osmTileCache[key] = img;
      return img;
    }

    function renderGpsMap(targetCtx, boxX, boxY, boxW, boxH, zoom) {
      targetCtx.save();
      targetCtx.beginPath();
      targetCtx.rect(boxX, boxY, boxW, boxH);
      targetCtx.clip();
      targetCtx.fillStyle = '#0f172a';
      targetCtx.fillRect(boxX, boxY, boxW, boxH);

      const centerTileX = lonToTileX(state.lon, zoom);
      const centerTileY = latToTileY(state.lat, zoom);
      const startTileX = Math.floor(centerTileX - (boxW / 512) - 1);
      const endTileX = Math.floor(centerTileX + (boxW / 512) + 1);
      const startTileY = Math.floor(centerTileY - (boxH / 512) - 1);
      const endTileY = Math.floor(centerTileY + (boxH / 512) + 1);

      let anyTileLoaded = false;
      for (let tx = startTileX; tx <= endTileX; tx++) {
        for (let ty = startTileY; ty <= endTileY; ty++) {
          const tileImg = getOsmTile(zoom, tx, ty);
          const drawX = boxX + boxW * 0.5 + (tx - centerTileX) * 256;
          const drawY = boxY + boxH * 0.5 + (ty - centerTileY) * 256;
          if (tileImg && tileImg.loadedOk) {
            anyTileLoaded = true;
            try { targetCtx.drawImage(tileImg, drawX, drawY, 256, 256); } catch (e) {}
          }
        }
      }

      if (anyTileLoaded) {
        targetCtx.fillStyle = 'rgba(15, 23, 42, 0.15)';
        targetCtx.fillRect(boxX, boxY, boxW, boxH);
      } else {
        targetCtx.strokeStyle = 'rgba(148, 163, 184, 0.28)';
        targetCtx.lineWidth = 1;
        for (let gx = boxX; gx < boxX + boxW; gx += 28) {
          targetCtx.beginPath();
          targetCtx.moveTo(gx, boxY);
          targetCtx.lineTo(gx, boxY + boxH);
          targetCtx.stroke();
        }
        for (let gy = boxY; gy < boxY + boxH; gy += 28) {
          targetCtx.beginPath();
          targetCtx.moveTo(boxX, gy);
          targetCtx.lineTo(boxX + boxW, gy);
          targetCtx.stroke();
        }
      }

      let closestIdx = 0;
      let minSqDist = Infinity;
      for (let i = 0; i < routeWaypoints.length; i++) {
        const dLat = routeWaypoints[i][0] - state.lat;
        const dLon = routeWaypoints[i][1] - state.lon;
        const sq = dLat * dLat + dLon * dLon;
        if (sq < minSqDist) {
          minSqDist = sq;
          closestIdx = i;
        }
      }

      const rx = boxX + boxW * 0.5;
      const ry = boxY + boxH * 0.5;

      if (routeWaypoints.length >= 2) {
        targetCtx.lineCap = 'round';
        targetCtx.lineJoin = 'round';
        targetCtx.strokeStyle = 'rgba(9, 9, 11, 0.85)';
        targetCtx.lineWidth = 7;
        targetCtx.beginPath();
        for (let i = 0; i < routeWaypoints.length; i++) {
          const wp = routeWaypoints[i];
          const px = boxX + boxW * 0.5 + (lonToTileX(wp[1], zoom) - centerTileX) * 256;
          const py = boxY + boxH * 0.5 + (latToTileY(wp[0], zoom) - centerTileY) * 256;
          if (i === 0) targetCtx.moveTo(px, py);
          else targetCtx.lineTo(px, py);
        }
        targetCtx.stroke();

        targetCtx.strokeStyle = '#f97316';
        targetCtx.lineWidth = 4;
        targetCtx.stroke();

        targetCtx.strokeStyle = '#10b981';
        targetCtx.lineWidth = 4.5;
        targetCtx.beginPath();
        for (let i = 0; i <= closestIdx; i++) {
          const wp = routeWaypoints[i];
          const px = boxX + boxW * 0.5 + (lonToTileX(wp[1], zoom) - centerTileX) * 256;
          const py = boxY + boxH * 0.5 + (latToTileY(wp[0], zoom) - centerTileY) * 256;
          if (i === 0) targetCtx.moveTo(px, py);
          else targetCtx.lineTo(px, py);
        }
        targetCtx.lineTo(rx, ry);
        targetCtx.stroke();
      }

      if (tapStartLatLon) {
        const sx = boxX + boxW * 0.5 + (lonToTileX(tapStartLatLon[1], zoom) - centerTileX) * 256;
        const sy = boxY + boxH * 0.5 + (latToTileY(tapStartLatLon[0], zoom) - centerTileY) * 256;
        targetCtx.fillStyle = '#22c55e';
        targetCtx.beginPath();
        targetCtx.arc(sx, sy, 6, 0, Math.PI * 2);
        targetCtx.fill();
      }

      const pulseRadius = 9 + (Math.sin(performance.now() * 0.008) + 1) * 4;
      targetCtx.fillStyle = 'rgba(249, 115, 22, 0.35)';
      targetCtx.beginPath();
      targetCtx.arc(rx, ry, pulseRadius, 0, Math.PI * 2);
      targetCtx.fill();

      targetCtx.fillStyle = '#f97316';
      targetCtx.beginPath();
      targetCtx.arc(rx, ry, 6, 0, Math.PI * 2);
      targetCtx.fill();
      targetCtx.strokeStyle = '#ffffff';
      targetCtx.lineWidth = 2;
      targetCtx.stroke();

      targetCtx.fillStyle = 'rgba(9, 9, 11, 0.88)';
      targetCtx.beginPath();
      targetCtx.rect(boxX + 12, boxY + 12, 280, 28);
      targetCtx.fill();
      targetCtx.fillStyle = '#f4f4f5';
      targetCtx.font = 'bold 11px sans-serif';
      targetCtx.textAlign = 'left';
      targetCtx.fillText(
        'TACTICAL GPS: ' + state.speedKmh.toFixed(1) + ' km/h  |  ' +
        (state.distanceMeters / 1000).toFixed(2) + ' km  |  ' + state.watts + ' W',
        boxX + 20,
        boxY + 30
      );

      targetCtx.restore();
    }

    fullMapCanvas.addEventListener('click', function(ev) {
      const rect = fullMapCanvas.getBoundingClientRect();
      const clickX = ev.clientX - rect.left;
      const clickY = ev.clientY - rect.top;
      const zoom = 15;
      const centerTileX = lonToTileX(state.lon, zoom);
      const centerTileY = latToTileY(state.lat, zoom);

      const clickedTileX = centerTileX + (clickX - fullMapCanvas.width * 0.5) / 256;
      const clickedTileY = centerTileY + (clickY - fullMapCanvas.height * 0.5) / 256;
      const clickedLat = tileYToLat(clickedTileY, zoom);
      const clickedLon = tileXToLon(clickedTileX, zoom);

      if (!tapStartLatLon) {
        tapStartLatLon = [clickedLat, clickedLon];
        mapHintEl.textContent =
          'Start Pin set (' + clickedLat.toFixed(4) + ', ' + clickedLon.toFixed(4) + '). Tap Destination Pin.';
      } else {
        const sLat = tapStartLatLon[0];
        const sLon = tapStartLatLon[1];
        tapStartLatLon = null;
        mapHintEl.textContent =
          'Requesting OSRM road route to (' + clickedLat.toFixed(4) + ', ' + clickedLon.toFixed(4) + ')...';
        if (window.AndroidBridge && window.AndroidBridge.onMapRouteRequested) {
          window.AndroidBridge.onMapRouteRequested(sLat, sLon, clickedLat, clickedLon);
        }
      }
    });

    // ==========================================
    // THREE.JS 3D WORLD & CURVED VISOR HUD ENGINE
    // ==========================================
    const threeCanvas = document.getElementById('three-canvas');
    let renderer, scene, camera, cameraRig;
    let isThreeSupported = false;
    let lastHudRenderTime = 0;
    let contextLostListenerAttached = false;

    // Road & Environment objects
    let roadMesh, roadTexture, groundMesh, skyDome;
    let treesGroup, archMesh, archSignCtx, archSignTexture, botsGroup, bikeGroup;
    let visorMesh, hudCanvas, hudCtx, hudTexture;

    // Avatar parts for articulation
    let cyclistGroup, crankGroup, frontWheel, rearWheel;
    let leftLegData = null, rightLegData = null;
    const _upVec = new THREE.Vector3(0, 1, 0);
    const _tmpDir = new THREE.Vector3();
    const _tmpQuat = new THREE.Quaternion();
    const _vecA = new THREE.Vector3();
    const _vecB = new THREE.Vector3();

    function initThree() {
      try {
        if (typeof THREE === 'undefined') {
          console.warn('Three.js not loaded, using fallback 2D engine');
          return false;
        }

        renderer = new THREE.WebGLRenderer({
          canvas: threeCanvas,
          antialias: true,
          powerPreference: 'high-performance'
        });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;

        if (!contextLostListenerAttached) {
          contextLostListenerAttached = true;
          threeCanvas.addEventListener('webglcontextlost', function(e) {
            e.preventDefault();
            console.warn('WebGL context lost. Falling back to 2D HUD canvas.');
            isThreeSupported = false;
            threeCanvas.style.display = 'none';
            fallback2dCanvas.style.display = 'block';
          }, false);

          threeCanvas.addEventListener('webglcontextrestored', function() {
            console.info('WebGL context restored. Rebuilding Three.js scene.');
            initThree();
            isThreeSupported = true;
            threeCanvas.style.display = 'block';
            fallback2dCanvas.style.display = 'none';
          }, false);
        }

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x09090b);
        scene.fog = new THREE.FogExp2(0x0f172a, 0.009);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffedd5, 1.3);
        sunLight.position.set(20, 45, 30);
        scene.add(sunLight);

        const fillLight = new THREE.DirectionalLight(0x38bdf8, 0.5);
        fillLight.position.set(-20, 20, -20);
        scene.add(fillLight);

        // Camera rig
        cameraRig = new THREE.Group();
        camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 800);
        cameraRig.add(camera);
        scene.add(cameraRig);

        createEnvironment();
        createBicycleAndCyclist();
        createBotPacers();
        createCurvedVisorHud();

        isThreeSupported = true;
        return true;
      } catch (err) {
        console.error('Failed to initialize Three.js:', err);
        return false;
      }
    }

    function roadCurveAt(zMeters) {
      return (
        state.curvature * 1.0 +
        Math.sin(zMeters * 0.0075) * 1.4 +
        Math.cos(zMeters * 0.0032) * 0.8
      );
    }

    // Sky Dome, Ground Terrain, Trees, & Banners
    function createEnvironment() {
      // Sky Dome
      const skyGeo = new THREE.SphereGeometry(400, 24, 16);
      const skyMat = new THREE.MeshBasicMaterial({
        color: 0x0284c7,
        side: THREE.BackSide
      });
      skyDome = new THREE.Mesh(skyGeo, skyMat);
      skyDome.position.set(0, 0, -100);
      scene.add(skyDome);

      // Rolling Ground
      const groundGeo = new THREE.PlaneGeometry(350, 400, 16, 16);
      groundGeo.rotateX(-Math.PI / 2);
      const groundMat = new THREE.MeshLambertMaterial({ color: 0x14532d });
      groundMesh = new THREE.Mesh(groundGeo, groundMat);
      groundMesh.position.set(0, -0.05, -100);
      scene.add(groundMesh);

      // 1. Procedural Scrolling Road Texture Canvas (Asphalt, Orange/White Curbs, Dashed Yellow Center)
      const roadTexCanvas = document.createElement('canvas');
      roadTexCanvas.width = 256;
      roadTexCanvas.height = 256;
      const rctx = roadTexCanvas.getContext('2d');
      // Asphalt
      rctx.fillStyle = '#1e293b';
      rctx.fillRect(0, 0, 256, 256);
      // Left & Right Alternating Rumble Curbs
      rctx.fillStyle = '#f97316';
      rctx.fillRect(0, 0, 14, 128);
      rctx.fillRect(242, 0, 14, 128);
      rctx.fillStyle = '#f8fafc';
      rctx.fillRect(0, 128, 14, 128);
      rctx.fillRect(242, 128, 14, 128);
      // Dashed Center Line
      rctx.fillStyle = '#facc15';
      rctx.fillRect(124, 24, 8, 110);

      roadTexture = new THREE.CanvasTexture(roadTexCanvas);
      roadTexture.wrapS = THREE.RepeatWrapping;
      roadTexture.wrapT = THREE.RepeatWrapping;
      roadTexture.repeat.set(1, 24);

      // Road Geometry Ribbon spanning from z = +10 to z = -230
      const roadLength = 240;
      const roadSegments = 80;
      const roadWidth = 7.5;

      const roadGeo = new THREE.PlaneGeometry(roadWidth, roadLength, 1, roadSegments);
      roadGeo.rotateX(-Math.PI / 2);
      roadGeo.translate(0, 0, -110); // Center from +10 to -230 along -Z
      roadGeo.userData = {
        basePositions: new Float32Array(roadGeo.attributes.position.array)
      };

      const roadMat = new THREE.MeshLambertMaterial({
        map: roadTexture,
        side: THREE.DoubleSide
      });
      roadMesh = new THREE.Mesh(roadGeo, roadMat);
      scene.add(roadMesh);

      // Trees along hillsides
      treesGroup = new THREE.Group();
      const treeTrunkGeo = new THREE.CylinderGeometry(0.2, 0.3, 1.8, 6);
      const treeTrunkMat = new THREE.MeshLambertMaterial({ color: 0x451a03 });
      const treeConeGeo1 = new THREE.ConeGeometry(1.6, 3.2, 7);
      const treeConeGeo2 = new THREE.ConeGeometry(1.2, 2.5, 7);
      const treeFoliageMat1 = new THREE.MeshLambertMaterial({ color: 0x166534 });
      const treeFoliageMat2 = new THREE.MeshLambertMaterial({ color: 0x15803d });

      for (let i = 0; i < 48; i++) {
        const tree = new THREE.Group();
        const trunk = new THREE.Mesh(treeTrunkGeo, treeTrunkMat);
        trunk.position.y = 0.9;
        const c1 = new THREE.Mesh(treeConeGeo1, treeFoliageMat1);
        c1.position.y = 2.4;

    // Helper to position & orient a 3D tube between two points
    function createFrameTube(p1, p2, radius, mat) {
      const v1 = new THREE.Vector3(p1[0], p1[1], p1[2]);
      const v2 = new THREE.Vector3(p2[0], p2[1], p2[2]);
      const dist = v1.distanceTo(v2);
      const geo = new THREE.CylinderGeometry(radius, radius, dist, 8);
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.copy(v1).add(v2).multiplyScalar(0.5);
      const dir = new THREE.Vector3().subVectors(v2, v1).normalize();
      const quat = new THREE.Quaternion().setFromUnitVectors(_upVec, dir);
      mesh.setRotationFromQuaternion(quat);
      return mesh;
    }

    function alignCylinder(cylinderMesh, vA, vB) {
      cylinderMesh.position.set((vA.x + vB.x) * 0.5, (vA.y + vB.y) * 0.5, (vA.z + vB.z) * 0.5);
      _tmpDir.subVectors(vB, vA).normalize();
      _tmpQuat.setFromUnitVectors(_upVec, _tmpDir);
      cylinderMesh.setRotationFromQuaternion(_tmpQuat);
    }

    // Analytical Law of Cosines 2-Bone IK Leg Solver
    function updateLegIK(leg, crankAngle) {
      if (!leg) return;
      const phi = crankAngle + (leg.side > 0 ? 0 : Math.PI);
      const R = 0.165; // Crank arm radius
      const Py = 0.33 + R * Math.sin(phi);
      const Pz = -0.10 + R * Math.cos(phi);
      const Px = leg.side * 0.115;

      const Hy = leg.hip.y;
      const Hz = leg.hip.z;
      const Hx = leg.hip.x;

      const Dy = Py - Hy;
      const Dz = Pz - Hz;
      const d = Math.sqrt(Dy * Dy + Dz * Dz);

      const L1 = leg.L1;
      const L2 = leg.L2;

      // Law of Cosines for hip-to-thigh angle offset
      let cosAlpha = (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d);
      cosAlpha = Math.max(-1, Math.min(1, cosAlpha));
      const alpha = Math.acos(cosAlpha);

      // Angle from Hip to Pedal
      const beta = Math.atan2(Dy, Dz);

      // Forward knee bend towards +Z
      const theta1 = beta + alpha;
      const Ky = Hy + L1 * Math.sin(theta1);
      const Kz = Hz + L1 * Math.cos(theta1);
      const Kx = Hx;

      // Align Thigh from Hip to Knee
      _vecA.set(Hx, Hy, Hz);
      _vecB.set(Kx, Ky, Kz);
      alignCylinder(leg.thighMesh, _vecA, _vecB);

      // Position Knee joint
      leg.kneeMesh.position.set(Kx, Ky, Kz);

      // Align Calf from Knee to Pedal
      _vecA.set(Kx, Ky, Kz);
      _vecB.set(Px, Py, Pz);
      alignCylinder(leg.calfMesh, _vecA, _vecB);

      // Align White Sock at the lower portion of the calf
      _vecA.set(Kx * 0.25 + Px * 0.75, Ky * 0.25 + Py * 0.75, Kz * 0.25 + Pz * 0.75);
      _vecB.set(Px, Py, Pz);
      alignCylinder(leg.sockMesh, _vecA, _vecB);

      // Position Road Shoe with slight dynamic ankle flex
      leg.shoeMesh.position.set(Px, Py - 0.015, Pz + 0.02);
      leg.shoeMesh.rotation.x = -Math.sin(phi) * 0.18;
    }

    function createCurvedVisorHud() {
      hudCanvas = document.createElement('canvas');
      hudCanvas.width = 1600;
      hudCanvas.height = 800;
      hudCanvas.style.fontVariantNumeric = 'tabular-nums';
      hudCtx = hudCanvas.getContext('2d');

      hudTexture = new THREE.CanvasTexture(hudCanvas);
      hudTexture.minFilter = THREE.LinearFilter;
      hudTexture.magFilter = THREE.LinearFilter;

      // Curved Visor Cylinder: Radius 1.75m, Height 1.05m, subtending ~79 degrees
      const visorRadius = 1.75;
      const visorHeight = 1.05;
      const visorArc = Math.PI * 0.44; // ~79 degrees
      const visorGeo = new THREE.CylinderGeometry(
        visorRadius, visorRadius, visorHeight, 40, 1, true,
        -visorArc / 2, visorArc
      );
      // Flip Z so inner concave face curves in front of the camera at z = -1.75 without flipping X
      visorGeo.scale(1, 1, -1);

      const visorMat = new THREE.MeshBasicMaterial({
        map: hudTexture,
        transparent: true,
        opacity: 0.96,
        side: THREE.DoubleSide,
        depthTest: false,
        depthWrite: false
      });

      visorMesh = new THREE.Mesh(visorGeo, visorMat);
      visorMesh.renderOrder = 999;
      visorMesh.position.set(0, 0, 0);
      visorMesh.rotation.set(0, 0, 0);
      // Parent directly to camera so it remains centered in view across CHASE, POV, DRONE
      camera.add(visorMesh);
    }

    // Canvas helper for rounded glass panels with smooth borders
    function drawGlassPanel(ctx, x, y, w, h, r, borderColor, bgAlpha) {
      ctx.save();
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(x, y, w, h, r);
      } else {
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
      }
      ctx.fillStyle = 'rgba(9, 9, 11, ' + (bgAlpha !== undefined ? bgAlpha : 0.78) + ')';
      ctx.fill();
      ctx.strokeStyle = borderColor || 'rgba(255, 255, 255, 0.14)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();
    }

    // High-DPI 2D Visor HUD Painter: Layout A (Open Center Viewport)
    function renderVisorHud(now) {
      if (!hudCtx) return;
      const w = hudCanvas.width;
      const h = hudCanvas.height;

      hudCtx.clearRect(0, 0, w, h);

      const pColor = ZONE_COLORS[state.powerZone] || '#F97316';
      const hrColor = ZONE_COLORS[state.hrZone] || '#FB7185';
      const pZoneName = ZONE_NAMES[state.powerZone] || 'Z3 TEMPO';
      const gradeColor = state.gradePercent > 4.0 ? '#F43F5E' : (state.gradePercent > 0.0 ? '#FBBF24' : '#34D399');

      const maxDisplayWatts = Math.max(450, state.ftpWatts * 1.5);
      const powerFraction = Math.min(1.0, Math.max(0.0, state.watts / maxDisplayWatts));

      const cx = w * 0.5;

      // 1. TOP-CENTER FLOATING PILL (Workout Ribbon or Route Pill)
      if (state.isWorkoutActive) {
        const pillW = 660;
        const pillH = 68;
        const pillX = cx - pillW / 2;
        const pillY = 56;
        const isPulse = (state.workoutStepRemainingSec <= 3 || state.isWorkoutPaused) && Math.sin(now * 0.015) > 0;
        const borderColor = isPulse ? '#F43F5E' : pColor;

        drawGlassPanel(hudCtx, pillX, pillY, pillW, pillH, 34, borderColor, 0.88);

        // Top accent line in target zone color
        hudCtx.save();
        hudCtx.fillStyle = isPulse ? '#F43F5E' : pColor;
        hudCtx.beginPath();
        hudCtx.roundRect ? hudCtx.roundRect(pillX + 30, pillY, pillW - 60, 3.5, 2) : hudCtx.rect(pillX + 30, pillY, pillW - 60, 3.5);
        hudCtx.fill();
        hudCtx.restore();

        // Left Section: Step info
        hudCtx.save();
        hudCtx.textAlign = 'left';
        hudCtx.fillStyle = '#A1A1AA';
        hudCtx.font = 'bold 11px sans-serif';
        const biasText = state.workoutIntensityBiasPercent !== 0 ? ' (' + (state.workoutIntensityBiasPercent > 0 ? '+' : '') + state.workoutIntensityBiasPercent + '%)' : '';
        hudCtx.fillText('STEP ' + (state.workoutStepIndex + 1) + ' OF ' + state.workoutTotalSteps + biasText, pillX + 28, pillY + 26);

        hudCtx.fillStyle = '#FFFFFF';
        hudCtx.font = '900 16px sans-serif';
        hudCtx.fillText(state.workoutStepName.toUpperCase(), pillX + 28, pillY + 45);

        hudCtx.fillStyle = '#38BDF8';
        hudCtx.font = 'bold 11px sans-serif';
        hudCtx.fillText('TARGET ' + state.workoutTargetWatts + 'W @ ' + state.workoutTargetRpm + ' RPM', pillX + 28, pillY + 60);
        hudCtx.restore();

        // Center Section: Prominent Countdown Timer
        hudCtx.save();
        hudCtx.textAlign = 'center';
        const remMins = Math.floor(state.workoutStepRemainingSec / 60);
        const remSecs = state.workoutStepRemainingSec % 60;
        const remStr = String(remMins).padStart(2, '0') + ':' + String(remSecs).padStart(2, '0');
        hudCtx.fillStyle = isPulse ? '#F43F5E' : '#FFFFFF';
        hudCtx.font = '900 32px sans-serif';
        hudCtx.fillText(remStr, cx, pillY + 42);

        hudCtx.fillStyle = isPulse ? '#F43F5E' : '#A1A1AA';
        hudCtx.font = 'bold 10px sans-serif';
        hudCtx.fillText(state.isWorkoutPaused ? 'PAUSED' : 'REMAINING', cx, pillY + 58);
        hudCtx.restore();

        // Right Section: Earned Stars & Compliance
        hudCtx.save();
        hudCtx.textAlign = 'right';
        hudCtx.fillStyle = '#FBBF24';
        hudCtx.font = 'bold 15px sans-serif';
        hudCtx.fillText('★ ' + state.workoutEarnedStars, pillX + pillW - 28, pillY + 26);

        hudCtx.fillStyle = '#34D399';
        hudCtx.font = '900 14px sans-serif';
        hudCtx.fillText(state.workoutCompliancePercent.toFixed(0) + '% COMPL', pillX + pillW - 28, pillY + 44);

        if (state.workoutPacingPrompt) {
          hudCtx.fillStyle = state.workoutPacingPrompt.indexOf('ON TARGET') !== -1 ? '#34D399' : '#F97316';
          hudCtx.font = 'bold 10px sans-serif';
          hudCtx.fillText(state.workoutPacingPrompt, pillX + pillW - 28, pillY + 60);
        }
        hudCtx.restore();
      } else {
        const pillW = 430;
        const pillH = 44;
        const pillX = cx - pillW / 2;
        const pillY = 56;
        drawGlassPanel(hudCtx, pillX, pillY, pillW, pillH, 22, 'rgba(255, 255, 255, 0.16)', 0.82);

        // Live GPS Pulsing Dot
        hudCtx.save();
        hudCtx.fillStyle = '#34D399';
        hudCtx.beginPath();
        hudCtx.arc(pillX + 28, pillY + 22, 5, 0, Math.PI * 2);
        hudCtx.fill();

        hudCtx.textAlign = 'left';
        hudCtx.fillStyle = '#F4F4F5';
        hudCtx.font = 'bold 13px sans-serif';
        hudCtx.fillText(state.activeRouteName.toUpperCase(), pillX + 44, pillY + 26);

        hudCtx.textAlign = 'right';
        hudCtx.fillStyle = gradeColor;
        hudCtx.font = '900 13px sans-serif';
        const gSign = state.gradePercent >= 0 ? '+' : '';
        hudCtx.fillText(gSign + state.gradePercent.toFixed(1) + '%', pillX + pillW - 24, pillY + 26);
        hudCtx.restore();
      }

      // 2. BOTTOM-LEFT FLOATING EFFORT CAPSULE (Watts, Zone, Cadence, HR)
      const leftCapsuleX = 76;
      const leftCapsuleY = 485;
      const capsuleW = 350;
      const capsuleH = 160;

      drawGlassPanel(hudCtx, leftCapsuleX, leftCapsuleY, capsuleW, capsuleH, 24, 'rgba(255, 255, 255, 0.14)', 0.80);

      // Corner accent indicator
      hudCtx.save();
      hudCtx.fillStyle = pColor;
      hudCtx.beginPath();
      hudCtx.roundRect ? hudCtx.roundRect(leftCapsuleX, leftCapsuleY + 24, 4, 60, 2) : hudCtx.rect(leftCapsuleX, leftCapsuleY + 24, 4, 60);
      hudCtx.fill();

      // Capsule Header
      hudCtx.textAlign = 'left';
      hudCtx.fillStyle = '#A1A1AA';
      hudCtx.font = 'bold 12px sans-serif';
      hudCtx.fillText('EFFORT & VITALS', leftCapsuleX + 22, leftCapsuleY + 26);

      // Hero Watts
      hudCtx.fillStyle = pColor;
      hudCtx.font = '900 58px sans-serif';
      hudCtx.shadowColor = pColor;
      hudCtx.shadowBlur = 12;
      hudCtx.fillText(String(state.watts), leftCapsuleX + 22, leftCapsuleY + 84);
      hudCtx.shadowBlur = 0;

      hudCtx.fillStyle = '#A1A1AA';
      hudCtx.font = 'bold 12px sans-serif';
      hudCtx.fillText('W  (' + state.wattsPerKg.toFixed(1) + ' W/KG)', leftCapsuleX + 24, leftCapsuleY + 104);

      // Zone Pill
      hudCtx.fillStyle = 'rgba(9, 9, 11, 0.85)';
      hudCtx.roundRect ? hudCtx.roundRect(leftCapsuleX + 22, leftCapsuleY + 114, 112, 22, 6) : hudCtx.rect(leftCapsuleX + 22, leftCapsuleY + 114, 112, 22);
      hudCtx.fill();
      hudCtx.strokeStyle = pColor;
      hudCtx.lineWidth = 1;
      hudCtx.stroke();
      hudCtx.fillStyle = pColor;
      hudCtx.font = 'bold 11px sans-serif';
      hudCtx.textAlign = 'center';
      hudCtx.fillText(pZoneName, leftCapsuleX + 78, leftCapsuleY + 129);

      // Horizontal Power Progress Bar along bottom of watts section
      const barW = 112;
      hudCtx.fillStyle = 'rgba(39, 39, 42, 0.85)';
      hudCtx.roundRect ? hudCtx.roundRect(leftCapsuleX + 22, leftCapsuleY + 144, barW, 5, 2.5) : hudCtx.rect(leftCapsuleX + 22, leftCapsuleY + 144, barW, 5);
      hudCtx.fill();
      hudCtx.fillStyle = pColor;
      hudCtx.roundRect ? hudCtx.roundRect(leftCapsuleX + 22, leftCapsuleY + 144, barW * powerFraction, 5, 2.5) : hudCtx.rect(leftCapsuleX + 22, leftCapsuleY + 144, barW * powerFraction, 5);
      hudCtx.fill();

      // Target power marker tick if in workout
      if (state.isWorkoutActive && state.workoutTargetWatts > 0) {
        const targetFrac = Math.min(1.0, Math.max(0.0, state.workoutTargetWatts / maxDisplayWatts));
        hudCtx.fillStyle = '#FFFFFF';
        hudCtx.fillRect(leftCapsuleX + 22 + barW * targetFrac - 1, leftCapsuleY + 142, 2.5, 9);
      }

      // Vertical Divider
      hudCtx.strokeStyle = 'rgba(255, 255, 255, 0.10)';
      hudCtx.lineWidth = 1;
      hudCtx.beginPath();
      hudCtx.moveTo(leftCapsuleX + 160, leftCapsuleY + 24);
      hudCtx.lineTo(leftCapsuleX + 160, leftCapsuleY + 146);
      hudCtx.stroke();

      // Cadence (RPM)
      hudCtx.textAlign = 'left';
      hudCtx.fillStyle = '#A1A1AA';
      hudCtx.font = 'bold 11px sans-serif';
      hudCtx.fillText('CADENCE', leftCapsuleX + 182, leftCapsuleY + 44);

      hudCtx.fillStyle = '#38BDF8';
      hudCtx.font = '900 30px sans-serif';
      hudCtx.fillText(String(state.rpm), leftCapsuleX + 182, leftCapsuleY + 76);
      hudCtx.fillStyle = '#A1A1AA';
      hudCtx.font = 'bold 12px sans-serif';
      hudCtx.fillText('RPM', leftCapsuleX + 248, leftCapsuleY + 74);

      // Heart Rate (BPM)
      const hrBpm = state.bpm > 0 ? state.bpm : '--';
      const heartPulse = 1.0 + (Math.sin(now * 0.009) * 0.12);
      hudCtx.fillStyle = '#A1A1AA';
      hudCtx.font = 'bold 11px sans-serif';
      hudCtx.fillText('HEART RATE', leftCapsuleX + 182, leftCapsuleY + 104);

      hudCtx.fillStyle = hrColor;
      hudCtx.font = '900 30px sans-serif';
      hudCtx.fillText(String(hrBpm), leftCapsuleX + 182, leftCapsuleY + 136);
      hudCtx.fillStyle = '#A1A1AA';
      hudCtx.font = 'bold 12px sans-serif';
      hudCtx.fillText('BPM', leftCapsuleX + 250, leftCapsuleY + 134);

      // Mini Cardiac waveform
      hudCtx.strokeStyle = hrColor;
      hudCtx.lineWidth = 1.8;
      hudCtx.beginPath();
      const waveX = leftCapsuleX + 182;
      const waveY = leftCapsuleY + 148;
      hudCtx.moveTo(waveX, waveY);
      hudCtx.lineTo(waveX + 28, waveY);
      hudCtx.lineTo(waveX + 38, waveY - 8 * heartPulse);
      hudCtx.lineTo(waveX + 48, waveY + 8 * heartPulse);
      hudCtx.lineTo(waveX + 58, waveY);
      hudCtx.lineTo(waveX + 140, waveY);
      hudCtx.stroke();
      hudCtx.restore();

      // 3. BOTTOM-RIGHT FLOATING COURSE CAPSULE (Speed, Distance, Grade, Elevation)
      const rightCapsuleX = w - leftCapsuleX - capsuleW;
      const rightCapsuleY = leftCapsuleY;

      drawGlassPanel(hudCtx, rightCapsuleX, rightCapsuleY, capsuleW, capsuleH, 24, 'rgba(255, 255, 255, 0.14)', 0.80);

      // Header
      hudCtx.save();
      hudCtx.textAlign = 'left';
      hudCtx.fillStyle = '#A1A1AA';
      hudCtx.font = 'bold 12px sans-serif';
      hudCtx.fillText('COURSE TELEMETRY', rightCapsuleX + 22, rightCapsuleY + 26);

      // Hero Speed
      hudCtx.fillStyle = '#FFFFFF';
      hudCtx.font = '900 54px sans-serif';
      hudCtx.fillText(state.speedKmh.toFixed(1), rightCapsuleX + 22, rightCapsuleY + 82);
      hudCtx.fillStyle = '#A1A1AA';
      hudCtx.font = 'bold 12px sans-serif';
      hudCtx.fillText('KM / H', rightCapsuleX + 24, rightCapsuleY + 102);

      // Distance & Elapsed Time
      const mins = Math.floor(state.elapsedSeconds / 60);
      const secs = state.elapsedSeconds % 60;
      const timeStr = String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
      hudCtx.fillStyle = '#F4F4F5';
      hudCtx.font = 'bold 14px sans-serif';
      hudCtx.fillText((state.distanceMeters / 1000).toFixed(2) + ' KM', rightCapsuleX + 24, rightCapsuleY + 128);
      hudCtx.fillStyle = '#A1A1AA';
      hudCtx.font = 'bold 12px sans-serif';
      hudCtx.fillText('TIME ' + timeStr, rightCapsuleX + 24, rightCapsuleY + 146);

      // Vertical Divider
      hudCtx.strokeStyle = 'rgba(255, 255, 255, 0.10)';
      hudCtx.lineWidth = 1;
      hudCtx.beginPath();
      hudCtx.moveTo(rightCapsuleX + 175, rightCapsuleY + 24);
      hudCtx.lineTo(rightCapsuleX + 175, rightCapsuleY + 146);
      hudCtx.stroke();

      // Road Grade
      hudCtx.fillStyle = '#A1A1AA';
      hudCtx.font = 'bold 11px sans-serif';
      hudCtx.fillText('ROAD GRADE', rightCapsuleX + 195, rightCapsuleY + 44);

      hudCtx.fillStyle = gradeColor;
      hudCtx.font = '900 28px sans-serif';
      const gradeSign = state.gradePercent >= 0 ? '+' : '';
      hudCtx.fillText(gradeSign + state.gradePercent.toFixed(1) + '%', rightCapsuleX + 195, rightCapsuleY + 78);

      // Mini Elevation Profile Ribbon
      const pX = rightCapsuleX + 195;
      const pY = rightCapsuleY + 138;
      const profW = 125;

      hudCtx.fillStyle = 'rgba(39, 39, 42, 0.65)';
      hudCtx.roundRect ? hudCtx.roundRect(pX, rightCapsuleY + 95, profW, 46, 6) : hudCtx.rect(pX, rightCapsuleY + 95, profW, 46);
      hudCtx.fill();

      hudCtx.strokeStyle = '#F97316';
      hudCtx.lineWidth = 2;
      hudCtx.beginPath();
      hudCtx.moveTo(pX, pY - 6);
      hudCtx.lineTo(pX + 25, pY - 14);
      hudCtx.lineTo(pX + 55, pY - 32);
      hudCtx.lineTo(pX + 85, pY - 20);
      hudCtx.lineTo(pX + profW, pY - 34);
      hudCtx.stroke();

      // Rider dot on elevation profile
      const profDotX = pX + ((state.distanceMeters % 4000) / 4000) * profW;
      hudCtx.fillStyle = '#FFFFFF';
      hudCtx.beginPath();
      hudCtx.arc(profDotX, pY - 22, 4, 0, Math.PI * 2);
      hudCtx.fill();
      hudCtx.restore();

      // Signal Three.js that texture needs update
      hudTexture.needsUpdate = true;
    }

    // ==========================================
    // DYNAMIC WORLD & SCENERY DEFORMATION
    // ==========================================
    function updateWorldGeometry(localDist) {
      // 1. Scroll Road Texture
      if (roadTexture) {
        roadTexture.offset.y = -(localDist * 0.1) % 1;
      }

      // 2. Deform Road Ribbon Vertices along -Z
      if (roadMesh && roadMesh.geometry.userData.basePositions) {
        const pos = roadMesh.geometry.attributes.position;
        const base = roadMesh.geometry.userData.basePositions;
        for (let i = 0; i < pos.count; i++) {
          const bX = base[i * 3];
          const bZ = base[i * 3 + 2];
          const d = -bZ; // Distance ahead of rider along -Z
          const relD = Math.max(0, d);
          const curveOffset = (roadCurveAt(localDist + relD) - roadCurveAt(localDist)) * (relD / 35);
          const slopeOffset = relD * (state.gradePercent * 0.006);
          pos.setX(i, bX + curveOffset);
          pos.setY(i, slopeOffset);
        }
        pos.needsUpdate = true;
      }

      // 3. Scroll Trees along -Z
      if (treesGroup) {
        for (let i = 0; i < treesGroup.children.length; i++) {
          const tree = treesGroup.children[i];
          const d = ((tree.userData.baseDist - (localDist % 240)) + 240) % 240 - 10;
          const relD = Math.max(0, d);
          const curveX = (roadCurveAt(localDist + relD) - roadCurveAt(localDist)) * (relD / 35);
          const slopeY = relD * (state.gradePercent * 0.006);
          tree.position.set(curveX + tree.userData.side * tree.userData.lateral, slopeY, -d);
        }
      }

      // 4. Distance Milestone Arch Gate (Every 500m)
      if (archMesh) {
        const nextMilestone = Math.ceil((localDist + 5) / 500) * 500;
        const d = nextMilestone - localDist;
        if (d > 0 && d < 230) {
          archMesh.visible = true;
          const curveX = (roadCurveAt(localDist + d) - roadCurveAt(localDist)) * (d / 35);
          const slopeY = d * (state.gradePercent * 0.006);
          archMesh.position.set(curveX, slopeY, -d);
          if (archMesh.userData.currentKm !== nextMilestone) {
            archMesh.userData.currentKm = nextMilestone;
            updateArchSignText(archSignCtx, archSignTexture, (nextMilestone / 1000).toFixed(1) + ' KM');
          }
        } else {
          archMesh.visible = false;
        }
      }

      // 5. Position AI Bots along -Z
      if (botsGroup) {
        const riderLoop = ((localDist % 4000) + 4000) % 4000;
        for (let b = 0; b < botsGroup.children.length; b++) {
          const botMesh = botsGroup.children[b];
          const bData = bots[b];
          let relDist = bData.dist - riderLoop;
          if (relDist < -20) relDist += 4000;
          if (relDist < 220) {
            botMesh.visible = true;
            const relD = Math.max(0, relDist);
            const curveX = (roadCurveAt(localDist + relD) - roadCurveAt(localDist)) * (relD / 35);
            const slopeY = relD * (state.gradePercent * 0.006);
            botMesh.position.set(curveX + bData.laneOffset * 2.0, slopeY, -relDist);
          } else {
            botMesh.visible = false;
          }
        }
      }
    }

    // ==========================================
    // MAIN ANIMATION & RENDERING LOOP
    // ==========================================
    let lastTime = performance.now();
    let cameraInertiaPitch = 0;
    let cameraInertiaRoll = 0;

    function animate(now) {
      try {
        const dt = Math.min(0.1, Math.max(0.001, (now - lastTime) / 1000));
        lastTime = now;

        // Update physics calculations
        const speedMs = (state.speedKmh * 1000) / 3600;
        state.wheelRotationRad += (speedMs / 0.35) * dt;
        state.crankAngleRad += ((state.rpm / 60) * Math.PI * 2) * dt;

        // Update AI Bot distances
        for (let i = 0; i < bots.length; i++) {
          bots[i].dist = (bots[i].dist + bots[i].speedMs * dt) % 4000;
        }

        // If in MAP Mode, render the full 2D Tactical OpenStreetMap View
        if (state.cameraMode === 'MAP') {
          threeCanvas.style.display = 'none';
          fallback2dCanvas.style.display = 'block';
          renderGpsMap(fallbackCtx, 0, 0, fallback2dCanvas.width, fallback2dCanvas.height, 15);
        } else if (isThreeSupported) {
          threeCanvas.style.display = 'block';
          fallback2dCanvas.style.display = 'none';

          const localDist = state.distanceMeters;
          const currentCurve = roadCurveAt(localDist);
          const currentSlope = state.gradePercent * 0.05;

          // 1. Update Cyclist and Bike
          if (frontWheel && rearWheel) {
            frontWheel.rotation.x = state.wheelRotationRad;
            rearWheel.rotation.x = state.wheelRotationRad;
          }
          if (crankGroup) {
            crankGroup.rotation.x = state.crankAngleRad;
          }
          if (leftLegData && rightLegData) {
            updateLegIK(leftLegData, state.crankAngleRad);
            updateLegIK(rightLegData, state.crankAngleRad);
          }
          if (cyclistGroup) {
            cyclistGroup.rotation.z = Math.sin(state.crankAngleRad) * 0.035;
          }
          if (bikeGroup) {
            // Bike lean into corners (facing -Z)
            const bikeLean = -currentCurve * 0.35;
            bikeGroup.rotation.z = bikeLean;
            bikeGroup.rotation.x = -currentSlope * 0.5;
            bikeGroup.position.x = currentCurve * 0.35;
          }

          // 2. Deform Road & Scroll Scenery along -Z
          updateWorldGeometry(localDist);

          // 3. Update Camera Modes & Dynamic Inertia (Camera points toward -Z)
          const targetPitch = -currentSlope * 0.4;
          const targetRoll = -currentCurve * 0.15;
          cameraInertiaPitch += (targetPitch - cameraInertiaPitch) * 4.0 * dt;
          cameraInertiaRoll += (targetRoll - cameraInertiaRoll) * 4.0 * dt;

          if (state.cameraMode === 'POV') {
            // First-person cockpit: looking forward over the drops toward -Z
            cameraRig.position.set(bikeGroup.position.x, 1.35, -0.15);
            camera.position.set(0, 0, 0);
            camera.rotation.set(cameraInertiaPitch, 0, cameraInertiaRoll);
          } else if (state.cameraMode === 'DRONE') {
            // Elevated overview behind (+Z) looking down forward (-Z)
            cameraRig.position.set(bikeGroup.position.x * 0.6, 4.8, 8.5);
            camera.position.set(0, 0, 0);
            camera.rotation.set(-0.32 + cameraInertiaPitch * 0.5, 0, cameraInertiaRoll * 0.5);
          } else {
            // Dynamic 3/4 CHASE Mode: Lateral offset (+0.65m X) and slightly elevated,
            // revealing bicycle frame, deep wheels, curved spine, and 2-segment leg articulation
            cameraRig.position.set(bikeGroup.position.x * 0.75 + 0.65, 1.68, 3.35);
            camera.position.set(0, 0, 0);
            camera.rotation.set(-0.11 + cameraInertiaPitch, -0.16 + cameraInertiaRoll * 0.5, cameraInertiaRoll);
          }

          // Subtle visor inertia lag relative to camera
          if (visorMesh) {
            visorMesh.visible = true;
            visorMesh.position.set(-cameraInertiaRoll * 0.06, cameraInertiaPitch * 0.05, 0);
            visorMesh.rotation.set(0, 0, -cameraInertiaRoll * 0.2);
          }

          // 4. Update Visor HUD Canvas Texture (throttled to ~30 FPS to save GPU memory bandwidth & prevent thermal throttling)
          if (now - lastHudRenderTime >= 32) {
            renderVisorHud(now);
            lastHudRenderTime = now;
          }

          // 5. Render Three.js Scene
          renderer.render(scene, camera);
        }

        // Modal map if open
        if (state.isMapModalOpen) {
          renderGpsMap(fullMapCtx, 0, 0, fullMapCanvas.width, fullMapCanvas.height, 15);
        }
      } catch (err) {
        console.error('Render error:', err);
      } finally {
        requestAnimationFrame(animate);
      }
    }

    function resize() {
      const w = window.innerWidth || document.documentElement.clientWidth || 800;
      const h = window.innerHeight || document.documentElement.clientHeight || 450;

      fallback2dCanvas.width = w;
      fallback2dCanvas.height = h;

      if (renderer && camera) {
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      }

      if (state.isMapModalOpen) {
        fullMapCanvas.width = Math.max(240, fullMapContainer.clientWidth || (w - 340));
        fullMapCanvas.height = Math.max(160, fullMapContainer.clientHeight || (h - 200));
      }
    }

    // Single Guarded Bootstrap
    let hasBootstrapped = false;
    function bootstrap() {
      if (hasBootstrapped) return;
      hasBootstrapped = true;
      initThree();
      resize();
      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', resize);
    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', bootstrap);
    } else {
      bootstrap();
    }
  </script>
</body>
</html>
