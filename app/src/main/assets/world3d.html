<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>LazyFitBike 3D Cockpit &amp; Holographic Visor HUD</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0B1510;
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    #viewport-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #three-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #fullmap-container {
      display: none;
      position: absolute;
      top: 60px;
      bottom: 74px;
      left: 310px;
      right: 14px;
      border-radius: 14px;
      border: 2px solid #C8F04A;
      background: #0B1510;
      overflow: hidden;
      z-index: 50;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.65);
    }
    #fullmap-canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }
    #map-hint {
      position: absolute;
      bottom: 8px;
      left: 10px;
      right: 10px;
      background: rgba(11, 21, 16, 0.92);
      color: #F4F7F2;
      border: 1px solid #1E3328;
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      pointer-events: none;
      font-variant-numeric: tabular-nums;
    }
    #map-status-banner {
      display: none;
      position: absolute;
      top: 62px;
      left: 10px;
      right: 10px;
      z-index: 65;
      background: rgba(11, 21, 16, 0.96);
      color: #F4F7F2;
      border: 1.5px solid #C8F04A;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 700;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-variant-numeric: tabular-nums;
    }
    #map-status-banner.is-loading {
      display: flex;
      border-color: #C8F04A;
      color: #C8F04A;
    }
    #map-status-banner.is-error {
      display: flex;
      border-color: #FB7185;
      color: #F4F7F2;
    }
    #btn-retry-route {
      display: none;
      background: #C8F04A;
      border-color: #C8F04A;
      color: #0B1510;
      flex-shrink: 0;
    }
    #map-controls {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 6px;
      z-index: 60;
    }
    .map-btn {
      background: rgba(11, 21, 16, 0.92);
      color: #F4F7F2;
      border: 1px solid #1E3328;
      border-radius: 10px;
      padding: 6px 12px;
      min-height: 44px;
      min-width: 44px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }
    .map-btn:active {
      background: #C8F04A;
      border-color: #C8F04A;
      color: #0B1510;
    }
    #fallback-2d-canvas {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
    }
  </style>
  <script src="js/three.min.js"></script>
</head>
<body>
  <div id="viewport-container">
    <canvas id="three-canvas"></canvas>
    <canvas id="fallback-2d-canvas"></canvas>
  </div>

  <div id="fullmap-container">
    <canvas id="fullmap-canvas"></canvas>
    <div id="map-controls">
      <button class="map-btn" id="btn-locate-gps" type="button" style="background:#C8F04A;border-color:#C8F04A;color:#0B1510;">My GPS</button>
      <button class="map-btn" id="btn-zoom-in" type="button">+</button>
      <button class="map-btn" id="btn-zoom-out" type="button">-</button>
      <button class="map-btn" id="btn-recenter" type="button">Rider</button>
      <button class="map-btn" id="btn-clear-pin" type="button">Clear Pin</button>
    </div>
    <div id="map-status-banner" role="status" aria-live="polite">
      <span id="map-status-text"></span>
      <button class="map-btn" id="btn-retry-route" type="button">Retry Route</button>
    </div>
    <div id="map-hint">OpenStreetMap Live View: Tap 'My GPS', drag to pan, or tap any 2 points to build a road route.</div>
  </div>

  <script>
    // State management & telemetry bridge
    const state = {
      speedKmh: 0,
      rpm: 0,
      watts: 0,
      gradePercent: 0,
      distanceMeters: 0,
      cameraMode: 'CHASE',
      lat: 45.0592,
      lon: 6.0358,
      curvature: 0,
      isMapModalOpen: false,
      crankAngleRad: 0,
      // Extended telemetry
      bpm: 0,
      wattsPerKg: 0.0,
      ftpWatts: 200,
      powerZone: 1,
      hrZone: 1,
      elapsedSeconds: 0,
      activeRouteName: "Alpe d'Huez Climb",
      isDrafting: false,
      nearestBotLabel: 'Bot C (2.5 W/kg) +12m',
      routeTotalMeters: 4000,
      hasGoogleMapsKey: false,
      wheelRotationRad: 0,
      // Structured Workout State
      isWorkoutActive: false,
      workoutName: '',
      workoutTargetWatts: 0,
      workoutTargetRpm: 0,
      workoutStepRemainingSec: 0,
      workoutStepIndex: 0,
      workoutTotalSteps: 0,
      workoutStepName: '',
      workoutCompliancePercent: 100,
      workoutEarnedStars: 0,
      workoutPacingPrompt: '',
      workoutIntensityBiasPercent: 0,
      isWorkoutPaused: false
    };

    let routeWaypoints = [
      [45.0592, 6.0358, 724],
      [45.0655, 6.0431, 860],
      [45.0721, 6.0472, 1118],
      [45.0832, 6.0555, 1420],
      [45.0924, 6.0706, 1815]
    ];

    const ZONE_COLORS = {
      1: '#94A3B8', // Zone 1 Gray: Active Recovery
      2: '#38BDF8', // Zone 2 Blue: Endurance
      3: '#34D399', // Zone 3 Green: Tempo
      4: '#FBBF24', // Zone 4 Amber: Threshold
      5: '#F43F5E'  // Zone 5 Red: VO2 Max / Anaerobic
    };

    const ZONE_NAMES = {
      1: 'Z1 RECOVERY',
      2: 'Z2 ENDURANCE',
      3: 'Z3 TEMPO',
      4: 'Z4 THRESHOLD',
      5: 'Z5 VO2 MAX'
    };

    const bots = [
      { name: 'Bot A (1.8 W/kg)', speedMs: 7.2, dist: 40, color: '#38bdf8', laneOffset: 0.8 },
      { name: 'Bot B (2.2 W/kg)', speedMs: 8.1, dist: 95, color: '#a3e635', laneOffset: -0.7 },
      { name: 'Bot C (2.5 W/kg)', speedMs: 8.8, dist: 18, color: '#fbbf24', laneOffset: 0.5 },
      { name: 'Bot D (3.0 W/kg)', speedMs: 9.8, dist: 180, color: '#f472b6', laneOffset: -0.6 },
      { name: 'Bot E (3.6 W/kg)', speedMs: 10.9, dist: 310, color: '#c084fc', laneOffset: 0.7 }
    ];

    function haversineMetersJs(lat1, lon1, lat2, lon2) {
      const R = 6371000.0;
      const dLat = (lat2 - lat1) * Math.PI / 180.0;
      const dLon = (lon2 - lon1) * Math.PI / 180.0;
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180.0) * Math.cos(lat2 * Math.PI / 180.0) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(Math.max(0.0, 1.0 - a)));
      return R * c;
    }

    function computeBearingDegJs(lat1, lon1, lat2, lon2) {
      const phi1 = lat1 * Math.PI / 180.0;
      const phi2 = lat2 * Math.PI / 180.0;
      const dLon = (lon2 - lon1) * Math.PI / 180.0;
      const y = Math.sin(dLon) * Math.cos(phi2);
      const x = Math.cos(phi1) * Math.sin(phi2) - Math.sin(phi1) * Math.cos(phi2) * Math.cos(dLon);
      const brng = Math.atan2(y, x) * 180.0 / Math.PI;
      return (brng + 360.0) % 360.0;
    }

    function shortestAngleDeg(fromDeg, toDeg) {
      return ((toDeg - fromDeg + 540.0) % 360.0) - 180.0;
    }

    function ensureRouteMetrics(wps) {
      if (!Array.isArray(wps) || wps.length < 2) return;
      let cumDist = 0;
      for (let i = 0; i < wps.length; i++) {
        const lat = Number(wps[i][0]) || 0;
        const lon = Number(wps[i][1]) || 0;
        const ele = Number(wps[i][2]) || 0;
        if (i > 0) {
          const prevLat = Number(wps[i - 1][0]) || 0;
          const prevLon = Number(wps[i - 1][1]) || 0;
          cumDist += haversineMetersJs(prevLat, prevLon, lat, lon);
        }
        const hasDist = wps[i].length >= 4 && wps[i][3] !== undefined && !isNaN(Number(wps[i][3]));
        const finalDist = hasDist ? Number(wps[i][3]) : cumDist;
        cumDist = finalDist;

        let bearing = 0;
        if (wps[i].length >= 5 && wps[i][4] !== undefined && !isNaN(Number(wps[i][4]))) {
          bearing = Number(wps[i][4]);
        } else if (i < wps.length - 1) {
          const nextLat = Number(wps[i + 1][0]) || lat;
          const nextLon = Number(wps[i + 1][1]) || lon;
          bearing = computeBearingDegJs(lat, lon, nextLat, nextLon);
        } else if (i > 0) {
          bearing = Number(wps[i - 1][4]) || 0;
        }
        wps[i] = [lat, lon, ele, finalDist, bearing];
      }
      const total = Number(wps[wps.length - 1][3]) || 0;
      if (total >= 50) {
        state.routeTotalMeters = total;
      }
    }

    ensureRouteMetrics(routeWaypoints);

    function defaultMapHintText() {
      return state.hasGoogleMapsKey
        ? 'Google Maps Routes v2 (Bicycle) + Real Elevation Active: Drag to pan, or tap any 2 points to build a route.'
        : 'OpenStreetMap Live View: Drag to pan, or tap any 2 points on the map to build an OSRM road route.';
    }

    // Android bridge entry points
    window.setRoutePolyline = function(jsonArrayStr) {
      try {
        const parsed = typeof jsonArrayStr === 'string' ? JSON.parse(jsonArrayStr) : jsonArrayStr;
        if (Array.isArray(parsed) && parsed.length >= 2) {
          routeWaypoints = parsed;
          ensureRouteMetrics(routeWaypoints);
          clearMapStatus();
          if (!tapStartLatLon) {
            mapViewLat = null;
            mapViewLon = null;
            if (mapHintEl) {
              mapHintEl.textContent = defaultMapHintText();
            }
          }
        }
      } catch (e) {}
    };

    window.centerMapAtLocation = function(lat, lon, setAsStartPin) {
      const nLat = Number(lat);
      const nLon = Number(lon);
      if (isNaN(nLat) || isNaN(nLon)) return;
      mapViewLat = nLat;
      mapViewLon = nLon;
      mapZoom = 15;
      if (setAsStartPin) {
        tapStartLatLon = [nLat, nLon];
        if (mapHintEl) {
          mapHintEl.textContent =
            'Centered on your GPS (' + nLat.toFixed(4) + ', ' + nLon.toFixed(4) + ') as Start Pin! Tap any Destination on the map.';
        }
      } else if (mapHintEl) {
        mapHintEl.textContent =
          'Centered on (' + nLat.toFixed(4) + ', ' + nLon.toFixed(4) + '). Tap Start Pin & Destination Pin.';
      }
    };

    window.updateRideState = function(
      speedKmh, rpm, watts, gradePercent, distanceMeters,
      cameraMode, lat, lon, curvature, isMapModalOpen,
      bpm, wattsPerKg, ftpWatts, powerZone, hrZone, elapsedSeconds, activeRouteName,
      isDrafting, nearestBotLabel, routeTotalMeters, hasGoogleMapsKey
    ) {
      state.speedKmh = Number(speedKmh) || 0;
      state.rpm = Number(rpm) || 0;
      state.watts = Math.max(0, Math.round(Number(watts) || 0));
      state.gradePercent = Number(gradePercent) || 0;
      state.distanceMeters = Number(distanceMeters) || 0;
      state.cameraMode = cameraMode || 'CHASE';
      if (lat !== undefined) state.lat = Number(lat) || state.lat;
      if (lon !== undefined) state.lon = Number(lon) || state.lon;
      if (curvature !== undefined) state.curvature = Number(curvature) || 0;

      if (bpm !== undefined) state.bpm = Math.max(0, Math.round(Number(bpm) || 0));
      if (wattsPerKg !== undefined) state.wattsPerKg = Number(wattsPerKg) || 0;
      if (ftpWatts !== undefined && Number(ftpWatts) > 0) state.ftpWatts = Number(ftpWatts);
      if (powerZone !== undefined && Number(powerZone) >= 1) state.powerZone = Math.min(5, Math.max(1, Math.round(Number(powerZone))));
      if (hrZone !== undefined && Number(hrZone) >= 1) state.hrZone = Math.min(5, Math.max(1, Math.round(Number(hrZone))));
      if (elapsedSeconds !== undefined) state.elapsedSeconds = Math.max(0, Math.round(Number(elapsedSeconds) || 0));
      if (activeRouteName) state.activeRouteName = String(activeRouteName);
      if (isDrafting !== undefined) state.isDrafting = Boolean(isDrafting);
      if (nearestBotLabel) state.nearestBotLabel = String(nearestBotLabel);
      if (routeTotalMeters !== undefined && Number(routeTotalMeters) >= 100) state.routeTotalMeters = Number(routeTotalMeters);
      if (hasGoogleMapsKey !== undefined) {
        const nextGmp = Boolean(hasGoogleMapsKey);
        if (nextGmp !== state.hasGoogleMapsKey) {
          state.hasGoogleMapsKey = nextGmp;
          if (mapHintEl && !tapStartLatLon) {
            mapHintEl.textContent = defaultMapHintText();
          }
        }
      }

      const shouldShowModal = Boolean(isMapModalOpen);
      const shouldShowInteractiveMap = shouldShowModal || state.cameraMode === 'MAP';
      const targetLeft = shouldShowModal ? '310px' : '14px';
      if (
        shouldShowModal !== state.isMapModalOpen ||
        (fullMapContainer.style.display === 'block') !== shouldShowInteractiveMap ||
        fullMapContainer.style.left !== targetLeft
      ) {
        state.isMapModalOpen = shouldShowModal;
        fullMapContainer.style.left = targetLeft;
        fullMapContainer.style.display = shouldShowInteractiveMap ? 'block' : 'none';
        resize();
      }
    };

    window.updateWorkoutHud = function(
      active, name, targetWatts, targetRpm, remainingSec, stepIdx, totalSteps,
      stepName, compliancePct, earnedStars, prompt, biasPct, paused
    ) {
      state.isWorkoutActive = Boolean(active);
      state.workoutName = name ? String(name) : '';
      state.workoutTargetWatts = Math.max(0, Math.round(Number(targetWatts) || 0));
      state.workoutTargetRpm = Math.max(0, Math.round(Number(targetRpm) || 0));
      state.workoutStepRemainingSec = Math.max(0, Math.round(Number(remainingSec) || 0));
      state.workoutStepIndex = Math.max(0, Math.round(Number(stepIdx) || 0));
      state.workoutTotalSteps = Math.max(0, Math.round(Number(totalSteps) || 0));
      state.workoutStepName = stepName ? String(stepName) : '';
      state.workoutCompliancePercent = Math.min(100, Math.max(0, Number(compliancePct) || 100));
      state.workoutEarnedStars = Math.max(0, Math.round(Number(earnedStars) || 0));
      state.workoutPacingPrompt = prompt ? String(prompt) : '';
      state.workoutIntensityBiasPercent = Math.round(Number(biasPct) || 0);
      state.isWorkoutPaused = Boolean(paused);
    };

    // OpenStreetMap 2D Map support (Modal & MAP mode)
    const osmTileCache = {};
    let tapStartLatLon = null;
    let mapViewLat = null;
    let mapViewLon = null;
    let mapZoom = 15;
    let isDraggingMap = false;
    let didPanMoved = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let dragStartCenterTileX = 0;
    let dragStartCenterTileY = 0;

    const fullMapContainer = document.getElementById('fullmap-container');
    const fullMapCanvas = document.getElementById('fullmap-canvas');
    const fullMapCtx = fullMapCanvas.getContext('2d');
    const mapHintEl = document.getElementById('map-hint');
    const mapStatusBannerEl = document.getElementById('map-status-banner');
    const mapStatusTextEl = document.getElementById('map-status-text');
    const btnRetryRouteEl = document.getElementById('btn-retry-route');
    let pendingRouteCoords = null;
    let routeRequestTimerId = null;

    function setMapStatus(mode, text) {
      if (!mapStatusBannerEl || !mapStatusTextEl || !btnRetryRouteEl) return;
      mapStatusBannerEl.classList.remove('is-loading', 'is-error');
      if (mode === 'loading') {
        mapStatusTextEl.textContent = text;
        btnRetryRouteEl.style.display = 'none';
        mapStatusBannerEl.classList.add('is-loading');
      } else if (mode === 'error') {
        mapStatusTextEl.textContent = text;
        btnRetryRouteEl.style.display = 'inline-block';
        mapStatusBannerEl.classList.add('is-error');
      } else {
        mapStatusTextEl.textContent = '';
        btnRetryRouteEl.style.display = 'none';
      }
    }

    function clearMapStatus() {
      if (routeRequestTimerId !== null) {
        clearTimeout(routeRequestTimerId);
        routeRequestTimerId = null;
      }
      pendingRouteCoords = null;
      setMapStatus('hidden', '');
    }

    function triggerMapRouteRequest(sLat, sLon, dLat, dLon) {
      if (routeRequestTimerId !== null) {
        clearTimeout(routeRequestTimerId);
        routeRequestTimerId = null;
      }
      pendingRouteCoords = { sLat: sLat, sLon: sLon, dLat: dLat, dLon: dLon };
      const engineName = state.hasGoogleMapsKey ? 'Google Maps (Bicycle + Elevation)' : 'OSRM';
      const loadingMsg = 'Computing ' + engineName + ' route to (' + dLat.toFixed(4) + ', ' + dLon.toFixed(4) + ')...';
      if (mapHintEl) mapHintEl.textContent = loadingMsg;
      setMapStatus('loading', loadingMsg);

      let dispatched = false;
      try {
        if (window.AndroidBridge && window.AndroidBridge.onMapRouteRequested) {
          window.AndroidBridge.onMapRouteRequested(sLat, sLon, dLat, dLon);
          dispatched = true;
        }
      } catch (err) {
        dispatched = false;
      }

      if (!dispatched && !window.AndroidBridge) {
        routeRequestTimerId = setTimeout(function() {
          routeRequestTimerId = null;
          setMapStatus('error', 'Route request failed or timed out.');
          if (mapHintEl) mapHintEl.textContent = 'Route request failed or timed out. Tap Retry Route or Clear Pin.';
        }, 6000);
        return;
      }

      if (!dispatched) {
        setMapStatus('error', 'Route request failed or timed out.');
        if (mapHintEl) mapHintEl.textContent = 'Route request failed or timed out. Tap Retry Route or Clear Pin.';
        return;
      }

      routeRequestTimerId = setTimeout(function() {
        routeRequestTimerId = null;
        setMapStatus('error', 'Route request failed or timed out.');
        if (mapHintEl) mapHintEl.textContent = 'Route request failed or timed out. Tap Retry Route or Clear Pin.';
      }, 6000);
    }

    if (btnRetryRouteEl) {
      btnRetryRouteEl.addEventListener('click', function(ev) {
        ev.stopPropagation();
        if (pendingRouteCoords) {
          triggerMapRouteRequest(
            pendingRouteCoords.sLat,
            pendingRouteCoords.sLon,
            pendingRouteCoords.dLat,
            pendingRouteCoords.dLon
          );
        }
      });
    }

    document.getElementById('btn-locate-gps').addEventListener('click', function(ev) {
      ev.stopPropagation();
      if (mapHintEl) {
        mapHintEl.textContent = 'Requesting your live GPS location...';
      }
      if (window.AndroidBridge && window.AndroidBridge.onLocateMeRequested) {
        window.AndroidBridge.onLocateMeRequested();
      }
    });
    document.getElementById('btn-zoom-in').addEventListener('click', function(ev) {
      ev.stopPropagation();
      mapZoom = Math.min(18, mapZoom + 1);
    });
    document.getElementById('btn-zoom-out').addEventListener('click', function(ev) {
      ev.stopPropagation();
      mapZoom = Math.max(4, mapZoom - 1);
    });
    document.getElementById('btn-recenter').addEventListener('click', function(ev) {
      ev.stopPropagation();
      mapViewLat = null;
      mapViewLon = null;
      mapZoom = 15;
    });
    document.getElementById('btn-clear-pin').addEventListener('click', function(ev) {
      ev.stopPropagation();
      tapStartLatLon = null;
      clearMapStatus();
      if (mapHintEl) mapHintEl.textContent = defaultMapHintText();
    });

    const fallback2dCanvas = document.getElementById('fallback-2d-canvas');
    const fallbackCtx = fallback2dCanvas.getContext('2d');

    function lonToTileX(lon, zoom) {
      return ((lon + 180) / 360) * Math.pow(2, zoom);
    }
    function latToTileY(lat, zoom) {
      const rad = (lat * Math.PI) / 180;
      return (((1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2) * Math.pow(2, zoom));
    }
    function tileXToLon(tileX, zoom) {
      return (tileX / Math.pow(2, zoom)) * 360 - 180;
    }
    function tileYToLat(tileY, zoom) {
      const n = Math.PI - (2 * Math.PI * tileY) / Math.pow(2, zoom);
      return (180 / Math.PI) * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
    }

    function getOsmTile(z, x, y) {
      const maxTile = Math.pow(2, z);
      const wrappedX = ((x % maxTile) + maxTile) % maxTile;
      if (y < 0 || y >= maxTile) return null;
      const key = z + '/' + wrappedX + '/' + y;
      const existing = osmTileCache[key];
      if (existing) {
        if (existing.failedAt && (Date.now() - existing.failedAt > 6000)) {
          delete osmTileCache[key];
        } else {
          return existing;
        }
      }
      const img = new Image();
      img.loadedOk = false;
      img.triedFallback = false;
      img.onload = function() { img.loadedOk = true; };
      img.onerror = function() {
        if (!img.triedFallback) {
          img.triedFallback = true;
          img.src = 'https://a.tile.opentopomap.org/' + key + '.png';
        } else {
          img.failedAt = Date.now();
        }
      };
      img.src = 'https://a.tile-cyclosm.openstreetmap.fr/cyclosm/' + key + '.png';
      osmTileCache[key] = img;
      return img;
    }

    function renderGpsMap(targetCtx, boxX, boxY, boxW, boxH, zoom) {
      targetCtx.save();
      targetCtx.beginPath();
      targetCtx.rect(boxX, boxY, boxW, boxH);
      targetCtx.clip();
      targetCtx.fillStyle = '#0B1510';
      targetCtx.fillRect(boxX, boxY, boxW, boxH);

      const viewLat = mapViewLat !== null ? mapViewLat : state.lat;
      const viewLon = mapViewLon !== null ? mapViewLon : state.lon;
      const centerTileX = lonToTileX(viewLon, zoom);
      const centerTileY = latToTileY(viewLat, zoom);
      const startTileX = Math.floor(centerTileX - (boxW / 512) - 1);
      const endTileX = Math.floor(centerTileX + (boxW / 512) + 1);
      const startTileY = Math.floor(centerTileY - (boxH / 512) - 1);
      const endTileY = Math.floor(centerTileY + (boxH / 512) + 1);

      let anyTileLoaded = false;
      for (let tx = startTileX; tx <= endTileX; tx++) {
        for (let ty = startTileY; ty <= endTileY; ty++) {
          const tileImg = getOsmTile(zoom, tx, ty);
          const drawX = boxX + boxW * 0.5 + (tx - centerTileX) * 256;
          const drawY = boxY + boxH * 0.5 + (ty - centerTileY) * 256;
          if (tileImg && tileImg.loadedOk) {
            anyTileLoaded = true;
            try { targetCtx.drawImage(tileImg, drawX, drawY, 256, 256); } catch (e) {}
          }
        }
      }

      if (anyTileLoaded) {
        targetCtx.fillStyle = 'rgba(11, 21, 16, 0.14)';
        targetCtx.fillRect(boxX, boxY, boxW, boxH);
      } else {
        targetCtx.strokeStyle = 'rgba(169, 189, 176, 0.22)';
        targetCtx.lineWidth = 1;
        for (let gx = boxX; gx < boxX + boxW; gx += 28) {
          targetCtx.beginPath();
          targetCtx.moveTo(gx, boxY);
          targetCtx.lineTo(gx, boxY + boxH);
          targetCtx.stroke();
        }
        for (let gy = boxY; gy < boxY + boxH; gy += 28) {
          targetCtx.beginPath();
          targetCtx.moveTo(boxX, gy);
          targetCtx.lineTo(boxX + boxW, gy);
          targetCtx.stroke();
        }
      }

      let closestIdx = 0;
      let minSqDist = Infinity;
      for (let i = 0; i < routeWaypoints.length; i++) {
        const dLat = routeWaypoints[i][0] - state.lat;
        const dLon = routeWaypoints[i][1] - state.lon;
        const sq = dLat * dLat + dLon * dLon;
        if (sq < minSqDist) {
          minSqDist = sq;
          closestIdx = i;
        }
      }

      const rx = boxX + boxW * 0.5 + (lonToTileX(state.lon, zoom) - centerTileX) * 256;
      const ry = boxY + boxH * 0.5 + (latToTileY(state.lat, zoom) - centerTileY) * 256;

      if (routeWaypoints.length >= 2) {
        targetCtx.lineCap = 'round';
        targetCtx.lineJoin = 'round';
        targetCtx.strokeStyle = 'rgba(11, 21, 16, 0.85)';
        targetCtx.lineWidth = 7;
        targetCtx.beginPath();
        for (let i = 0; i < routeWaypoints.length; i++) {
          const wp = routeWaypoints[i];
          const px = boxX + boxW * 0.5 + (lonToTileX(wp[1], zoom) - centerTileX) * 256;
          const py = boxY + boxH * 0.5 + (latToTileY(wp[0], zoom) - centerTileY) * 256;
          if (i === 0) targetCtx.moveTo(px, py);
          else targetCtx.lineTo(px, py);
        }
        targetCtx.stroke();

        targetCtx.strokeStyle = '#C8F04A';
        targetCtx.lineWidth = 4;
        targetCtx.stroke();

        targetCtx.strokeStyle = '#34D399';
        targetCtx.lineWidth = 4.5;
        targetCtx.beginPath();
        for (let i = 0; i <= closestIdx; i++) {
          const wp = routeWaypoints[i];
          const px = boxX + boxW * 0.5 + (lonToTileX(wp[1], zoom) - centerTileX) * 256;
          const py = boxY + boxH * 0.5 + (latToTileY(wp[0], zoom) - centerTileY) * 256;
          if (i === 0) targetCtx.moveTo(px, py);
          else targetCtx.lineTo(px, py);
        }
        targetCtx.lineTo(rx, ry);
        targetCtx.stroke();
      }

      if (tapStartLatLon) {
        const sx = boxX + boxW * 0.5 + (lonToTileX(tapStartLatLon[1], zoom) - centerTileX) * 256;
        const sy = boxY + boxH * 0.5 + (latToTileY(tapStartLatLon[0], zoom) - centerTileY) * 256;
        targetCtx.fillStyle = '#34D399';
        targetCtx.beginPath();
        targetCtx.arc(sx, sy, 7, 0, Math.PI * 2);
        targetCtx.fill();
        targetCtx.strokeStyle = '#F4F7F2';
        targetCtx.lineWidth = 2;
        targetCtx.stroke();
      }

      targetCtx.fillStyle = 'rgba(200, 240, 74, 0.35)';
      targetCtx.beginPath();
      targetCtx.arc(rx, ry, 11, 0, Math.PI * 2);
      targetCtx.fill();

      targetCtx.fillStyle = '#C8F04A';
      targetCtx.beginPath();
      targetCtx.arc(rx, ry, 6, 0, Math.PI * 2);
      targetCtx.fill();
      targetCtx.strokeStyle = '#0B1510';
      targetCtx.lineWidth = 2;
      targetCtx.stroke();

      targetCtx.fillStyle = 'rgba(11, 21, 16, 0.90)';
      targetCtx.beginPath();
      targetCtx.rect(boxX + 12, boxY + 12, 290, 28);
      targetCtx.fill();
      targetCtx.strokeStyle = '#1E3328';
      targetCtx.lineWidth = 1;
      targetCtx.stroke();
      targetCtx.fillStyle = '#F4F7F2';
      targetCtx.font = 'bold 11px sans-serif';
      targetCtx.textAlign = 'left';
      targetCtx.fillText(
        'GPS LIVE: ' + state.speedKmh.toFixed(1) + ' km/h  |  ' +
        (state.distanceMeters / 1000).toFixed(2) + ' km  |  ' + state.watts + ' W',
        boxX + 20,
        boxY + 30
      );

      targetCtx.restore();
    }

    function onMapPointerDown(clientX, clientY) {
      isDraggingMap = true;
      didPanMoved = false;
      dragStartX = clientX;
      dragStartY = clientY;
      const viewLat = mapViewLat !== null ? mapViewLat : state.lat;
      const viewLon = mapViewLon !== null ? mapViewLon : state.lon;
      dragStartCenterTileX = lonToTileX(viewLon, mapZoom);
      dragStartCenterTileY = latToTileY(viewLat, mapZoom);
    }

    function onMapPointerMove(clientX, clientY) {
      if (!isDraggingMap) return;
      const dx = clientX - dragStartX;
      const dy = clientY - dragStartY;
      if (Math.abs(dx) > 6 || Math.abs(dy) > 6) {
        didPanMoved = true;
      }
      if (didPanMoved) {
        const newTileX = dragStartCenterTileX - dx / 256;
        const newTileY = dragStartCenterTileY - dy / 256;
        mapViewLon = tileXToLon(newTileX, mapZoom);
        mapViewLat = Math.max(-85, Math.min(85, tileYToLat(newTileY, mapZoom)));
      }
    }

    function onMapPointerUp() {
      isDraggingMap = false;
    }

    fullMapCanvas.addEventListener('mousedown', function(ev) {
      onMapPointerDown(ev.clientX, ev.clientY);
    });
    window.addEventListener('mousemove', function(ev) {
      onMapPointerMove(ev.clientX, ev.clientY);
    });
    window.addEventListener('mouseup', function() {
      onMapPointerUp();
    });

    fullMapCanvas.addEventListener('touchstart', function(ev) {
      if (ev.touches.length === 1) {
        onMapPointerDown(ev.touches[0].clientX, ev.touches[0].clientY);
      }
    }, { passive: true });
    fullMapCanvas.addEventListener('touchmove', function(ev) {
      if (ev.touches.length === 1) {
        onMapPointerMove(ev.touches[0].clientX, ev.touches[0].clientY);
      }
    }, { passive: true });
    fullMapCanvas.addEventListener('touchend', function() {
      onMapPointerUp();
    }, { passive: true });

    fullMapCanvas.addEventListener('click', function(ev) {
      if (didPanMoved) {
        didPanMoved = false;
        return;
      }
      const rect = fullMapCanvas.getBoundingClientRect();
      const clickX = ev.clientX - rect.left;
      const clickY = ev.clientY - rect.top;
      const zoom = mapZoom;
      const viewLat = mapViewLat !== null ? mapViewLat : state.lat;
      const viewLon = mapViewLon !== null ? mapViewLon : state.lon;
      const centerTileX = lonToTileX(viewLon, zoom);
      const centerTileY = latToTileY(viewLat, zoom);

      const clickedTileX = centerTileX + (clickX - fullMapCanvas.width * 0.5) / 256;
      const clickedTileY = centerTileY + (clickY - fullMapCanvas.height * 0.5) / 256;
      const clickedLat = tileYToLat(clickedTileY, zoom);
      const clickedLon = tileXToLon(clickedTileX, zoom);

      if (!tapStartLatLon) {
        clearMapStatus();
        tapStartLatLon = [clickedLat, clickedLon];
        mapHintEl.textContent =
          'Start Pin set (' + clickedLat.toFixed(4) + ', ' + clickedLon.toFixed(4) + '). Tap Destination Pin.';
      } else {
        const sLat = tapStartLatLon[0];
        const sLon = tapStartLatLon[1];
        tapStartLatLon = null;
        triggerMapRouteRequest(sLat, sLon, clickedLat, clickedLon);
      }
    });

    function initThree() {
      try {
        if (typeof THREE === 'undefined') {
          console.warn('Three.js not loaded, using fallback 2D engine');
          return false;
        }

        renderer = new THREE.WebGLRenderer({
          canvas: threeCanvas,
          antialias: true,
          powerPreference: 'high-performance'
        });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 0.96;

        if (!contextLostListenerAttached) {
          contextLostListenerAttached = true;
          threeCanvas.addEventListener('webglcontextlost', function(e) {
            e.preventDefault();
            console.warn('WebGL context lost. Falling back to 2D HUD canvas.');
            isThreeSupported = false;
            threeCanvas.style.display = 'none';
            fallback2dCanvas.style.display = 'block';
          }, false);

          threeCanvas.addEventListener('webglcontextrestored', function() {
            console.info('WebGL context restored. Rebuilding Three.js scene.');
            initThree();
            isThreeSupported = true;
            threeCanvas.style.display = 'block';
            fallback2dCanvas.style.display = 'none';
          }, false);
        }

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x8CC0E8);

    function sampleCoordAtDistance(distMeters) {
      if (!Array.isArray(routeWaypoints) || routeWaypoints.length < 2) {
        return { lat: state.lat, lon: state.lon, ele: 0, segBearingDeg: 0, totalDist: 4000, wrappedDist: 0 };
      }
      if (routeWaypoints[0].length < 5) {
        ensureRouteMetrics(routeWaypoints);
      }
      const lastWp = routeWaypoints[routeWaypoints.length - 1];
      const totalDist = Math.max(10, Number(lastWp[3]) || state.routeTotalMeters || 4000);
      const d = ((distMeters % totalDist) + totalDist) % totalDist;

      let low = 0;
      let high = routeWaypoints.length - 1;
      while (low < high) {
        const mid = (low + high) >> 1;
        if ((Number(routeWaypoints[mid][3]) || 0) < d) {
          low = mid + 1;
        } else {
          high = mid;
        }
      }
      const idx = Math.max(0, low - 1);
      const nextIdx = Math.min(routeWaypoints.length - 1, idx + 1);
      const wp0 = routeWaypoints[idx];
      const wp1 = routeWaypoints[nextIdx];
      const d0 = Number(wp0[3]) || 0;
      const d1 = Number(wp1[3]) || d0;
      const segLen = d1 - d0;
      const t = segLen > 0.05 ? Math.max(0, Math.min(1, (d - d0) / segLen)) : 0;

      const lat = wp0[0] + (wp1[0] - wp0[0]) * t;
      const lon = wp0[1] + (wp1[1] - wp0[1]) * t;
      const ele = wp0[2] + (wp1[2] - wp0[2]) * t;
      const segBearingDeg = segLen > 0.05
        ? computeBearingDegJs(wp0[0], wp0[1], wp1[0], wp1[1])
        : (Number(wp1[4]) || Number(wp0[4]) || 0);

      return {
        lat: lat,
        lon: lon,
        ele: ele,
        segBearingDeg: segBearingDeg,
        totalDist: totalDist,
        wrappedDist: d
      };
    }

    function sampleRouteAtDistance(distMeters) {
      const pt = sampleCoordAtDistance(distMeters);
      if (!Array.isArray(routeWaypoints) || routeWaypoints.length < 2) {
        return { lat: pt.lat, lon: pt.lon, ele: pt.ele, bearingDeg: 0 };
      }
      // Symmetric local tangent over +-4m clamped inside [0, totalDist] prevents premature turn lead-in
      // and avoids Kotlin/JS bearing index discrepancies
      const dBack = Math.max(0, pt.wrappedDist - 4.0);
      const dAhead = Math.min(pt.totalDist, pt.wrappedDist + 4.0);
      const back = sampleCoordAtDistance(dBack);
      const ahead = sampleCoordAtDistance(dAhead);
      const hasSpan = Math.abs(ahead.lat - back.lat) + Math.abs(ahead.lon - back.lon) > 1e-7;
      const bearingDeg = hasSpan
        ? computeBearingDegJs(back.lat, back.lon, ahead.lat, ahead.lon)
        : pt.segBearingDeg;

      return { lat: pt.lat, lon: pt.lon, ele: pt.ele, bearingDeg: bearingDeg };
    }

    function projectRoadOffsetAhead(localDist, relD, pt0Override) {
      if (Math.abs(relD) <= 0.05) {
        return { curveX: 0, slopeY: 0 };
      }
      if (relD < 0) {
        const ptBack = sampleCoordAtDistance(localDist + 10);
        const pt0 = pt0Override || sampleRouteAtDistance(localDist);
        const dEle = ptBack.ele - pt0.ele;
        const slopeRate = Math.abs(dEle) > 0.01 ? (dEle * 0.55) / 10.0 : (state.gradePercent * 0.006);
        return { curveX: 0, slopeY: relD * slopeRate };
      }
      const pt0 = pt0Override || sampleRouteAtDistance(localDist);
      const pt1 = sampleCoordAtDistance(localDist + relD);

      const dNorth = (pt1.lat - pt0.lat) * 111132.0;
      const dEast = (pt1.lon - pt0.lon) * 111319.5 * Math.cos(pt0.lat * Math.PI / 180.0);
      const h0Rad = pt0.bearingDeg * Math.PI / 180.0;

      // Local right-hand lateral offset (+X = right of rider, -X = left of rider)
      let lateralX = dEast * Math.cos(h0Rad) - dNorth * Math.sin(h0Rad);

      // If road turns past 90 degrees (hairpin/switchback), blend heading delta so it stays swept to the turn side
      const forwardZ = dEast * Math.sin(h0Rad) + dNorth * Math.cos(h0Rad);
      const turnDeg = shortestAngleDeg(pt0.bearingDeg, pt1.segBearingDeg);
      if (forwardZ < relD * 0.35) {
        const sign = turnDeg >= 0 ? 1 : -1;
        lateralX = sign * Math.max(Math.abs(lateralX), relD * 0.42);
      }

      const nearTaper = Math.min(1.0, relD / 6.0);
      const clampedX = Math.max(-42.0, Math.min(42.0, lateralX * nearTaper));

      const dEle = pt1.ele - pt0.ele;
      const rawSlopeY = Math.abs(dEle) > 0.01
        ? dEle * 0.55
        : relD * (state.gradePercent * 0.006);
      const clampedY = Math.max(-28.0, Math.min(35.0, rawSlopeY));

      return { curveX: clampedX, slopeY: clampedY };
    }

    function detectUpcomingTurn(localDist) {
      const pt0 = sampleRouteAtDistance(localDist);
      const pt35 = sampleRouteAtDistance(localDist + 35);
      const pt75 = sampleRouteAtDistance(localDist + 75);
      const delta35 = shortestAngleDeg(pt0.bearingDeg, pt35.bearingDeg);
      const delta75 = shortestAngleDeg(pt0.bearingDeg, pt75.bearingDeg);

      const activeDelta = Math.abs(delta35) >= 12 ? delta35 : delta75;
      const turnDist = Math.abs(delta35) >= 12 ? 35 : 75;
      const blendDelta = Math.abs(delta35) >= Math.abs(delta75) * 0.45 ? delta35 : delta75 * 0.45;
      const turnRate = Math.max(-2.2, Math.min(2.2, blendDelta / 22.0));

      if (Math.abs(activeDelta) >= 45) {
        return {
          label: (activeDelta > 0 ? '↱ SHARP RIGHT ' : '↰ SHARP LEFT ') + turnDist + 'M',
          color: '#F43F5E',
          turnRate: turnRate
        };
      }
      if (Math.abs(activeDelta) >= 14) {
        return {
          label: (activeDelta > 0 ? '↱ RIGHT TURN ' : '↰ LEFT TURN ') + turnDist + 'M',
          color: '#FBBF24',
          turnRate: turnRate
        };
      }
      return {
        label: '↑ STRAIGHT ROAD',
        color: '#34D399',
        turnRate: turnRate
      };
    }

    // Sky Dome Panorama, Contoured Hillside, Shimmering Lake, Continuous Guardrails, Trees & Banners
    function createEnvironment() {
      // 1. Panoramic Sky Dome Texture (Sky Gradient + Volumetric Clouds + 3-Layer Mountain Horizon)
      const skyCanvas = document.createElement('canvas');
      skyCanvas.width = 2048;
      skyCanvas.height = 1024;
      const sctx = skyCanvas.getContext('2d');

      const skyGrad = sctx.createLinearGradient(0, 0, 0, 560);
      skyGrad.addColorStop(0.0, '#2E6CB8');
      skyGrad.addColorStop(0.55, '#599AD9');
      skyGrad.addColorStop(0.84, '#92C3EC');
      skyGrad.addColorStop(1.0, '#CFE4F4');
      sctx.fillStyle = skyGrad;
      sctx.fillRect(0, 0, 2048, 560);

      const lowerGrad = sctx.createLinearGradient(0, 540, 0, 1024);
      lowerGrad.addColorStop(0.0, '#467BA6');
      lowerGrad.addColorStop(0.3, '#38687A');
      lowerGrad.addColorStop(1.0, '#2F5632');
      sctx.fillStyle = lowerGrad;
      sctx.fillRect(0, 540, 2048, 484);

      // Soft wrapping cumulus clouds positioned in visible upper sky band (y = 375..460)
      function drawCloudPuff(cx, cy, rx, ry, alpha) {
        for (let wrap = -1; wrap <= 1; wrap++) {
          const x = cx + wrap * 2048;
          if (x < -rx * 2 || x > 2048 + rx * 2) continue;
          sctx.save();
          sctx.translate(x, cy);
          sctx.scale(1, ry / rx);
          const g = sctx.createRadialGradient(0, 0, rx * 0.1, 0, 0, rx);
          g.addColorStop(0, 'rgba(255, 255, 255, ' + alpha + ')');
          g.addColorStop(0.52, 'rgba(246, 251, 255, ' + (alpha * 0.72) + ')');
          g.addColorStop(1, 'rgba(255, 255, 255, 0)');
          sctx.fillStyle = g;
          sctx.beginPath();
          sctx.arc(0, 0, rx, 0, Math.PI * 2);
          sctx.fill();
          sctx.restore();
        }
      }
      for (let c = 0; c < 22; c++) {
        const baseX = (c * 197 + 60) % 2048;
        const baseY = 388 + (c % 4) * 18;
        const scale = 0.62 + (c % 4) * 0.18;
        drawCloudPuff(baseX, baseY, 85 * scale, 28 * scale, 0.72);
        drawCloudPuff(baseX - 42 * scale, baseY + 6 * scale, 58 * scale, 22 * scale, 0.62);
        drawCloudPuff(baseX + 44 * scale, baseY + 5 * scale, 64 * scale, 24 * scale, 0.62);
        drawCloudPuff(baseX + 8 * scale, baseY - 10 * scale, 52 * scale, 20 * scale, 0.58);
      }

      // Seamless wrapping mountain ridge helper
      function drawMountainLayer(baseY, amp1, amp2, amp3, phase, fillStyleTop, fillStyleBot) {
        const mGrad = sctx.createLinearGradient(0, baseY - amp1 - amp2 - amp3, 0, 570);
        mGrad.addColorStop(0, fillStyleTop);
        mGrad.addColorStop(1, fillStyleBot);
        sctx.fillStyle = mGrad;
        sctx.beginPath();
        sctx.moveTo(0, 575);
        for (let x = 0; x <= 2048; x += 8) {
          const t = (x / 2048) * Math.PI * 2;
          const h1 = Math.abs(Math.sin(t * 3 + phase)) * amp1;
          const h2 = Math.sin(t * 7 + phase * 1.7) * amp2;
          const h3 = Math.cos(t * 13 + phase * 0.6) * amp3;
          const y = baseY - (h1 + h2 + h3);
          sctx.lineTo(x, y);
        }
        sctx.lineTo(2048, 575);
        sctx.closePath();
        sctx.fill();
      }
      // Far misty alpine peaks, mid sage ridges, near lush foothills
      drawMountainLayer(492, 68, 22, 10, 0.4, '#6A91AD', '#9EC0D8');
      drawMountainLayer(508, 46, 18, 8, 1.9, '#497365', '#6E9587');
      drawMountainLayer(524, 30, 14, 6, 3.1, '#345E3D', '#4B7948');

      const skyTexture = new THREE.CanvasTexture(skyCanvas);
      const skyGeo = new THREE.SphereGeometry(520, 48, 32);
      const skyMat = new THREE.MeshBasicMaterial({
        map: skyTexture,
        side: THREE.BackSide,
        fog: false
      });
      skyDome = new THREE.Mesh(skyGeo, skyMat);
      skyDome.position.set(0, 0, -100);
      scene.add(skyDome);

      // Deep Horizon Base Terrain (far below road drops)
      const baseFloorGeo = new THREE.PlaneGeometry(700, 700, 4, 4);
      baseFloorGeo.rotateX(-Math.PI / 2);
      const baseFloorMat = new THREE.MeshLambertMaterial({ color: 0x355C2D });
      const baseFloorMesh = new THREE.Mesh(baseFloorGeo, baseFloorMat);
      baseFloorMesh.position.set(0, -34, -160);
      scene.add(baseFloorMesh);

      // 2. Procedural Meadow Grass Texture & Contoured Right Hillside Ribbon
      const grassCanvas = document.createElement('canvas');
      grassCanvas.width = 256;
      grassCanvas.height = 256;
      const gctx = grassCanvas.getContext('2d');
      gctx.fillStyle = '#4B7B36';
      gctx.fillRect(0, 0, 256, 256);
      for (let g = 0; g < 160; g++) {
        gctx.fillStyle = (g % 2 === 0) ? 'rgba(92, 142, 62, 0.25)' : 'rgba(46, 86, 32, 0.22)';
        const gx = (g * 53) % 256;
        const gy = (g * 97) % 256;
        gctx.fillRect(gx, gy, 18 + (g % 24), 6 + (g % 10));
      }
      grassTexture = new THREE.CanvasTexture(grassCanvas);
      grassTexture.wrapS = THREE.RepeatWrapping;
      grassTexture.wrapT = THREE.RepeatWrapping;
      grassTexture.repeat.set(16, 24);

      const groundGeo = new THREE.PlaneGeometry(180, 240, 16, 80);
      groundGeo.rotateX(-Math.PI / 2);
      groundGeo.translate(93.8, 0, -110);
      groundGeo.userData = {
        basePositions: new Float32Array(groundGeo.attributes.position.array)
      };
      const groundMat = new THREE.MeshStandardMaterial({
        map: grassTexture,
        roughness: 0.92,
        metalness: 0.0,
        side: THREE.DoubleSide
      });
      groundMesh = new THREE.Mesh(groundGeo, groundMat);
      scene.add(groundMesh);

      // 3. Procedural Shimmering Water Texture & Left Lakeside Ribbon
      const lakeCanvas = document.createElement('canvas');
      lakeCanvas.width = 256;

    // Helper to position & orient a 3D tube between two points
    function createFrameTube(p1, p2, radius, mat) {
      const v1 = new THREE.Vector3(p1[0], p1[1], p1[2]);
      const v2 = new THREE.Vector3(p2[0], p2[1], p2[2]);
      const dist = v1.distanceTo(v2);
      const geo = new THREE.CylinderGeometry(radius, radius, dist, 8);
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.copy(v1).add(v2).multiplyScalar(0.5);
      const dir = new THREE.Vector3().subVectors(v2, v1).normalize();
      const quat = new THREE.Quaternion().setFromUnitVectors(_upVec, dir);
      mesh.setRotationFromQuaternion(quat);
      return mesh;
    }

    function alignCylinder(cylinderMesh, vA, vB) {
      cylinderMesh.position.set((vA.x + vB.x) * 0.5, (vA.y + vB.y) * 0.5, (vA.z + vB.z) * 0.5);
      _tmpDir.subVectors(vB, vA).normalize();
      _tmpQuat.setFromUnitVectors(_upVec, _tmpDir);
      cylinderMesh.setRotationFromQuaternion(_tmpQuat);

    // Full Carbon Aero Road Bicycle & Smooth Sculpted Articulated Cyclist (IK)

      // 2. Anatomically Sculpted Pro Road Cyclist
      cyclistGroup = new THREE.Group();

      // Glute-contoured Pelvis & Bib Shorts waist bridge (anchored over saddle)
      const pelvisGeo = new THREE.SphereGeometry(0.145, 28, 22);

        const gluteCleft = isBack ? Math.exp(-Math.pow(vx / 0.020, 2)) * archMask * 0.011 : 0;
        const widthTaper = 0.92 - ny * 0.06;
        pPos.setXYZ(i, vx * widthTaper, vy * 0.80, vz * 0.90 - gluteLobe + gluteCleft);

      // Shared Helper for multi-section sculpted cylindrical body limbs (t = 0 at -Y, 1 at +Y)
      function buildSculptedSection(len, radiusFn, yMinRatio, yMaxRatio, mat, radialSeg = 22, heightSeg = 10) {
        const subLen = len * (yMaxRatio - yMinRatio);
        const geo = new THREE.CylinderGeometry(1, 1, subLen, radialSeg, heightSeg);
        const pos = geo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          const vx = pos.getX(i), vy = pos.getY(i), vz = pos.getZ(i);
          const localFrac = (vy + subLen * 0.5) / subLen;
          const t = yMinRatio + localFrac * (yMaxRatio - yMinRatio);
          const r = radiusFn(t);
          pos.setXYZ(i, vx * r.x, vy, vz * r.z);
        }
        geo.computeVertexNormals();
        const mesh = new THREE.Mesh(geo, mat);
        const midRatio = (yMinRatio + yMaxRatio) * 0.5;
        mesh.position.y = (midRatio - 0.5) * len;
        return mesh;
      }

      // Upper-body pivot centered at pelvis/waist so micro-sway keeps hands anchored at hood height
      const ubPivotY = 0.81, ubPivotZ = -0.17;
      function ubVec(x, y, z) {
        return new THREE.Vector3(x, y - ubPivotY, z - ubPivotZ);
      }
      cyclistUpperBody = new THREE.Group();
      cyclistUpperBody.position.set(0, ubPivotY, ubPivotZ);

      // Unified Parametric Torso Deformation (shared with rear jersey pockets for flush fit)
      const torsoVBot = ubVec(0, 0.815, -0.155);
      const torsoVTop = ubVec(0, 1.125, 0.175);
      const torsoLen = torsoVBot.distanceTo(torsoVTop); // ~0.453m

      function deformTorsoPoint(vx, normH, vz, radialOffset) {
        const taperTop = normH > 0.80 ? Math.cos(((normH - 0.80) / 0.20) * Math.PI * 0.46) : 1.0;
        const taperBot = normH < 0.10 ? (0.88 + 0.12 * (normH / 0.10)) : 1.0;
        const baseW = (0.118 + Math.sin(Math.pow(normH, 0.78) * Math.PI * 0.82) * 0.044) * taperBot * (0.58 + 0.42 * taperTop) + radialOffset;
        const baseD = (0.090 + Math.sin(Math.pow(normH, 0.84) * Math.PI * 0.85) * 0.025) * taperBot * (0.62 + 0.38 * taperTop) + radialOffset;

        const sx = vx * baseW;
        const backWeight = vz < 0 ? (-vz) : 0;
        const spineFurrow = backWeight * Math.exp(-Math.pow(sx / 0.026, 2)) * Math.sin(normH * Math.PI) * 0.011;
        const scapulaSwell = backWeight * Math.exp(-Math.pow((Math.abs(sx) - 0.070) / 0.042, 2)) * Math.exp(-Math.pow((normH - 0.72) / 0.18, 2)) * 0.012;
        const chestSwell = vz > 0 ? vz * Math.exp(-Math.pow((normH - 0.66) / 0.22, 2)) * 0.018 : 0;
        const backArchZ = -Math.sin(normH * Math.PI) * 0.024;
        return {
          x: sx,
          z: vz * baseD + backArchZ + spineFurrow - scapulaSwell + chestSwell
        };
      }

      const torsoGeo = new THREE.CylinderGeometry(1, 1, torsoLen, 32, 18);
      const tPos = torsoGeo.attributes.position;
      for (let i = 0; i < tPos.count; i++) {
        const vx = tPos.getX(i), vy = tPos.getY(i), vz = tPos.getZ(i);
        const normH = (vy + torsoLen * 0.5) / torsoLen;
        const pt = deformTorsoPoint(vx, normH, vz, 0);
        tPos.setXYZ(i, pt.x, vy, pt.z);
      }
      torsoGeo.computeVertexNormals();
      const torso = new THREE.Mesh(torsoGeo, kitMat);
      alignCylinder(torso, torsoVBot, torsoVTop);

      // Flush Surface-Conformed 3-Compartment Rear Pockets & Lime Reflective Hem Stripe
      function buildConformedBackArc(hMin, hMax, radialOffset, thetaStart, thetaLen, mat) {
        const subLen = torsoLen * (hMax - hMin);
        const geo = new THREE.CylinderGeometry(1, 1, subLen, 20, 6, true, thetaStart, thetaLen);

          const normH = hMin + localFrac * (hMax - hMin);
          const pt = deformTorsoPoint(vx, normH, vz, radialOffset);
          pos.setXYZ(i, pt.x, vy + ((hMin + hMax) * 0.5 - 0.5) * torsoLen, pt.z);

        const mesh = new THREE.Mesh(geo, mat);

    // Analytical Law of Cosines 2-Bone IK Leg Solver (Forward Crank Rotation)
    function updateLegIK(leg, crankAngle) {
      if (!leg) return;
      // right (side > 0) starts at top (+Y) when crankAngle = 0; left (side < 0) at bottom (-Y)
      const phi = crankAngle + (leg.side > 0 ? 0 : Math.PI);
      const R = 0.165; // Crank arm radius

      // Three.js +X rotation moves +Y -> +Z -> -Y -> -Z (forward pedaling in bike-local coords)
      const Py = 0.33 + R * Math.cos(phi);
      const Pz = -0.10 + R * Math.sin(phi);
      const Px = leg.side * 0.102;

      // Dynamic pro road ankling: flat/heel-drop on power downstroke, slight toe dip through BDC
      const shoeRotX = -0.05 - Math.cos(phi) * 0.14 + Math.sin(phi) * 0.06;
      leg.shoeMesh.position.set(Px, Py + 0.010, Pz);
      leg.shoeMesh.rotation.x = shoeRotX;

      // Target the anatomical ankle socket behind/above the pedal cleat
      const localAnkleY = 0.038;
      const localAnkleZ = -0.055;
      const Ay = (Py + 0.010) + localAnkleY * Math.cos(shoeRotX) - localAnkleZ * Math.sin(shoeRotX);
      const Az = Pz + localAnkleY * Math.sin(shoeRotX) + localAnkleZ * Math.cos(shoeRotX);

      const Hy = leg.hip.y;
      const Hz = leg.hip.z;
      const Hx = leg.hip.x;

      const Dy = Ay - Hy;
      const Dz = Az - Hz;
      const d = Math.max(0.05, Math.min(leg.L1 + leg.L2 - 0.005, Math.sqrt(Dy * Dy + Dz * Dz)));

      const L1 = leg.L1;
      const L2 = leg.L2;

      let cosAlpha = (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d);
      cosAlpha = Math.max(-1, Math.min(1, cosAlpha));
      const alpha = Math.acos(cosAlpha);

      const beta = Math.atan2(Dy, Dz);

      // Forward knee bend towards +Z
      const theta1 = beta + alpha;
      const Ky = Hy + L1 * Math.sin(theta1);
      const Kz = Hz + L1 * Math.cos(theta1);
      const Kx = Hx;

      _vecA.set(Hx, Hy, Hz);
      _vecB.set(Kx, Ky, Kz);
      alignCylinder(leg.thighMesh, _vecA, _vecB);

      leg.kneeMesh.position.set(Kx, Ky, Kz);

      _vecA.set(Kx, Ky, Kz);
      _vecB.set(Px, Ay, Az);
      alignCylinder(leg.calfMesh, _vecA, _vecB);
    }
