    // ===============================================
    // CURVED HOLOGRAPHIC FIGHTER-JET VISOR HUD (3D)
    // ===============================================
    function updateVisorFrustumScale(w, h) {
      if (!visorMesh || !camera) return;
      const aspect = (w && h) ? (w / h) : (camera.aspect || 1.78);
      const vFovRad = (camera.fov * Math.PI) / 180.0;
      const depth = 1.5;
      const frustumH = 2.0 * depth * Math.tan(vFovRad * 0.5);
      const frustumW = frustumH * aspect;
      visorMesh.scale.set(frustumW, frustumH, 1);
    }

    function createCurvedVisorHud() {
      hudCanvas = document.createElement('canvas');
      hudCanvas.width = 1600;
      hudCanvas.height = 800;
      hudCanvas.style.fontVariantNumeric = 'tabular-nums';
      hudCtx = hudCanvas.getContext('2d');

      hudTexture = new THREE.CanvasTexture(hudCanvas);
      hudTexture.minFilter = THREE.LinearFilter;
      hudTexture.magFilter = THREE.LinearFilter;

      // Full-frustum gently curved visor mesh centered at z = -1.5m
      const visorGeo = new THREE.PlaneGeometry(1, 1, 32, 1);
      const posAttr = visorGeo.attributes.position;
      for (let i = 0; i < posAttr.count; i++) {
        const u = posAttr.getX(i); // -0.5 .. +0.5
        const curveZ = -1.5 + (u * u) * 0.14;
        posAttr.setZ(i, curveZ);
      }
      posAttr.needsUpdate = true;

      const visorMat = new THREE.MeshBasicMaterial({
        map: hudTexture,
        transparent: true,
        opacity: 0.97,
        side: THREE.DoubleSide,
        depthTest: false,
        depthWrite: false
      });

      visorMesh = new THREE.Mesh(visorGeo, visorMat);
      visorMesh.renderOrder = 999;
      visorMesh.position.set(0, 0, 0);
      visorMesh.rotation.set(0, 0, 0);
      // Parent directly to camera so it remains centered in view across CHASE, POV, DRONE
      camera.add(visorMesh);
      updateVisorFrustumScale(window.innerWidth, window.innerHeight);
    }

    // Canvas helper for rounded Deep Forest Ink panels
    function drawGlassPanel(ctx, x, y, w, h, r, borderColor, bgAlpha) {
      ctx.save();
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(x, y, w, h, r);
      } else {
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
      }
      ctx.fillStyle = 'rgba(11, 21, 16, ' + (bgAlpha !== undefined ? bgAlpha : 0.86) + ')';
      ctx.fill();
      ctx.strokeStyle = borderColor || '#1E3328';
      ctx.lineWidth = 2.0;
      ctx.stroke();
      ctx.restore();
    }

    // High-DPI 2D Visor HUD Painter: LangkahFit Minimalist Cycling Cockpit
    function renderVisorHud(now) {
      if (!hudCtx) return;
      const w = hudCanvas.width;
      const h = hudCanvas.height;

      hudCtx.clearRect(0, 0, w, h);

      const pColor = ZONE_COLORS[state.powerZone] || '#C8F04A';
      const hrColor = ZONE_COLORS[state.hrZone] || '#FB7185';
      const pZoneName = ZONE_NAMES[state.powerZone] || 'Z3 TEMPO';
      const gradeColor = state.gradePercent > 4.0 ? '#F43F5E' : (state.gradePercent > 0.0 ? '#FBBF24' : '#34D399');
      const gradeSign = state.gradePercent >= 0 ? '+' : '';
      const routeTot = Math.max(100, state.routeTotalMeters || 4000);
      const routeProgFrac = Math.min(1.0, Math.max(0.0, (state.distanceMeters % routeTot) / routeTot));
      const pt0 = sampleRouteAtDistance(state.distanceMeters);
      const upcomingTurn = detectUpcomingTurn(state.distanceMeters);

      // 1. TOP-LEFT LANGKAHFIT STATUS PILL + ROUTE PROGRESS BAR
      const topPillX = 28;
      const topPillY = 104;
      const topPillW = 472;
      const topPillH = 50;
      drawGlassPanel(hudCtx, topPillX, topPillY, topPillW, topPillH, 25, '#1E3328', 0.88);

      // Static live status dot
      hudCtx.save();
      hudCtx.fillStyle = state.watts > 0 ? '#C8F04A' : '#34D399';
      hudCtx.beginPath();
      hudCtx.arc(topPillX + 24, topPillY + 23, 5.5, 0, Math.PI * 2);
      hudCtx.fill();

      hudCtx.textAlign = 'left';
      hudCtx.fillStyle = '#F4F7F2';
      hudCtx.font = 'bold 15px sans-serif';
      hudCtx.fillText('LazyFit Cyclist', topPillX + 40, topPillY + 28);

      hudCtx.fillStyle = '#C8F04A';
      hudCtx.font = '900 15px sans-serif';
      hudCtx.fillText(state.watts + 'W · ' + state.wattsPerKg.toFixed(1) + ' W/kg', topPillX + 168, topPillY + 28);

      hudCtx.textAlign = 'right';
      hudCtx.fillStyle = '#A9BDB0';
      hudCtx.font = 'bold 13px sans-serif';
      const routeLabel = state.activeRouteName.length > 16
        ? state.activeRouteName.slice(0, 15).toUpperCase() + '...'
        : state.activeRouteName.toUpperCase();
      hudCtx.fillText(routeLabel, topPillX + topPillW - 22, topPillY + 28);

      // Electric Lime route progress bar clipped neatly along bottom edge of pill
      hudCtx.beginPath();
      if (hudCtx.roundRect) {
        hudCtx.roundRect(topPillX, topPillY, topPillW, topPillH, 25);
      } else {
        hudCtx.rect(topPillX, topPillY, topPillW, topPillH);
      }
      hudCtx.clip();
      hudCtx.fillStyle = 'rgba(30, 51, 40, 0.90)';
      hudCtx.fillRect(topPillX, topPillY + topPillH - 5, topPillW, 5);
      hudCtx.fillStyle = '#C8F04A';
      hudCtx.fillRect(topPillX, topPillY + topPillH - 5, Math.max(12, topPillW * routeProgFrac), 5);
      hudCtx.restore();

      // Compact Pacer & Drafting Pill below Top-Left Status Pill
      const pacerPillY = topPillY + 58;
      drawGlassPanel(
        hudCtx,
        topPillX,
        pacerPillY,
        340,
        32,
        16,
        state.isDrafting ? '#C8F04A' : '#1E3328',
        0.82
      );
      hudCtx.save();
      hudCtx.textAlign = 'left';
      hudCtx.fillStyle = state.isDrafting ? '#C8F04A' : '#A9BDB0';
      hudCtx.font = 'bold 13px sans-serif';
      const pacerText = state.isDrafting ? ('DRAFTING · ' + state.nearestBotLabel) : state.nearestBotLabel;
      hudCtx.fillText(pacerText, topPillX + 16, pacerPillY + 21);
      hudCtx.restore();

      // 2. TOP-RIGHT / TOP-CENTER RIBBON (Workout Ribbon when Active, or Turn + Grade Pill)
      if (state.isWorkoutActive) {
        const pillW = 660;
        const pillH = 84;
        const pillX = 524;
        const pillY = 104;
        const isPulse = (state.workoutStepRemainingSec <= 3 || state.isWorkoutPaused) && Math.sin(now * 0.015) > 0;
        const borderColor = isPulse ? '#F43F5E' : '#C8F04A';

        drawGlassPanel(hudCtx, pillX, pillY, pillW, pillH, 24, borderColor, 0.90);

        hudCtx.save();
        hudCtx.fillStyle = isPulse ? '#F43F5E' : '#C8F04A';
        hudCtx.beginPath();
        hudCtx.roundRect ? hudCtx.roundRect(pillX + 26, pillY, pillW - 52, 4, 2) : hudCtx.rect(pillX + 26, pillY, pillW - 52, 4);
        hudCtx.fill();
        hudCtx.restore();

        hudCtx.save();
        hudCtx.textAlign = 'left';
        hudCtx.fillStyle = '#A9BDB0';
        hudCtx.font = 'bold 13px sans-serif';
        const biasText = state.workoutIntensityBiasPercent !== 0 ? ' (' + (state.workoutIntensityBiasPercent > 0 ? '+' : '') + state.workoutIntensityBiasPercent + '%)' : '';
        hudCtx.fillText('STEP ' + (state.workoutStepIndex + 1) + ' OF ' + state.workoutTotalSteps + biasText, pillX + 26, pillY + 28);

        hudCtx.fillStyle = '#F4F7F2';
        hudCtx.font = '900 20px sans-serif';
        hudCtx.fillText(state.workoutStepName.toUpperCase(), pillX + 26, pillY + 53);

        hudCtx.fillStyle = '#C8F04A';
        hudCtx.font = 'bold 14px sans-serif';
        hudCtx.fillText('TARGET ' + state.workoutTargetWatts + 'W @ ' + state.workoutTargetRpm + ' RPM', pillX + 26, pillY + 73);
        hudCtx.restore();

        const timerCx = pillX + pillW * 0.56;
        hudCtx.save();
        hudCtx.textAlign = 'center';
        const remMins = Math.floor(state.workoutStepRemainingSec / 60);
        const remSecs = state.workoutStepRemainingSec % 60;
        const remStr = String(remMins).padStart(2, '0') + ':' + String(remSecs).padStart(2, '0');
        hudCtx.fillStyle = isPulse ? '#F43F5E' : '#F4F7F2';
        hudCtx.font = '900 40px sans-serif';
        hudCtx.fillText(remStr, timerCx, pillY + 51);

        hudCtx.fillStyle = isPulse ? '#F43F5E' : '#A9BDB0';
        hudCtx.font = 'bold 12px sans-serif';
        hudCtx.fillText(state.isWorkoutPaused ? 'PAUSED' : 'REMAINING', timerCx, pillY + 71);
        hudCtx.restore();

        hudCtx.save();
        hudCtx.textAlign = 'right';
        hudCtx.fillStyle = '#FBBF24';
        hudCtx.font = 'bold 18px sans-serif';
        hudCtx.fillText(state.workoutEarnedStars + ' STARS', pillX + pillW - 26, pillY + 30);

        hudCtx.fillStyle = '#34D399';
        hudCtx.font = '900 17px sans-serif';
        hudCtx.fillText(state.workoutCompliancePercent.toFixed(0) + '% COMPL', pillX + pillW - 26, pillY + 53);

        if (state.workoutPacingPrompt) {
          hudCtx.fillStyle = state.workoutPacingPrompt.indexOf('ON TARGET') !== -1 ? '#C8F04A' : '#FBBF24';
          hudCtx.font = 'bold 12px sans-serif';
          hudCtx.fillText(state.workoutPacingPrompt, pillX + pillW - 26, pillY + 73);
        }
        hudCtx.restore();
      } else {
        const turnPillW = 312;
        const turnPillH = 50;
        const turnPillX = w - 28 - turnPillW;
        const turnPillY = 104;
        drawGlassPanel(hudCtx, turnPillX, turnPillY, turnPillW, turnPillH, 25, '#1E3328', 0.86);

        hudCtx.save();
        hudCtx.textAlign = 'left';
        hudCtx.fillStyle = upcomingTurn.color;
        hudCtx.font = '900 15px sans-serif';
        hudCtx.fillText(upcomingTurn.label, turnPillX + 20, turnPillY + 30);

        hudCtx.textAlign = 'right';
        hudCtx.fillStyle = gradeColor;
        hudCtx.font = '900 22px sans-serif';
        hudCtx.fillText(gradeSign + state.gradePercent.toFixed(1) + '%', turnPillX + turnPillW - 20, turnPillY + 32);
        hudCtx.restore();
      }

      // 3. BOTTOM-LEFT LANGKAHFIT CRISP TYPOGRAPHIC SPEED, POWER & 4-COLUMN STRIP
      const overlayX = 32;

      hudCtx.save();
      // Soft borderless radial backdrop gradient contained cleanly inside fillRect (zero hard edges)
      const softGrad = hudCtx.createRadialGradient(240, 535, 30, 240, 535, 280);
      softGrad.addColorStop(0.0, 'rgba(11, 21, 16, 0.56)');
      softGrad.addColorStop(0.60, 'rgba(11, 21, 16, 0.22)');
      softGrad.addColorStop(1.0, 'rgba(11, 21, 16, 0.0)');
      hudCtx.fillStyle = softGrad;
      hudCtx.fillRect(0, 230, 560, 520);

      hudCtx.textAlign = 'left';
      hudCtx.shadowColor = 'rgba(11, 21, 16, 0.88)';
      hudCtx.shadowBlur = 6;
      hudCtx.shadowOffsetY = 2;

      // Giant Hero Speed in Electric Lime (#C8F04A)
      const speedText = state.speedKmh.toFixed(1);
      hudCtx.font = '800 84px "Plus Jakarta Sans", sans-serif';
      hudCtx.fillStyle = '#C8F04A';
      hudCtx.fillText(speedText, overlayX, 514);
      const speedW = hudCtx.measureText(speedText).width;

      hudCtx.font = '700 21px "Plus Jakarta Sans", sans-serif';
      hudCtx.fillStyle = '#F4F7F2';
      hudCtx.fillText('km/h', overlayX + speedW + 8, 512);

      // Adjacent Compact Power Readout (clear of cyclist rear wheel)
      const powerX = overlayX + speedW + 78;
      const wattsText = String(state.watts);
      hudCtx.font = '800 48px "Plus Jakarta Sans", sans-serif';
      hudCtx.fillStyle = '#F4F7F2';
      hudCtx.fillText(wattsText, powerX, 496);
      const wattsW = hudCtx.measureText(wattsText).width;

      hudCtx.font = '700 18px "Plus Jakarta Sans", sans-serif';
      hudCtx.fillStyle = '#C8F04A';
      hudCtx.fillText('W', powerX + wattsW + 6, 494);

      hudCtx.font = '800 13px "Plus Jakarta Sans", sans-serif';
      const zoneLine = pZoneName + ' · ' + state.wattsPerKg.toFixed(1) + ' W/kg';
      hudCtx.fillStyle = pColor;
      hudCtx.fillText(zoneLine, powerX, 518);

      // Clean thin horizontal rule above 4-column metric strip
      hudCtx.shadowBlur = 0;
      hudCtx.strokeStyle = 'rgba(244, 247, 242, 0.42)';
      hudCtx.lineWidth = 1.25;
      hudCtx.beginPath();
      hudCtx.moveTo(overlayX, 540);
      hudCtx.lineTo(overlayX + 468, 540);
      hudCtx.stroke();

      // 4-Column Tabular Metric Row (crisp un-stroked labels & values)
      const mins = Math.floor(state.elapsedSeconds / 60);
      const secs = state.elapsedSeconds % 60;
      const timeStr = String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
      const hrDisplay = state.bpm > 0 ? (state.bpm + ' bpm') : '--';
      const metricCols = [
        { label: 'DISTANCE', value: (state.distanceMeters / 1000).toFixed(2) + ' km', color: '#F4F7F2' },
        { label: 'TIME', value: timeStr, color: '#F4F7F2' },
        { label: 'CADENCE', value: state.rpm + ' rpm', color: '#C8F04A' },
        { label: 'HEART RATE', value: hrDisplay, color: hrColor }
      ];

      hudCtx.shadowColor = 'rgba(11, 21, 16, 0.90)';
      hudCtx.shadowBlur = 5;
      for (let m = 0; m < metricCols.length; m++) {
        const colX = overlayX + m * 118;
        hudCtx.font = '700 11px "Plus Jakarta Sans", sans-serif';
        hudCtx.fillStyle = '#D7E5DA';
        hudCtx.fillText(metricCols[m].label, colX, 566);

        hudCtx.font = '800 21px "Plus Jakarta Sans", sans-serif';
        hudCtx.fillStyle = metricCols[m].color;
        hudCtx.fillText(metricCols[m].value, colX, 596);
      }
      hudCtx.restore();

      // 4. BOTTOM-RIGHT ROUNDED 2D MINI-MAP CARD
      const mapW = 224;
      const mapH = 198;
      const mapX = w - 28 - mapW;
      const mapY = 428;
      const mapR = 18;

      hudCtx.save();
      hudCtx.beginPath();
      if (hudCtx.roundRect) {
        hudCtx.roundRect(mapX, mapY, mapW, mapH, mapR);
      } else {
        hudCtx.rect(mapX, mapY, mapW, mapH);
      }
      hudCtx.clip();

      // Mini-map daylight sage terrain background + lakeside water corner
      hudCtx.fillStyle = '#6E8F58';
      hudCtx.fillRect(mapX, mapY, mapW, mapH);

      hudCtx.fillStyle = '#6FA3D2';
      hudCtx.beginPath();
      hudCtx.moveTo(mapX, mapY);
      hudCtx.lineTo(mapX + mapW * 0.56, mapY);
      hudCtx.quadraticCurveTo(mapX + mapW * 0.42, mapY + mapH * 0.45, mapX, mapY + mapH * 0.62);
      hudCtx.closePath();
      hudCtx.fill();

      // Fit routeWaypoints into mini-map bounds
      const wps = (Array.isArray(routeWaypoints) && routeWaypoints.length >= 2)
        ? routeWaypoints
        : [[45.0592, 6.0358, 724], [45.0655, 6.0431, 860], [45.0721, 6.0472, 1118], [45.0924, 6.0706, 1815]];

      let minLat = Infinity, maxLat = -Infinity, minLon = Infinity, maxLon = -Infinity;
      for (let i = 0; i < wps.length; i++) {
        const wLat = Number(wps[i][0]) || 0;
        const wLon = Number(wps[i][1]) || 0;
        if (wLat < minLat) minLat = wLat;
        if (wLat > maxLat) maxLat = wLat;
        if (wLon < minLon) minLon = wLon;
        if (wLon > maxLon) maxLon = wLon;
      }
      const latSpan = Math.max(0.0008, maxLat - minLat);
      const lonSpan = Math.max(0.0008, maxLon - minLon);
      const pad = 22;
      const innerMapW = mapW - pad * 2;
      const innerMapH = (mapH - 28) - pad * 2;

      function mapProject(pLat, pLon) {
        return {
          x: mapX + pad + ((pLon - minLon) / lonSpan) * innerMapW,
          y: mapY + pad + (1.0 - (pLat - minLat) / latSpan) * innerMapH
        };
      }

      // Route dark outline + upcoming light track
      hudCtx.lineCap = 'round';
      hudCtx.lineJoin = 'round';
      hudCtx.beginPath();
      for (let i = 0; i < wps.length; i++) {
        const p = mapProject(Number(wps[i][0]) || 0, Number(wps[i][1]) || 0);
        if (i === 0) hudCtx.moveTo(p.x, p.y);
        else hudCtx.lineTo(p.x, p.y);
      }
      hudCtx.strokeStyle = 'rgba(11, 21, 16, 0.72)';
      hudCtx.lineWidth = 7;
      hudCtx.stroke();

      hudCtx.strokeStyle = '#F4F7F2';
      hudCtx.lineWidth = 3.5;
      hudCtx.stroke();

      // Completed Electric Lime route trace up to current rider position
      let closestIdx = 0;
      let minSq = Infinity;
      for (let i = 0; i < wps.length; i++) {
        const dLat = (Number(wps[i][0]) || 0) - state.lat;
        const dLon = (Number(wps[i][1]) || 0) - state.lon;
        const sq = dLat * dLat + dLon * dLon;
        if (sq < minSq) {
          minSq = sq;
          closestIdx = i;
        }
      }
      const riderPt = mapProject(state.lat, state.lon);
      hudCtx.beginPath();
      for (let i = 0; i <= closestIdx; i++) {
        const p = mapProject(Number(wps[i][0]) || 0, Number(wps[i][1]) || 0);
        if (i === 0) hudCtx.moveTo(p.x, p.y);
        else hudCtx.lineTo(p.x, p.y);
      }
      hudCtx.lineTo(riderPt.x, riderPt.y);
      hudCtx.strokeStyle = '#C8F04A';
      hudCtx.lineWidth = 4;
      hudCtx.stroke();

      // White checkpoint dots along the route
      const numCheckpoints = Math.min(8, wps.length);
      for (let c = 0; c < numCheckpoints; c++) {
        const idx = Math.floor((c / Math.max(1, numCheckpoints - 1)) * (wps.length - 1));
        const cp = mapProject(Number(wps[idx][0]) || 0, Number(wps[idx][1]) || 0);
        hudCtx.fillStyle = '#F4F7F2';
        hudCtx.beginPath();
        hudCtx.arc(cp.x, cp.y, 3.2, 0, Math.PI * 2);
        hudCtx.fill();
        hudCtx.strokeStyle = '#0B1510';
        hudCtx.lineWidth = 1.2;
        hudCtx.stroke();
      }

      // Pacer Bot dots on mini-map
      for (let b = 0; b < bots.length; b++) {
        const botSample = sampleRouteAtDistance(bots[b].dist);
        const bp = mapProject(botSample.lat, botSample.lon);
        hudCtx.fillStyle = bots[b].color;
        hudCtx.beginPath();
        hudCtx.arc(bp.x, bp.y, 3.5, 0, Math.PI * 2);
        hudCtx.fill();
      }

      // Rider beacon on mini-map
      hudCtx.fillStyle = 'rgba(200, 240, 74, 0.42)';
      hudCtx.beginPath();
      hudCtx.arc(riderPt.x, riderPt.y, 10, 0, Math.PI * 2);
      hudCtx.fill();
      hudCtx.fillStyle = '#C8F04A';
      hudCtx.beginPath();
      hudCtx.arc(riderPt.x, riderPt.y, 5.5, 0, Math.PI * 2);
      hudCtx.fill();
      hudCtx.strokeStyle = '#0B1510';
      hudCtx.lineWidth = 2;
      hudCtx.stroke();

      // Mini-map bottom grade & route elevation strip
      hudCtx.fillStyle = 'rgba(11, 21, 16, 0.90)';
      hudCtx.fillRect(mapX, mapY + mapH - 28, mapW, 28);
      hudCtx.textAlign = 'left';
      hudCtx.fillStyle = '#A9BDB0';
      hudCtx.font = 'bold 11px sans-serif';
      hudCtx.fillText(Math.round(pt0.ele) + 'm ELE', mapX + 12, mapY + mapH - 10);
      hudCtx.textAlign = 'right';
      hudCtx.fillStyle = '#C8F04A';
      hudCtx.font = '900 12px sans-serif';
      hudCtx.fillText(gradeSign + state.gradePercent.toFixed(1) + '% GRADE', mapX + mapW - 12, mapY + mapH - 10);
      hudCtx.restore();

      // Mini-map card border stroke
      hudCtx.save();
      hudCtx.beginPath();
      if (hudCtx.roundRect) {
        hudCtx.roundRect(mapX, mapY, mapW, mapH, mapR);
      } else {
        hudCtx.rect(mapX, mapY, mapW, mapH);
      }
      hudCtx.strokeStyle = '#1E3328';
      hudCtx.lineWidth = 2.5;
      hudCtx.stroke();
      hudCtx.restore();

      // Signal Three.js that texture needs update
      hudTexture.needsUpdate = true;
    }

    // ==========================================
    // DYNAMIC WORLD & SCENERY DEFORMATION
    // ==========================================
    function updateWorldGeometry(localDist) {
      const pt0 = sampleRouteAtDistance(localDist);

      // 1. Scroll Road, Grass, Lake & Stone Wall Textures smoothly
      if (roadTexture) {
        roadTexture.offset.y = -(localDist * 0.1) % 1;
      }
      if (grassTexture) {
        grassTexture.offset.y = -(localDist * 0.1) % 1;
      }
      if (lakeTexture) {
        lakeTexture.offset.y = -(localDist * 0.08) % 1;
      }
      if (stoneTexture) {
        stoneTexture.offset.x = (localDist * 0.2) % 1;
      }

      // Keep sky dome mountain horizon aligned with climbing/descending road horizon
      if (skyDome) {
        const endProj = projectRoadOffsetAhead(localDist, 220, pt0);
        skyDome.position.set(0, endProj.slopeY * 0.45, -100);
      }

      // 2. Deform Continuous Ribbons (Road, Guardrails, Stone Wall, Hillside, Lake) along -Z
      const deformRibbon = function(mesh, yOffset, withHillSlope) {
        if (!mesh || !mesh.geometry.userData || !mesh.geometry.userData.basePositions) return;
        const pos = mesh.geometry.attributes.position;
        const base = mesh.geometry.userData.basePositions;
        for (let i = 0; i < pos.count; i++) {
          const bX = base[i * 3];
          const bY = base[i * 3 + 1];
          const bZ = base[i * 3 + 2];
          const relD = -bZ; // Signed distance ahead (+ ahead, - behind)
          const proj = projectRoadOffsetAhead(localDist, relD, pt0);
          let hillOffset = 0;
          if (withHillSlope) {
            const distPastShoulder = Math.max(0, bX - 4.2);
            hillOffset = distPastShoulder * 0.18 + Math.sin(bX * 0.09 + (localDist + relD) * 0.035) * 0.55;
          }
          pos.setX(i, bX + proj.curveX);
          pos.setY(i, bY + proj.slopeY + yOffset + hillOffset);
        }
        pos.needsUpdate = true;
      };

      deformRibbon(roadMesh, 0, false);
      deformRibbon(groundMesh, -0.05, true);
      deformRibbon(lakeMesh, -0.58, false);
      deformRibbon(stoneWallMesh, 0, false);
      deformRibbon(stoneWallOuterMesh, 0, false);
      deformRibbon(stoneWallTopMesh, 0, false);
      deformRibbon(leftRailFaceMesh, 0, false);
      deformRibbon(leftRailTopMesh, 0, false);
      deformRibbon(rightRailFaceMesh, 0, false);
      deformRibbon(rightRailTopMesh, 0, false);

      // 3. Scroll Pine Trees along the contoured right hillside
      if (treesGroup) {
        for (let i = 0; i < treesGroup.children.length; i++) {
          const tree = treesGroup.children[i];
          const d = ((tree.userData.baseDist - (localDist % 240)) + 240) % 240 - 10;
          const proj = projectRoadOffsetAhead(localDist, d, pt0);
          const lateral = tree.userData.side * tree.userData.lateral;
          const distPastShoulder = Math.max(0, lateral - 4.2);
          const hillY = distPastShoulder * 0.18 + Math.sin(lateral * 0.09 + (localDist + d) * 0.035) * 0.55 - 0.12;
          tree.position.set(proj.curveX + lateral, proj.slopeY + hillY, -d);
        }
      }

      // 3b. Scroll Cylindrical Steel Guardrail Posts smoothly along road curves & slopes
      if (guardrailPostsGroup) {
        for (let i = 0; i < guardrailPostsGroup.children.length; i++) {
          const pair = guardrailPostsGroup.children[i];
          const d = ((pair.userData.baseDist - (localDist % 240)) + 240) % 240 - 10;
          const proj = projectRoadOffsetAhead(localDist, d, pt0);
          pair.position.set(proj.curveX, proj.slopeY, -d);
        }
      }

      // 4. Distance Milestone Arch Gate (Every 500m)
      if (archMesh) {
        const nextMilestone = Math.ceil((localDist + 5) / 500) * 500;
        const d = nextMilestone - localDist;
        if (d > 0 && d < 230) {
          archMesh.visible = true;
          const proj = projectRoadOffsetAhead(localDist, d, pt0);
          archMesh.position.set(proj.curveX, proj.slopeY, -d);
          if (archMesh.userData.currentKm !== nextMilestone) {
            archMesh.userData.currentKm = nextMilestone;
            updateArchSignText(archSignCtx, archSignTexture, (nextMilestone / 1000).toFixed(1) + ' KM');
          }
        } else {
          archMesh.visible = false;
        }
      }

      // 5. Position AI Bots along -Z on the real GPS road ribbon
      if (botsGroup) {
        const routeTot = Math.max(100, state.routeTotalMeters || 4000);
        const riderLoop = ((localDist % routeTot) + routeTot) % routeTot;
        for (let b = 0; b < botsGroup.children.length; b++) {
          const botMesh = botsGroup.children[b];
          const bData = bots[b];
          let relDist = bData.dist - riderLoop;
          if (relDist < -20) relDist += routeTot;
          if (relDist < 220) {
            botMesh.visible = true;
            const relD = Math.max(0, relDist);
            const proj = projectRoadOffsetAhead(localDist, relD, pt0);
            botMesh.position.set(proj.curveX + bData.laneOffset * 2.0, proj.slopeY, -relDist);
          } else {
            botMesh.visible = false;
          }
        }
      }
    }

    // ==========================================
    // MAIN ANIMATION & RENDERING LOOP
    // ==========================================
    let lastTime = performance.now();
    let cameraInertiaPitch = 0;
    let cameraInertiaRoll = 0;
    let smoothedTurnRate = 0;

    function animate(now) {
      try {
        const dt = Math.min(0.1, Math.max(0.001, (now - lastTime) / 1000));
        lastTime = now;

        // Update physics calculations
        const speedMs = (state.speedKmh * 1000) / 3600;
        state.wheelRotationRad += (speedMs / 0.35) * dt;
        state.crankAngleRad += ((state.rpm / 60) * Math.PI * 2) * dt;

        // Update AI Bot distances
        const routeTot = Math.max(100, state.routeTotalMeters || 4000);
        for (let i = 0; i < bots.length; i++) {
          bots[i].dist = (bots[i].dist + bots[i].speedMs * dt) % routeTot;
        }

        // If in MAP Mode, render the full 2D Tactical OpenStreetMap View
        if (state.cameraMode === 'MAP') {
          threeCanvas.style.display = 'none';
          fallback2dCanvas.style.display = 'block';
          renderGpsMap(fallbackCtx, 0, 0, fallback2dCanvas.width, fallback2dCanvas.height, mapZoom);
        } else if (isThreeSupported) {
          threeCanvas.style.display = 'block';
          fallback2dCanvas.style.display = 'none';

          const localDist = state.distanceMeters;
          const turnInfo = detectUpcomingTurn(localDist);
          const speedLeanFactor = Math.min(1.0, state.speedKmh / 18.0);
          const targetCurve = turnInfo.turnRate * (0.35 + 0.65 * speedLeanFactor);
          smoothedTurnRate += (targetCurve - smoothedTurnRate) * Math.min(1.0, 5.0 * dt);
          const currentCurve = smoothedTurnRate;

          const projFront = projectRoadOffsetAhead(localDist, 0.55);
          const projRear = projectRoadOffsetAhead(localDist, -0.50);
          const roadPitchRad = Math.max(-0.32, Math.min(0.32, Math.atan2(projFront.slopeY - projRear.slopeY, 1.05)));
          const roadBaseY = (projFront.slopeY * 0.50 + projRear.slopeY * 0.55) / 1.05;

          // 1. Update Cyclist and Bike
          if (frontWheel && rearWheel) {
            frontWheel.rotation.x = state.wheelRotationRad;
            rearWheel.rotation.x = state.wheelRotationRad;
          }
          if (crankGroup) {
            crankGroup.rotation.x = state.crankAngleRad;
          }
          if (leftPedal && rightPedal) {
            leftPedal.rotation.x = -state.crankAngleRad;
            rightPedal.rotation.x = -state.crankAngleRad;
          }
          if (leftLegData && rightLegData) {
            updateLegIK(leftLegData, state.crankAngleRad);
            updateLegIK(rightLegData, state.crankAngleRad);
          }
          if (cyclistUpperBody) {
            const cadenceFade = Math.min(1.0, Math.max(0.0, (state.rpm - 5) / 45));
            cyclistUpperBody.rotation.z = Math.sin(state.crankAngleRad) * 0.016 * cadenceFade;
            cyclistUpperBody.rotation.x = Math.sin(state.crankAngleRad * 2) * 0.008 * cadenceFade;
          }
          if (bikeGroup) {
            // Bike leans into corners (+rotation.z banks world +X on right turns with Ry = PI)
            // and pitches along the local road slope tangent (+rotation.x lifts front wheel at world -Z)
            const bikeLean = currentCurve * 0.28;
            bikeGroup.rotation.z = bikeLean;
            bikeGroup.rotation.x = roadPitchRad;
            bikeGroup.position.x = currentCurve * 0.35;
            bikeGroup.position.y = roadBaseY;
          }

          // 2. Deform Road & Scroll Scenery along -Z
          updateWorldGeometry(localDist);

          // 3. Update Camera Modes & Dynamic Inertia (Camera points toward -Z)
          const targetPitch = roadPitchRad * 0.55;
          const targetRoll = -currentCurve * 0.08;
          cameraInertiaPitch += (targetPitch - cameraInertiaPitch) * 4.0 * dt;
          cameraInertiaRoll += (targetRoll - cameraInertiaRoll) * 4.0 * dt;

          if (state.cameraMode === 'POV') {
            // First-person cockpit: looking forward over the drops toward -Z
            cameraRig.position.set(bikeGroup.position.x, 1.35 + roadBaseY, -0.15);
            camera.position.set(0, 0, 0);
            camera.rotation.set(cameraInertiaPitch, 0, cameraInertiaRoll);
          } else if (state.cameraMode === 'DRONE') {
            // Elevated overview behind (+Z) looking down forward (-Z)
            cameraRig.position.set(bikeGroup.position.x * 0.6, 4.8 + roadBaseY, 8.5);
            camera.position.set(0, 0, 0);
            camera.rotation.set(-0.32 + cameraInertiaPitch * 0.5, 0, cameraInertiaRoll * 0.5);
          } else {
            // Dynamic 3/4 CHASE Mode: Lateral offset (+0.65m X) and slightly elevated,
            // revealing bicycle frame, deep wheels, curved spine, and 2-segment leg articulation
            cameraRig.position.set(bikeGroup.position.x * 0.75 + 0.65, 1.68 + roadBaseY, 3.35);
            camera.position.set(0, 0, 0);
            camera.rotation.set(-0.11 + cameraInertiaPitch, -0.16 + cameraInertiaRoll * 0.5, cameraInertiaRoll);
          }

          // Subtle visor inertia lag relative to camera
          if (visorMesh) {
            visorMesh.visible = true;
            visorMesh.position.set(-cameraInertiaRoll * 0.06, cameraInertiaPitch * 0.05, 0);
            visorMesh.rotation.set(0, 0, -cameraInertiaRoll * 0.2);
          }

          // 4. Update Visor HUD Canvas Texture (throttled to ~30 FPS to save GPU memory bandwidth & prevent thermal throttling)
          if (now - lastHudRenderTime >= 32) {
            renderVisorHud(now);
            lastHudRenderTime = now;
          }

          // 5. Render Three.js Scene
          renderer.render(scene, camera);
        }

        // Interactive map if modal is open or in MAP camera mode
        if (state.isMapModalOpen || state.cameraMode === 'MAP') {
          renderGpsMap(fullMapCtx, 0, 0, fullMapCanvas.width, fullMapCanvas.height, mapZoom);
        }
      } catch (err) {
        console.error('Render error:', err);
      } finally {
        requestAnimationFrame(animate);
      }
    }

    function resize() {
      const w = window.innerWidth || document.documentElement.clientWidth || 800;
      const h = window.innerHeight || document.documentElement.clientHeight || 450;

      fallback2dCanvas.width = w;
      fallback2dCanvas.height = h;

      if (renderer && camera) {
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
        updateVisorFrustumScale(w, h);
      }

      if (state.isMapModalOpen || state.cameraMode === 'MAP') {
        const leftOffset = state.isMapModalOpen ? 340 : 28;
        fullMapCanvas.width = Math.max(240, fullMapContainer.clientWidth || (w - leftOffset));
        fullMapCanvas.height = Math.max(160, fullMapContainer.clientHeight || (h - 200));
      }
    }

    // Single Guarded Bootstrap
    let hasBootstrapped = false;
    function bootstrap() {
      if (hasBootstrapped) return;
      hasBootstrapped = true;
      initThree();
      resize();
      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', resize);
    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', bootstrap);
    } else {
      bootstrap();
    }
  </script>
</body>
</html>
