<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>LazyFitBike 3D Cockpit &amp; Holographic Visor HUD</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #09090B;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    #viewport-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #three-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #fullmap-container {
      display: none;
      position: absolute;
      top: 60px;
      bottom: 74px;
      left: 310px;
      right: 14px;
      border-radius: 14px;
      border: 2px solid #F97316;
      background: #0F172A;
      overflow: hidden;
      z-index: 50;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.75);
    }
    #fullmap-canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }
    #map-hint {
      position: absolute;
      bottom: 8px;
      left: 10px;
      right: 10px;
      background: rgba(9, 9, 11, 0.90);
      color: #F4F4F5;
      border: 1px solid #27272A;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      pointer-events: none;
      font-variant-numeric: tabular-nums;
    }
    #map-controls {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 6px;
      z-index: 60;
    }
    .map-btn {
      background: rgba(9, 9, 11, 0.90);
      color: #F4F4F5;
      border: 1px solid #3F3F46;
      border-radius: 8px;
      padding: 6px 11px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }
    .map-btn:active {
      background: #F97316;
      border-color: #F97316;
    }
    #fallback-2d-canvas {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
    }
  </style>
  <script src="js/three.min.js"></script>
</head>
<body>
  <div id="viewport-container">
    <canvas id="three-canvas"></canvas>
    <canvas id="fallback-2d-canvas"></canvas>
  </div>

  <div id="fullmap-container">
    <canvas id="fullmap-canvas"></canvas>
    <div id="map-controls">
      <button class="map-btn" id="btn-locate-gps" type="button" style="background:#F97316;border-color:#F97316;color:#FFFFFF;">📍 My GPS</button>
      <button class="map-btn" id="btn-zoom-in" type="button">＋</button>
      <button class="map-btn" id="btn-zoom-out" type="button">－</button>
      <button class="map-btn" id="btn-recenter" type="button">◎ Rider</button>
      <button class="map-btn" id="btn-clear-pin" type="button">✕ Pin</button>
    </div>
    <div id="map-hint">OpenStreetMap Live View: Tap '📍 My GPS', drag to pan, or tap any 2 points to build a road route.</div>
  </div>

  <script>
    // State management & telemetry bridge
    const state = {
      speedKmh: 0,
      rpm: 0,
      watts: 0,
      gradePercent: 0,
      distanceMeters: 0,
      cameraMode: 'CHASE',
      lat: 45.0592,
      lon: 6.0358,
      curvature: 0,
      isMapModalOpen: false,
      crankAngleRad: 0,
      // Extended telemetry
      bpm: 0,
      wattsPerKg: 0.0,
      ftpWatts: 200,
      powerZone: 1,
      hrZone: 1,
      elapsedSeconds: 0,
      activeRouteName: "Alpe d'Huez Climb",
      isDrafting: false,
      nearestBotLabel: 'Bot C (2.5 W/kg) +12m',
      routeTotalMeters: 4000,
      hasGoogleMapsKey: false,
      wheelRotationRad: 0,
      // Structured Workout State
      isWorkoutActive: false,
      workoutName: '',
      workoutTargetWatts: 0,
      workoutTargetRpm: 0,
      workoutStepRemainingSec: 0,
      workoutStepIndex: 0,
      workoutTotalSteps: 0,
      workoutStepName: '',
      workoutCompliancePercent: 100,
      workoutEarnedStars: 0,
      workoutPacingPrompt: '',
      workoutIntensityBiasPercent: 0,
      isWorkoutPaused: false
    };

    let routeWaypoints = [
      [45.0592, 6.0358, 724],
      [45.0655, 6.0431, 860],
      [45.0721, 6.0472, 1118],
      [45.0832, 6.0555, 1420],
      [45.0924, 6.0706, 1815]
    ];

    const ZONE_COLORS = {
      1: '#94A3B8', // Zone 1 Gray: Active Recovery
      2: '#38BDF8', // Zone 2 Blue: Endurance
      3: '#34D399', // Zone 3 Green: Tempo
      4: '#F97316', // Zone 4 Orange: Threshold
      5: '#F43F5E'  // Zone 5 Red: VO2 Max / Anaerobic
    };

    const ZONE_NAMES = {
      1: 'Z1 RECOVERY',
      2: 'Z2 ENDURANCE',
      3: 'Z3 TEMPO',
      4: 'Z4 THRESHOLD',
      5: 'Z5 VO2 MAX'
    };

    const bots = [
      { name: 'Bot A (1.8 W/kg)', speedMs: 7.2, dist: 40, color: '#38bdf8', laneOffset: 0.8 },
      { name: 'Bot B (2.2 W/kg)', speedMs: 8.1, dist: 95, color: '#a3e635', laneOffset: -0.7 },
      { name: 'Bot C (2.5 W/kg)', speedMs: 8.8, dist: 18, color: '#fbbf24', laneOffset: 0.5 },
      { name: 'Bot D (3.0 W/kg)', speedMs: 9.8, dist: 180, color: '#f472b6', laneOffset: -0.6 },
      { name: 'Bot E (3.6 W/kg)', speedMs: 10.9, dist: 310, color: '#c084fc', laneOffset: 0.7 }
    ];

    function haversineMetersJs(lat1, lon1, lat2, lon2) {
      const R = 6371000.0;
      const dLat = (lat2 - lat1) * Math.PI / 180.0;
      const dLon = (lon2 - lon1) * Math.PI / 180.0;
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180.0) * Math.cos(lat2 * Math.PI / 180.0) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(Math.max(0.0, 1.0 - a)));
      return R * c;
    }

    function computeBearingDegJs(lat1, lon1, lat2, lon2) {
      const phi1 = lat1 * Math.PI / 180.0;
      const phi2 = lat2 * Math.PI / 180.0;
      const dLon = (lon2 - lon1) * Math.PI / 180.0;
      const y = Math.sin(dLon) * Math.cos(phi2);
      const x = Math.cos(phi1) * Math.sin(phi2) - Math.sin(phi1) * Math.cos(phi2) * Math.cos(dLon);
      const brng = Math.atan2(y, x) * 180.0 / Math.PI;
      return (brng + 360.0) % 360.0;
    }

    function shortestAngleDeg(fromDeg, toDeg) {
      return ((toDeg - fromDeg + 540.0) % 360.0) - 180.0;
    }

    function ensureRouteMetrics(wps) {
      if (!Array.isArray(wps) || wps.length < 2) return;
      let cumDist = 0;
      for (let i = 0; i < wps.length; i++) {
        const lat = Number(wps[i][0]) || 0;
        const lon = Number(wps[i][1]) || 0;
        const ele = Number(wps[i][2]) || 0;
        if (i > 0) {
          const prevLat = Number(wps[i - 1][0]) || 0;
          const prevLon = Number(wps[i - 1][1]) || 0;
          cumDist += haversineMetersJs(prevLat, prevLon, lat, lon);
        }
        const hasDist = wps[i].length >= 4 && wps[i][3] !== undefined && !isNaN(Number(wps[i][3]));
        const finalDist = hasDist ? Number(wps[i][3]) : cumDist;
        cumDist = finalDist;

        let bearing = 0;
        if (wps[i].length >= 5 && wps[i][4] !== undefined && !isNaN(Number(wps[i][4]))) {
          bearing = Number(wps[i][4]);
        } else if (i < wps.length - 1) {
          const nextLat = Number(wps[i + 1][0]) || lat;
          const nextLon = Number(wps[i + 1][1]) || lon;
          bearing = computeBearingDegJs(lat, lon, nextLat, nextLon);
        } else if (i > 0) {
          bearing = Number(wps[i - 1][4]) || 0;
        }
        wps[i] = [lat, lon, ele, finalDist, bearing];
      }
      const total = Number(wps[wps.length - 1][3]) || 0;
      if (total >= 50) {
        state.routeTotalMeters = total;
      }
    }

    ensureRouteMetrics(routeWaypoints);

    function defaultMapHintText() {
      return state.hasGoogleMapsKey
        ? 'Google Maps Routes v2 (Bicycle) + Real Elevation Active: Drag to pan, or tap any 2 points to build a route.'
        : 'OpenStreetMap Live View: Drag to pan, or tap any 2 points on the map to build an OSRM road route.';
    }

    // Android bridge entry points
    window.setRoutePolyline = function(jsonArrayStr) {
      try {
        const parsed = typeof jsonArrayStr === 'string' ? JSON.parse(jsonArrayStr) : jsonArrayStr;
        if (Array.isArray(parsed) && parsed.length >= 2) {
          routeWaypoints = parsed;
          ensureRouteMetrics(routeWaypoints);
          if (!tapStartLatLon) {
            mapViewLat = null;
            mapViewLon = null;
            if (mapHintEl) {
              mapHintEl.textContent = defaultMapHintText();
            }
          }
        }
      } catch (e) {}
    };

    window.centerMapAtLocation = function(lat, lon, setAsStartPin) {
      const nLat = Number(lat);
      const nLon = Number(lon);
      if (isNaN(nLat) || isNaN(nLon)) return;
      mapViewLat = nLat;
      mapViewLon = nLon;
      mapZoom = 15;
      if (setAsStartPin) {
        tapStartLatLon = [nLat, nLon];
        if (mapHintEl) {
          mapHintEl.textContent =
            '📍 Centered on your GPS (' + nLat.toFixed(4) + ', ' + nLon.toFixed(4) + ') as Start Pin! Tap any Destination on the map.';
        }
      } else if (mapHintEl) {
        mapHintEl.textContent =
          '📍 Centered on (' + nLat.toFixed(4) + ', ' + nLon.toFixed(4) + '). Tap Start Pin & Destination Pin.';
      }
    };

    window.updateRideState = function(
      speedKmh, rpm, watts, gradePercent, distanceMeters,
      cameraMode, lat, lon, curvature, isMapModalOpen,
      bpm, wattsPerKg, ftpWatts, powerZone, hrZone, elapsedSeconds, activeRouteName,
      isDrafting, nearestBotLabel, routeTotalMeters, hasGoogleMapsKey
    ) {
      state.speedKmh = Number(speedKmh) || 0;
      state.rpm = Number(rpm) || 0;
      state.watts = Math.max(0, Math.round(Number(watts) || 0));
      state.gradePercent = Number(gradePercent) || 0;
      state.distanceMeters = Number(distanceMeters) || 0;
      state.cameraMode = cameraMode || 'CHASE';
      if (lat !== undefined) state.lat = Number(lat) || state.lat;
      if (lon !== undefined) state.lon = Number(lon) || state.lon;
      if (curvature !== undefined) state.curvature = Number(curvature) || 0;

      if (bpm !== undefined) state.bpm = Math.max(0, Math.round(Number(bpm) || 0));
      if (wattsPerKg !== undefined) state.wattsPerKg = Number(wattsPerKg) || 0;
      if (ftpWatts !== undefined && Number(ftpWatts) > 0) state.ftpWatts = Number(ftpWatts);
      if (powerZone !== undefined && Number(powerZone) >= 1) state.powerZone = Math.min(5, Math.max(1, Math.round(Number(powerZone))));
      if (hrZone !== undefined && Number(hrZone) >= 1) state.hrZone = Math.min(5, Math.max(1, Math.round(Number(hrZone))));
      if (elapsedSeconds !== undefined) state.elapsedSeconds = Math.max(0, Math.round(Number(elapsedSeconds) || 0));
      if (activeRouteName) state.activeRouteName = String(activeRouteName);
      if (isDrafting !== undefined) state.isDrafting = Boolean(isDrafting);
      if (nearestBotLabel) state.nearestBotLabel = String(nearestBotLabel);
      if (routeTotalMeters !== undefined && Number(routeTotalMeters) >= 100) state.routeTotalMeters = Number(routeTotalMeters);
      if (hasGoogleMapsKey !== undefined) {
        const nextGmp = Boolean(hasGoogleMapsKey);
        if (nextGmp !== state.hasGoogleMapsKey) {
          state.hasGoogleMapsKey = nextGmp;
          if (mapHintEl && !tapStartLatLon) {
            mapHintEl.textContent = defaultMapHintText();
          }
        }
      }

      const shouldShowModal = Boolean(isMapModalOpen);
      const shouldShowInteractiveMap = shouldShowModal || state.cameraMode === 'MAP';
      const targetLeft = shouldShowModal ? '310px' : '14px';
      if (
        shouldShowModal !== state.isMapModalOpen ||
        (fullMapContainer.style.display === 'block') !== shouldShowInteractiveMap ||
        fullMapContainer.style.left !== targetLeft
      ) {
        state.isMapModalOpen = shouldShowModal;
        fullMapContainer.style.left = targetLeft;
        fullMapContainer.style.display = shouldShowInteractiveMap ? 'block' : 'none';
        resize();
      }
    };

    window.updateWorkoutHud = function(
      active, name, targetWatts, targetRpm, remainingSec, stepIdx, totalSteps,
      stepName, compliancePct, earnedStars, prompt, biasPct, paused
    ) {
      state.isWorkoutActive = Boolean(active);
      state.workoutName = name ? String(name) : '';
      state.workoutTargetWatts = Math.max(0, Math.round(Number(targetWatts) || 0));
      state.workoutTargetRpm = Math.max(0, Math.round(Number(targetRpm) || 0));
      state.workoutStepRemainingSec = Math.max(0, Math.round(Number(remainingSec) || 0));
      state.workoutStepIndex = Math.max(0, Math.round(Number(stepIdx) || 0));
      state.workoutTotalSteps = Math.max(0, Math.round(Number(totalSteps) || 0));
      state.workoutStepName = stepName ? String(stepName) : '';
      state.workoutCompliancePercent = Math.min(100, Math.max(0, Number(compliancePct) || 100));
      state.workoutEarnedStars = Math.max(0, Math.round(Number(earnedStars) || 0));
      state.workoutPacingPrompt = prompt ? String(prompt) : '';
      state.workoutIntensityBiasPercent = Math.round(Number(biasPct) || 0);
      state.isWorkoutPaused = Boolean(paused);
    };

    // OpenStreetMap 2D Map support (Modal & MAP mode)
    const osmTileCache = {};
    let tapStartLatLon = null;
    let mapViewLat = null;
    let mapViewLon = null;
    let mapZoom = 15;
    let isDraggingMap = false;
    let didPanMoved = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let dragStartCenterTileX = 0;
    let dragStartCenterTileY = 0;

    const fullMapContainer = document.getElementById('fullmap-container');
    const fullMapCanvas = document.getElementById('fullmap-canvas');
    const fullMapCtx = fullMapCanvas.getContext('2d');
    const mapHintEl = document.getElementById('map-hint');

    document.getElementById('btn-locate-gps').addEventListener('click', function(ev) {
      ev.stopPropagation();
      if (mapHintEl) {
        mapHintEl.textContent = '📍 Requesting your live GPS location...';
      }
      if (window.AndroidBridge && window.AndroidBridge.onLocateMeRequested) {
        window.AndroidBridge.onLocateMeRequested();
      }
    });
    document.getElementById('btn-zoom-in').addEventListener('click', function(ev) {
      ev.stopPropagation();
      mapZoom = Math.min(18, mapZoom + 1);
    });
    document.getElementById('btn-zoom-out').addEventListener('click', function(ev) {
      ev.stopPropagation();
      mapZoom = Math.max(4, mapZoom - 1);
    });
    document.getElementById('btn-recenter').addEventListener('click', function(ev) {
      ev.stopPropagation();
      mapViewLat = null;
      mapViewLon = null;
      mapZoom = 15;
    });
    document.getElementById('btn-clear-pin').addEventListener('click', function(ev) {
      ev.stopPropagation();
      tapStartLatLon = null;
      if (mapHintEl) mapHintEl.textContent = defaultMapHintText();
    });

    const fallback2dCanvas = document.getElementById('fallback-2d-canvas');
    const fallbackCtx = fallback2dCanvas.getContext('2d');

    function lonToTileX(lon, zoom) {
      return ((lon + 180) / 360) * Math.pow(2, zoom);
    }
    function latToTileY(lat, zoom) {
      const rad = (lat * Math.PI) / 180;
      return (((1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2) * Math.pow(2, zoom));
    }
    function tileXToLon(tileX, zoom) {
      return (tileX / Math.pow(2, zoom)) * 360 - 180;
    }
    function tileYToLat(tileY, zoom) {
      const n = Math.PI - (2 * Math.PI * tileY) / Math.pow(2, zoom);
      return (180 / Math.PI) * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
    }

    function getOsmTile(z, x, y) {
      const maxTile = Math.pow(2, z);
      const wrappedX = ((x % maxTile) + maxTile) % maxTile;
      if (y < 0 || y >= maxTile) return null;
      const key = z + '/' + wrappedX + '/' + y;
      const existing = osmTileCache[key];
      if (existing) {
        if (existing.failedAt && (Date.now() - existing.failedAt > 6000)) {
          delete osmTileCache[key];
        } else {
          return existing;
        }
      }
      const img = new Image();
      img.loadedOk = false;
      img.triedFallback = false;
      img.onload = function() { img.loadedOk = true; };
      img.onerror = function() {
        if (!img.triedFallback) {
          img.triedFallback = true;
          img.src = 'https://a.basemaps.cartocdn.com/rastertiles/voyager/' + key + '.png';
        } else {
          img.failedAt = Date.now();
        }
      };
      img.src = 'https://tile.openstreetmap.org/' + key + '.png';
      osmTileCache[key] = img;
      return img;
    }

    function renderGpsMap(targetCtx, boxX, boxY, boxW, boxH, zoom) {
      targetCtx.save();
      targetCtx.beginPath();
      targetCtx.rect(boxX, boxY, boxW, boxH);
      targetCtx.clip();
      targetCtx.fillStyle = '#0f172a';
      targetCtx.fillRect(boxX, boxY, boxW, boxH);

      const viewLat = mapViewLat !== null ? mapViewLat : state.lat;
      const viewLon = mapViewLon !== null ? mapViewLon : state.lon;
      const centerTileX = lonToTileX(viewLon, zoom);
      const centerTileY = latToTileY(viewLat, zoom);
      const startTileX = Math.floor(centerTileX - (boxW / 512) - 1);
      const endTileX = Math.floor(centerTileX + (boxW / 512) + 1);
      const startTileY = Math.floor(centerTileY - (boxH / 512) - 1);
      const endTileY = Math.floor(centerTileY + (boxH / 512) + 1);

      let anyTileLoaded = false;
      for (let tx = startTileX; tx <= endTileX; tx++) {
        for (let ty = startTileY; ty <= endTileY; ty++) {
          const tileImg = getOsmTile(zoom, tx, ty);
          const drawX = boxX + boxW * 0.5 + (tx - centerTileX) * 256;
          const drawY = boxY + boxH * 0.5 + (ty - centerTileY) * 256;
          if (tileImg && tileImg.loadedOk) {
            anyTileLoaded = true;
            try { targetCtx.drawImage(tileImg, drawX, drawY, 256, 256); } catch (e) {}
          }
        }
      }

      if (anyTileLoaded) {
        targetCtx.fillStyle = 'rgba(15, 23, 42, 0.15)';
        targetCtx.fillRect(boxX, boxY, boxW, boxH);
      } else {
        targetCtx.strokeStyle = 'rgba(148, 163, 184, 0.28)';
        targetCtx.lineWidth = 1;
        for (let gx = boxX; gx < boxX + boxW; gx += 28) {
          targetCtx.beginPath();
          targetCtx.moveTo(gx, boxY);
          targetCtx.lineTo(gx, boxY + boxH);
          targetCtx.stroke();
        }
        for (let gy = boxY; gy < boxY + boxH; gy += 28) {
          targetCtx.beginPath();
          targetCtx.moveTo(boxX, gy);
          targetCtx.lineTo(boxX + boxW, gy);
          targetCtx.stroke();
        }
      }

      let closestIdx = 0;
      let minSqDist = Infinity;
      for (let i = 0; i < routeWaypoints.length; i++) {
        const dLat = routeWaypoints[i][0] - state.lat;
        const dLon = routeWaypoints[i][1] - state.lon;
        const sq = dLat * dLat + dLon * dLon;
        if (sq < minSqDist) {
          minSqDist = sq;
          closestIdx = i;
        }
      }

      const rx = boxX + boxW * 0.5 + (lonToTileX(state.lon, zoom) - centerTileX) * 256;
      const ry = boxY + boxH * 0.5 + (latToTileY(state.lat, zoom) - centerTileY) * 256;

      if (routeWaypoints.length >= 2) {
        targetCtx.lineCap = 'round';
        targetCtx.lineJoin = 'round';
        targetCtx.strokeStyle = 'rgba(9, 9, 11, 0.85)';
        targetCtx.lineWidth = 7;
        targetCtx.beginPath();
        for (let i = 0; i < routeWaypoints.length; i++) {
          const wp = routeWaypoints[i];
          const px = boxX + boxW * 0.5 + (lonToTileX(wp[1], zoom) - centerTileX) * 256;
          const py = boxY + boxH * 0.5 + (latToTileY(wp[0], zoom) - centerTileY) * 256;
          if (i === 0) targetCtx.moveTo(px, py);
          else targetCtx.lineTo(px, py);
        }
        targetCtx.stroke();

        targetCtx.strokeStyle = '#f97316';
        targetCtx.lineWidth = 4;
        targetCtx.stroke();

        targetCtx.strokeStyle = '#10b981';
        targetCtx.lineWidth = 4.5;
        targetCtx.beginPath();
        for (let i = 0; i <= closestIdx; i++) {
          const wp = routeWaypoints[i];
          const px = boxX + boxW * 0.5 + (lonToTileX(wp[1], zoom) - centerTileX) * 256;
          const py = boxY + boxH * 0.5 + (latToTileY(wp[0], zoom) - centerTileY) * 256;
          if (i === 0) targetCtx.moveTo(px, py);
          else targetCtx.lineTo(px, py);
        }
        targetCtx.lineTo(rx, ry);
        targetCtx.stroke();
      }

      if (tapStartLatLon) {
        const sx = boxX + boxW * 0.5 + (lonToTileX(tapStartLatLon[1], zoom) - centerTileX) * 256;
        const sy = boxY + boxH * 0.5 + (latToTileY(tapStartLatLon[0], zoom) - centerTileY) * 256;
        targetCtx.fillStyle = '#22c55e';
        targetCtx.beginPath();
        targetCtx.arc(sx, sy, 7, 0, Math.PI * 2);
        targetCtx.fill();
        targetCtx.strokeStyle = '#ffffff';
        targetCtx.lineWidth = 2;
        targetCtx.stroke();
      }

      const pulseRadius = 9 + (Math.sin(performance.now() * 0.008) + 1) * 4;
      targetCtx.fillStyle = 'rgba(249, 115, 22, 0.35)';
      targetCtx.beginPath();
      targetCtx.arc(rx, ry, pulseRadius, 0, Math.PI * 2);
      targetCtx.fill();

      targetCtx.fillStyle = '#f97316';
      targetCtx.beginPath();
      targetCtx.arc(rx, ry, 6, 0, Math.PI * 2);
      targetCtx.fill();
      targetCtx.strokeStyle = '#ffffff';
      targetCtx.lineWidth = 2;
      targetCtx.stroke();

      targetCtx.fillStyle = 'rgba(9, 9, 11, 0.88)';
      targetCtx.beginPath();
      targetCtx.rect(boxX + 12, boxY + 12, 280, 28);
      targetCtx.fill();
      targetCtx.fillStyle = '#f4f4f5';
      targetCtx.font = 'bold 11px sans-serif';
      targetCtx.textAlign = 'left';
      targetCtx.fillText(

    function onMapPointerDown(clientX, clientY) {
      isDraggingMap = true;
      didPanMoved = false;
      dragStartX = clientX;
      dragStartY = clientY;
      const viewLat = mapViewLat !== null ? mapViewLat : state.lat;
      const viewLon = mapViewLon !== null ? mapViewLon : state.lon;
      dragStartCenterTileX = lonToTileX(viewLon, mapZoom);
      dragStartCenterTileY = latToTileY(viewLat, mapZoom);
    }

    function onMapPointerMove(clientX, clientY) {
      if (!isDraggingMap) return;
      const dx = clientX - dragStartX;
      const dy = clientY - dragStartY;
      if (Math.abs(dx) > 6 || Math.abs(dy) > 6) {
        didPanMoved = true;
      }
      if (didPanMoved) {
        const newTileX = dragStartCenterTileX - dx / 256;
        const newTileY = dragStartCenterTileY - dy / 256;
        mapViewLon = tileXToLon(newTileX, mapZoom);
        mapViewLat = Math.max(-85, Math.min(85, tileYToLat(newTileY, mapZoom)));
      }
    }

    function onMapPointerUp() {
      isDraggingMap = false;
    }

    fullMapCanvas.addEventListener('mousedown', function(ev) {
      onMapPointerDown(ev.clientX, ev.clientY);
    });
    window.addEventListener('mousemove', function(ev) {
      onMapPointerMove(ev.clientX, ev.clientY);
    });
    window.addEventListener('mouseup', function() {
      onMapPointerUp();
    });

    fullMapCanvas.addEventListener('touchstart', function(ev) {
      if (ev.touches.length === 1) {
        onMapPointerDown(ev.touches[0].clientX, ev.touches[0].clientY);
      }
    }, { passive: true });
    fullMapCanvas.addEventListener('touchmove', function(ev) {
      if (ev.touches.length === 1) {

    fullMapCanvas.addEventListener('touchend', function() {

    fullMapCanvas.addEventListener('click', function(ev) {
      if (didPanMoved) {
        didPanMoved = false;
        return;
      }
      const rect = fullMapCanvas.getBoundingClientRect();
      const clickX = ev.clientX - rect.left;
      const clickY = ev.clientY - rect.top;
      const zoom = mapZoom;
      const viewLat = mapViewLat !== null ? mapViewLat : state.lat;
      const viewLon = mapViewLon !== null ? mapViewLon : state.lon;
      const centerTileX = lonToTileX(viewLon, zoom);
      const centerTileY = latToTileY(viewLat, zoom);

      const clickedTileX = centerTileX + (clickX - fullMapCanvas.width * 0.5) / 256;
      const clickedTileY = centerTileY + (clickY - fullMapCanvas.height * 0.5) / 256;
      const clickedLat = tileYToLat(clickedTileY, zoom);
      const clickedLon = tileXToLon(clickedTileX, zoom);

      if (!tapStartLatLon) {
        tapStartLatLon = [clickedLat, clickedLon];
        mapHintEl.textContent =
          'Start Pin set (' + clickedLat.toFixed(4) + ', ' + clickedLon.toFixed(4) + '). Tap Destination Pin.';
      } else {

    function sampleRouteAtDistance(distMeters) {
      if (!Array.isArray(routeWaypoints) || routeWaypoints.length < 2) {
        return { lat: state.lat, lon: state.lon, ele: 0, bearingDeg: 0 };
      }
      if (routeWaypoints[0].length < 5) {
        ensureRouteMetrics(routeWaypoints);
      }
      const lastWp = routeWaypoints[routeWaypoints.length - 1];
      const totalDist = Math.max(10, Number(lastWp[3]) || state.routeTotalMeters || 4000);
      const d = ((distMeters % totalDist) + totalDist) % totalDist;

      let low = 0;
      let high = routeWaypoints.length - 1;
      while (low < high) {
        const mid = (low + high) >> 1;
        if ((Number(routeWaypoints[mid][3]) || 0) < d) {
          low = mid + 1;
        } else {
          high = mid;
        }
      }
      const idx = Math.max(0, low - 1);
      const nextIdx = Math.min(routeWaypoints.length - 1, idx + 1);
      const wp0 = routeWaypoints[idx];
      const wp1 = routeWaypoints[nextIdx];
      const d0 = Number(wp0[3]) || 0;
      const d1 = Number(wp1[3]) || d0;
      const segLen = d1 - d0;
      const t = segLen > 0.05 ? Math.max(0, Math.min(1, (d - d0) / segLen)) : 0;

      const lat = wp0[0] + (wp1[0] - wp0[0]) * t;
      const lon = wp0[1] + (wp1[1] - wp0[1]) * t;
      const ele = wp0[2] + (wp1[2] - wp0[2]) * t;

      const b0 = Number(wp0[4]) || 0;
      const b1 = Number(wp1[4]) || b0;
      const dB = shortestAngleDeg(b0, b1);
      const bearingDeg = (b0 + dB * t + 360.0) % 360.0;

      return { lat: lat, lon: lon, ele: ele, bearingDeg: bearingDeg };
    }

    function projectRoadOffsetAhead(localDist, relD, pt0Override) {
      if (relD <= 0.05) {
        return { curveX: 0, slopeY: 0 };
      }
      const pt0 = pt0Override || sampleRouteAtDistance(localDist);
      const pt1 = sampleRouteAtDistance(localDist + relD);

      const dNorth = (pt1.lat - pt0.lat) * 111132.0;
      const dEast = (pt1.lon - pt0.lon) * 111319.5 * Math.cos(pt0.lat * Math.PI / 180.0);
      const h0Rad = pt0.bearingDeg * Math.PI / 180.0;

      // Local right-hand lateral offset (+X = right of rider, -X = left of rider)
      let lateralX = dEast * Math.cos(h0Rad) - dNorth * Math.sin(h0Rad);

      // If road turns past 90 degrees (hairpin/switchback), blend heading delta so it stays swept to the turn side
      const forwardZ = dEast * Math.sin(h0Rad) + dNorth * Math.cos(h0Rad);
      const turnDeg = shortestAngleDeg(pt0.bearingDeg, pt1.bearingDeg);
      if (forwardZ < relD * 0.35) {
        const sign = turnDeg >= 0 ? 1 : -1;
        lateralX = sign * Math.max(Math.abs(lateralX), relD * 0.42);
      }

      const nearTaper = Math.min(1.0, relD / 6.0);
      const clampedX = Math.max(-42.0, Math.min(42.0, lateralX * nearTaper));

      const dEle = pt1.ele - pt0.ele;
      const rawSlopeY = Math.abs(dEle) > 0.01
        ? dEle * 0.55
        : relD * (state.gradePercent * 0.006);
      const clampedY = Math.max(-28.0, Math.min(35.0, rawSlopeY));

      return { curveX: clampedX, slopeY: clampedY };
    }

    function detectUpcomingTurn(localDist) {
      const pt0 = sampleRouteAtDistance(localDist);
      const pt35 = sampleRouteAtDistance(localDist + 35);
      const pt75 = sampleRouteAtDistance(localDist + 75);
      const delta35 = shortestAngleDeg(pt0.bearingDeg, pt35.bearingDeg);
      const delta75 = shortestAngleDeg(pt0.bearingDeg, pt75.bearingDeg);

      const activeDelta = Math.abs(delta35) >= 12 ? delta35 : delta75;
      const turnDist = Math.abs(delta35) >= 12 ? 35 : 75;
      const turnRate = Math.max(-2.2, Math.min(2.2, delta35 / 22.0));

      if (Math.abs(activeDelta) >= 45) {
        return {
          label: (activeDelta > 0 ? '↱ SHARP RIGHT ' : '↰ SHARP LEFT ') + turnDist + 'M',
          color: '#F43F5E',
          turnRate: turnRate
        };
      }
      if (Math.abs(activeDelta) >= 14) {
        return {
          label: (activeDelta > 0 ? '↱ RIGHT TURN ' : '↰ LEFT TURN ') + turnDist + 'M',
          color: '#FBBF24',
          turnRate: turnRate
        };
      }
      return {
        label: '↑ STRAIGHT ROAD',
        color: '#34D399',
        turnRate: turnRate
      };
    }

    // Helper to position & orient a 3D tube between two points
    function createFrameTube(p1, p2, radius, mat) {
      const v1 = new THREE.Vector3(p1[0], p1[1], p1[2]);
      const v2 = new THREE.Vector3(p2[0], p2[1], p2[2]);
      const dist = v1.distanceTo(v2);
      const geo = new THREE.CylinderGeometry(radius, radius, dist, 8);
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.copy(v1).add(v2).multiplyScalar(0.5);
      const dir = new THREE.Vector3().subVectors(v2, v1).normalize();
      const quat = new THREE.Quaternion().setFromUnitVectors(_upVec, dir);
      mesh.setRotationFromQuaternion(quat);
      return mesh;
    }

    function alignCylinder(cylinderMesh, vA, vB) {
      cylinderMesh.position.set((vA.x + vB.x) * 0.5, (vA.y + vB.y) * 0.5, (vA.z + vB.z) * 0.5);
      _tmpDir.subVectors(vB, vA).normalize();
      _tmpQuat.setFromUnitVectors(_upVec, _tmpDir);
      cylinderMesh.setRotationFromQuaternion(_tmpQuat);
    }

    // Analytical Law of Cosines 2-Bone IK Leg Solver
    function updateLegIK(leg, crankAngle) {
      if (!leg) return;
      const phi = crankAngle + (leg.side > 0 ? 0 : Math.PI);
      const R = 0.165; // Crank arm radius
      const Py = 0.33 + R * Math.sin(phi);
      const Pz = -0.10 + R * Math.cos(phi);
      const Px = leg.side * 0.115;

      const Hy = leg.hip.y;
      const Hz = leg.hip.z;
      const Hx = leg.hip.x;

      const Dy = Py - Hy;
      const Dz = Pz - Hz;
      const d = Math.sqrt(Dy * Dy + Dz * Dz);

      const L1 = leg.L1;
      const L2 = leg.L2;

      // Law of Cosines for hip-to-thigh angle offset
      let cosAlpha = (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d);
      cosAlpha = Math.max(-1, Math.min(1, cosAlpha));
      const alpha = Math.acos(cosAlpha);

      // Angle from Hip to Pedal
      const beta = Math.atan2(Dy, Dz);

      // Forward knee bend towards +Z
      const theta1 = beta + alpha;
      const Ky = Hy + L1 * Math.sin(theta1);
      const Kz = Hz + L1 * Math.cos(theta1);
      const Kx = Hx;

      // Align Thigh from Hip to Knee
      _vecA.set(Hx, Hy, Hz);
      _vecB.set(Kx, Ky, Kz);
      alignCylinder(leg.thighMesh, _vecA, _vecB);

      // Position Knee joint
      leg.kneeMesh.position.set(Kx, Ky, Kz);

      // Align Calf from Knee to Pedal
      _vecA.set(Kx, Ky, Kz);
      _vecB.set(Px, Py, Pz);
      alignCylinder(leg.calfMesh, _vecA, _vecB);

      // Align White Sock at the lower portion of the calf
      _vecA.set(Kx * 0.25 + Px * 0.75, Ky * 0.25 + Py * 0.75, Kz * 0.25 + Pz * 0.75);
      _vecB.set(Px, Py, Pz);
      alignCylinder(leg.sockMesh, _vecA, _vecB);

      // Position Road Shoe with slight dynamic ankle flex
      leg.shoeMesh.position.set(Px, Py - 0.015, Pz + 0.02);
      leg.shoeMesh.rotation.x = -Math.sin(phi) * 0.18;
    }

    // ===============================================
    // CURVED HOLOGRAPHIC FIGHTER-JET VISOR HUD (3D)
    // ===============================================
    function updateVisorFrustumScale(w, h) {
      if (!visorMesh || !camera) return;
      const aspect = (w && h) ? (w / h) : (camera.aspect || 1.78);
      const vFovRad = (camera.fov * Math.PI) / 180.0;
      const depth = 1.5;
      const frustumH = 2.0 * depth * Math.tan(vFovRad * 0.5);
      const frustumW = frustumH * aspect;
      visorMesh.scale.set(frustumW, frustumH, 1);
    }

    function createCurvedVisorHud() {
      hudCanvas = document.createElement('canvas');
      hudCanvas.width = 1600;
      hudCanvas.height = 800;
      hudCanvas.style.fontVariantNumeric = 'tabular-nums';
      hudCtx = hudCanvas.getContext('2d');

      hudTexture = new THREE.CanvasTexture(hudCanvas);
      hudTexture.minFilter = THREE.LinearFilter;
      hudTexture.magFilter = THREE.LinearFilter;

      // Full-frustum gently curved visor mesh centered at z = -1.5m
      const visorGeo = new THREE.PlaneGeometry(1, 1, 32, 1);
      const posAttr = visorGeo.attributes.position;
      for (let i = 0; i < posAttr.count; i++) {
        const u = posAttr.getX(i); // -0.5 .. +0.5
        const curveZ = -1.5 + (u * u) * 0.14;
        posAttr.setZ(i, curveZ);
      }
      posAttr.needsUpdate = true;

      const visorMat = new THREE.MeshBasicMaterial({
        map: hudTexture,
        transparent: true,
        opacity: 0.97,
        side: THREE.DoubleSide,
        depthTest: false,
        depthWrite: false
      });

      visorMesh = new THREE.Mesh(visorGeo, visorMat);
      visorMesh.renderOrder = 999;
      visorMesh.position.set(0, 0, 0);
      visorMesh.rotation.set(0, 0, 0);
      // Parent directly to camera so it remains centered in view across CHASE, POV, DRONE
      camera.add(visorMesh);
      updateVisorFrustumScale(window.innerWidth, window.innerHeight);
    }

    // Canvas helper for rounded glass panels with smooth borders
    function drawGlassPanel(ctx, x, y, w, h, r, borderColor, bgAlpha) {
      ctx.save();
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(x, y, w, h, r);
      } else {
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
      }
      ctx.fillStyle = 'rgba(9, 9, 11, ' + (bgAlpha !== undefined ? bgAlpha : 0.84) + ')';
      ctx.fill();
      ctx.strokeStyle = borderColor || 'rgba(255, 255, 255, 0.18)';
      ctx.lineWidth = 2.0;
      ctx.stroke();
      ctx.restore();
    }

    // High-DPI 2D Visor HUD Painter: Full-Viewport Cockpit Layout (Open Center for Cyclist)
    function renderVisorHud(now) {
      if (!hudCtx) return;
      const w = hudCanvas.width;
      const h = hudCanvas.height;

      hudCtx.clearRect(0, 0, w, h);

      const pColor = ZONE_COLORS[state.powerZone] || '#F97316';
      const hrColor = ZONE_COLORS[state.hrZone] || '#FB7185';
      const pZoneName = ZONE_NAMES[state.powerZone] || 'Z3 TEMPO';
      const gradeColor = state.gradePercent > 4.0 ? '#F43F5E' : (state.gradePercent > 0.0 ? '#FBBF24' : '#34D399');

      const maxDisplayWatts = Math.max(450, state.ftpWatts * 1.5);
      const powerFraction = Math.min(1.0, Math.max(0.0, state.watts / maxDisplayWatts));

      const cx = w * 0.5;

      // 1. TOP-CENTER FLOATING PILL (Workout Ribbon or Live Turn & Grade Pill)
      if (state.isWorkoutActive) {
        const pillW = 780;
        const pillH = 88;
        const pillX = cx - pillW / 2;
        const pillY = 112;
        const isPulse = (state.workoutStepRemainingSec <= 3 || state.isWorkoutPaused) && Math.sin(now * 0.015) > 0;
        const borderColor = isPulse ? '#F43F5E' : pColor;

        drawGlassPanel(hudCtx, pillX, pillY, pillW, pillH, 36, borderColor, 0.90);

        // Top accent line in target zone color
        hudCtx.save();
        hudCtx.fillStyle = isPulse ? '#F43F5E' : pColor;
        hudCtx.beginPath();
        hudCtx.roundRect ? hudCtx.roundRect(pillX + 34, pillY, pillW - 68, 4.5, 2) : hudCtx.rect(pillX + 34, pillY, pillW - 68, 4.5);
        hudCtx.fill();
        hudCtx.restore();

        // Left Section: Step info
        hudCtx.save();
        hudCtx.textAlign = 'left';
        hudCtx.fillStyle = '#A1A1AA';
        hudCtx.font = 'bold 14px sans-serif';
        const biasText = state.workoutIntensityBiasPercent !== 0 ? ' (' + (state.workoutIntensityBiasPercent > 0 ? '+' : '') + state.workoutIntensityBiasPercent + '%)' : '';
        hudCtx.fillText('STEP ' + (state.workoutStepIndex + 1) + ' OF ' + state.workoutTotalSteps + biasText, pillX + 32, pillY + 30);

        hudCtx.fillStyle = '#FFFFFF';
        hudCtx.font = '900 22px sans-serif';
        hudCtx.fillText(state.workoutStepName.toUpperCase(), pillX + 32, pillY + 56);

        hudCtx.fillStyle = '#38BDF8';
        hudCtx.font = 'bold 15px sans-serif';
        hudCtx.fillText('TARGET ' + state.workoutTargetWatts + 'W @ ' + state.workoutTargetRpm + ' RPM', pillX + 32, pillY + 76);
        hudCtx.restore();

        // Center Section: Prominent Countdown Timer
        hudCtx.save();
        hudCtx.textAlign = 'center';
        const remMins = Math.floor(state.workoutStepRemainingSec / 60);
        const remSecs = state.workoutStepRemainingSec % 60;
        const remStr = String(remMins).padStart(2, '0') + ':' + String(remSecs).padStart(2, '0');
        hudCtx.fillStyle = isPulse ? '#F43F5E' : '#FFFFFF';
        hudCtx.font = '900 44px sans-serif';
        hudCtx.fillText(remStr, cx, pillY + 54);

        hudCtx.fillStyle = isPulse ? '#F43F5E' : '#A1A1AA';
        hudCtx.font = 'bold 13px sans-serif';
        hudCtx.fillText(state.isWorkoutPaused ? 'PAUSED' : 'REMAINING', cx, pillY + 74);
        hudCtx.restore();

        // Right Section: Earned Stars & Compliance
        hudCtx.save();
        hudCtx.textAlign = 'right';
        hudCtx.fillStyle = '#FBBF24';
        hudCtx.font = 'bold 20px sans-serif';
        hudCtx.fillText('★ ' + state.workoutEarnedStars, pillX + pillW - 32, pillY + 32);

        hudCtx.font = '900 18px sans-serif';
        hudCtx.fillText(state.workoutCompliancePercent.toFixed(0) + '% COMPL', pillX + pillW - 32, pillY + 56);

          hudCtx.fillText(state.workoutPacingPrompt, pillX + pillW - 32, pillY + 76);

      } else {

        const pillH = 68;

      hudCtx.fillText(pZoneName, leftCapsuleX + 28 + zonePillW * 0.5, leftCapsuleY + 185);

      // Horizontal Power Progress Bar along bottom of watts section
      hudCtx.fillStyle = 'rgba(39, 39, 42, 0.90)';
      hudCtx.beginPath();
      hudCtx.roundRect ? hudCtx.roundRect(leftCapsuleX + 28, leftCapsuleY + 210, zonePillW, 8, 4) : hudCtx.rect(leftCapsuleX + 28, leftCapsuleY + 210, zonePillW, 8);
      hudCtx.fill();
      hudCtx.fillStyle = pColor;
      hudCtx.beginPath();
      hudCtx.roundRect ? hudCtx.roundRect(leftCapsuleX + 28, leftCapsuleY + 210, zonePillW * powerFraction, 8, 4) : hudCtx.rect(leftCapsuleX + 28, leftCapsuleY + 210, zonePillW * powerFraction, 8);
      hudCtx.fill();

      // Target power marker tick if in workout
      if (state.isWorkoutActive && state.workoutTargetWatts > 0) {
        const targetFrac = Math.min(1.0, Math.max(0.0, state.workoutTargetWatts / maxDisplayWatts));
        hudCtx.fillStyle = '#FFFFFF';
        hudCtx.fillRect(leftCapsuleX + 28 + zonePillW * targetFrac - 1.5, leftCapsuleY + 206, 3, 16);
      }

      // Vertical Divider
      hudCtx.strokeStyle = 'rgba(255, 255, 255, 0.14)';
      hudCtx.lineWidth = 1.5;
      hudCtx.beginPath();
      hudCtx.moveTo(leftCapsuleX + 228, leftCapsuleY + 28);
      hudCtx.lineTo(leftCapsuleX + 228, leftCapsuleY + 214);
      hudCtx.stroke();

      // Cadence (RPM)
      const rightColX = leftCapsuleX + 252;
      hudCtx.textAlign = 'left';
      hudCtx.fillStyle = '#D4D4D8';
      hudCtx.font = 'bold 14px sans-serif';
      hudCtx.fillText('CADENCE', rightColX, leftCapsuleY + 54);

      hudCtx.fillStyle = '#38BDF8';
      hudCtx.font = '900 48px sans-serif';
      hudCtx.fillText(String(state.rpm), rightColX, leftCapsuleY + 104);
      hudCtx.fillStyle = '#E4E4E7';
      hudCtx.font = 'bold 17px sans-serif';
      hudCtx.fillText('RPM', rightColX + 105, leftCapsuleY + 100);

      // Heart Rate (BPM)
      const hrBpm = state.bpm > 0 ? state.bpm : '--';
      const heartPulse = 1.0 + (Math.sin(now * 0.009) * 0.14);
      hudCtx.fillStyle = '#D4D4D8';
      hudCtx.font = 'bold 14px sans-serif';
      hudCtx.fillText('HEART RATE', rightColX, leftCapsuleY + 144);

      hudCtx.fillStyle = hrColor;
      hudCtx.font = '900 48px sans-serif';
      hudCtx.fillText(String(hrBpm), rightColX, leftCapsuleY + 194);
      hudCtx.fillStyle = '#E4E4E7';
      hudCtx.font = 'bold 17px sans-serif';
      hudCtx.fillText('BPM', rightColX + 105, leftCapsuleY + 190);

      // Mini Cardiac waveform
      hudCtx.strokeStyle = hrColor;
      hudCtx.lineWidth = 2.5;
      hudCtx.beginPath();
      const waveX = rightColX;
      const waveY = leftCapsuleY + 214;
      hudCtx.moveTo(waveX, waveY);
      hudCtx.lineTo(waveX + 42, waveY);
      hudCtx.lineTo(waveX + 56, waveY - 11 * heartPulse);
      hudCtx.lineTo(waveX + 70, waveY + 11 * heartPulse);
      hudCtx.lineTo(waveX + 84, waveY);
      hudCtx.lineTo(waveX + 210, waveY);
      hudCtx.stroke();
      hudCtx.restore();

      // 3. BOTTOM-RIGHT FLOATING COURSE CAPSULE (Speed, Distance, Grade, Elevation)
      const rightCapsuleX = w - leftCapsuleX - capsuleW;
      const rightCapsuleY = leftCapsuleY;

      drawGlassPanel(hudCtx, rightCapsuleX, rightCapsuleY, capsuleW, capsuleH, 28, 'rgba(255, 255, 255, 0.18)', 0.86);

      // Header
      hudCtx.save();
      hudCtx.textAlign = 'left';
      hudCtx.fillStyle = '#D4D4D8';
      hudCtx.font = 'bold 15px sans-serif';
      hudCtx.fillText('COURSE TELEMETRY', rightCapsuleX + 28, rightCapsuleY + 34);

      const courseTurn = detectUpcomingTurn(state.distanceMeters);
      hudCtx.textAlign = 'right';
      hudCtx.fillStyle = courseTurn.color;
      hudCtx.font = '900 15px sans-serif';
      hudCtx.fillText(courseTurn.label, rightCapsuleX + capsuleW - 26, rightCapsuleY + 34);
      hudCtx.textAlign = 'left';

      // Hero Speed
      hudCtx.fillStyle = '#FFFFFF';
      hudCtx.font = '900 78px sans-serif';
      hudCtx.fillText(state.speedKmh.toFixed(1), rightCapsuleX + 26, rightCapsuleY + 114);
      hudCtx.fillStyle = '#E4E4E7';
      hudCtx.font = 'bold 17px sans-serif';
      hudCtx.fillText('KM / H', rightCapsuleX + 28, rightCapsuleY + 144);

      // Distance & Elapsed Time
      const mins = Math.floor(state.elapsedSeconds / 60);
      const secs = state.elapsedSeconds % 60;
      const timeStr = String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
      hudCtx.fillStyle = '#F4F4F5';
      hudCtx.font = '900 22px sans-serif';
      hudCtx.fillText((state.distanceMeters / 1000).toFixed(2) + ' KM', rightCapsuleX + 28, rightCapsuleY + 182);
      hudCtx.fillStyle = '#D4D4D8';
      hudCtx.font = 'bold 17px sans-serif';
      hudCtx.fillText('TIME ' + timeStr, rightCapsuleX + 28, rightCapsuleY + 212);

      // Vertical Divider
      hudCtx.strokeStyle = 'rgba(255, 255, 255, 0.14)';
      hudCtx.lineWidth = 1.5;
      hudCtx.beginPath();
      hudCtx.moveTo(rightCapsuleX + 236, rightCapsuleY + 46);
      hudCtx.lineTo(rightCapsuleX + 236, rightCapsuleY + 214);
      hudCtx.stroke();

      // Road Grade
      const gradeColX = rightCapsuleX + 258;
      hudCtx.fillStyle = '#D4D4D8';
      hudCtx.font = 'bold 14px sans-serif';
      hudCtx.fillText('ROAD GRADE', gradeColX, rightCapsuleY + 62);

      hudCtx.fillStyle = gradeColor;
      hudCtx.font = '900 44px sans-serif';
      const gradeSign = state.gradePercent >= 0 ? '+' : '';
      hudCtx.fillText(gradeSign + state.gradePercent.toFixed(1) + '%', gradeColX, rightCapsuleY + 112);

      // Mini Elevation Profile Ribbon (Dynamic from active routeWaypoints)
      const pX = gradeColX;
      const pY = rightCapsuleY + 206;
      const profW = 212;
      const profH = 54;

      hudCtx.fillStyle = 'rgba(39, 39, 42, 0.75)';
      hudCtx.beginPath();
      hudCtx.roundRect ? hudCtx.roundRect(pX, rightCapsuleY + 136, profW, 78, 10) : hudCtx.rect(pX, rightCapsuleY + 136, profW, 78);
      hudCtx.fill();

      const wps = (Array.isArray(routeWaypoints) && routeWaypoints.length >= 2)
        ? routeWaypoints
        : [[0,0,724],[0,0,860],[0,0,1118],[0,0,1420],[0,0,1815]];
      let minEle = Infinity;
      let maxEle = -Infinity;
      for (let i = 0; i < wps.length; i++) {
        const ele = Number(wps[i][2]) || 0;
        if (ele < minEle) minEle = ele;
        if (ele > maxEle) maxEle = ele;
      }
      const eleSpan = Math.max(15, maxEle - minEle);

      hudCtx.strokeStyle = '#F97316';
      hudCtx.lineWidth = 3;
      hudCtx.beginPath();
      for (let i = 0; i < wps.length; i++) {
        const xFrac = i / (wps.length - 1);
        const yFrac = ((Number(wps[i][2]) || 0) - minEle) / eleSpan;
        const wx = pX + 6 + xFrac * (profW - 12);
        const wy = (pY - 6) - yFrac * profH;
        if (i === 0) hudCtx.moveTo(wx, wy);
        else hudCtx.lineTo(wx, wy);
      }
      hudCtx.stroke();

      // Rider dot on elevation profile
      const routeTot = Math.max(100, state.routeTotalMeters || 4000);
      const progFrac = Math.min(1.0, Math.max(0.0, (state.distanceMeters % routeTot) / routeTot));
      const profDotX = pX + 6 + progFrac * (profW - 12);
      const floatIdx = progFrac * (wps.length - 1);
      const idx0 = Math.floor(floatIdx);
      const idx1 = Math.min(wps.length - 1, idx0 + 1);
      const tIdx = floatIdx - idx0;
      const interpEle = (Number(wps[idx0][2]) || 0) * (1 - tIdx) + (Number(wps[idx1][2]) || 0) * tIdx;
      const profDotY = (pY - 6) - ((interpEle - minEle) / eleSpan) * profH;

      hudCtx.fillStyle = '#FFFFFF';
      hudCtx.beginPath();
      hudCtx.arc(profDotX, profDotY, 6, 0, Math.PI * 2);
      hudCtx.fill();
      hudCtx.restore();

      // Signal Three.js that texture needs update
      hudTexture.needsUpdate = true;
    }

    // ==========================================
    // DYNAMIC WORLD & SCENERY DEFORMATION
    // ==========================================
    function updateWorldGeometry(localDist) {
      const pt0 = sampleRouteAtDistance(localDist);

      // 1. Scroll Road Texture
      if (roadTexture) {
        roadTexture.offset.y = -(localDist * 0.1) % 1;
      }

      // 2. Deform Road Ribbon Vertices along -Z using real GPS route geometry & elevation
      if (roadMesh && roadMesh.geometry.userData.basePositions) {
        const pos = roadMesh.geometry.attributes.position;
        const base = roadMesh.geometry.userData.basePositions;
        for (let i = 0; i < pos.count; i++) {
          const bX = base[i * 3];
          const bZ = base[i * 3 + 2];
          const d = -bZ; // Distance ahead of rider along -Z
          const relD = Math.max(0, d);
          const proj = projectRoadOffsetAhead(localDist, relD, pt0);
          pos.setX(i, bX + proj.curveX);
          pos.setY(i, proj.slopeY);
        }
        pos.needsUpdate = true;
      }

      // 3. Scroll Trees along -Z following real GPS road curves & elevation
      if (treesGroup) {
        for (let i = 0; i < treesGroup.children.length; i++) {
          const tree = treesGroup.children[i];
          const d = ((tree.userData.baseDist - (localDist % 240)) + 240) % 240 - 10;
          const relD = Math.max(0, d);
          const proj = projectRoadOffsetAhead(localDist, relD, pt0);
          tree.position.set(proj.curveX + tree.userData.side * tree.userData.lateral, proj.slopeY, -d);
        }
      }

      // 4. Distance Milestone Arch Gate (Every 500m)
      if (archMesh) {
        const nextMilestone = Math.ceil((localDist + 5) / 500) * 500;
        const d = nextMilestone - localDist;
        if (d > 0 && d < 230) {
          archMesh.visible = true;
          const proj = projectRoadOffsetAhead(localDist, d, pt0);
          archMesh.position.set(proj.curveX, proj.slopeY, -d);
          if (archMesh.userData.currentKm !== nextMilestone) {
            archMesh.userData.currentKm = nextMilestone;
            updateArchSignText(archSignCtx, archSignTexture, (nextMilestone / 1000).toFixed(1) + ' KM');
          }
        } else {
          archMesh.visible = false;
        }
      }

      // 5. Position AI Bots along -Z on the real GPS road ribbon
      if (botsGroup) {
        const routeTot = Math.max(100, state.routeTotalMeters || 4000);
        const riderLoop = ((localDist % routeTot) + routeTot) % routeTot;
        for (let b = 0; b < botsGroup.children.length; b++) {
          const botMesh = botsGroup.children[b];
          const bData = bots[b];
          let relDist = bData.dist - riderLoop;
          if (relDist < -20) relDist += routeTot;
          if (relDist < 220) {
            botMesh.visible = true;
            const relD = Math.max(0, relDist);
            const proj = projectRoadOffsetAhead(localDist, relD, pt0);
            botMesh.position.set(proj.curveX + bData.laneOffset * 2.0, proj.slopeY, -relDist);
          } else {
            botMesh.visible = false;
          }
        }
      }
    }

    // ==========================================
    // MAIN ANIMATION & RENDERING LOOP
    // ==========================================
    let lastTime = performance.now();
    let cameraInertiaPitch = 0;
    let cameraInertiaRoll = 0;
    let smoothedTurnRate = 0;

    function animate(now) {
      try {
        const dt = Math.min(0.1, Math.max(0.001, (now - lastTime) / 1000));
        lastTime = now;

        // Update physics calculations
        const speedMs = (state.speedKmh * 1000) / 3600;
        state.wheelRotationRad += (speedMs / 0.35) * dt;
        state.crankAngleRad += ((state.rpm / 60) * Math.PI * 2) * dt;

        // Update AI Bot distances
        const routeTot = Math.max(100, state.routeTotalMeters || 4000);
        for (let i = 0; i < bots.length; i++) {
          bots[i].dist = (bots[i].dist + bots[i].speedMs * dt) % routeTot;
        }

        // If in MAP Mode, render the full 2D Tactical OpenStreetMap View
        if (state.cameraMode === 'MAP') {
          threeCanvas.style.display = 'none';
          fallback2dCanvas.style.display = 'block';
          renderGpsMap(fallbackCtx, 0, 0, fallback2dCanvas.width, fallback2dCanvas.height, mapZoom);
        } else if (isThreeSupported) {
          threeCanvas.style.display = 'block';
          fallback2dCanvas.style.display = 'none';

          const localDist = state.distanceMeters;
          const turnInfo = detectUpcomingTurn(localDist);
          const speedLeanFactor = Math.min(1.0, state.speedKmh / 18.0);
          const targetCurve = turnInfo.turnRate * (0.35 + 0.65 * speedLeanFactor);
          smoothedTurnRate += (targetCurve - smoothedTurnRate) * Math.min(1.0, 5.0 * dt);
          const currentCurve = smoothedTurnRate;
          const currentSlope = state.gradePercent * 0.05;

          // 1. Update Cyclist and Bike
          if (frontWheel && rearWheel) {
            frontWheel.rotation.x = state.wheelRotationRad;
            rearWheel.rotation.x = state.wheelRotationRad;
          }
          if (crankGroup) {
            crankGroup.rotation.x = state.crankAngleRad;
          }
          if (leftLegData && rightLegData) {
            updateLegIK(leftLegData, state.crankAngleRad);
            updateLegIK(rightLegData, state.crankAngleRad);
          }
          if (cyclistGroup) {
            cyclistGroup.rotation.z = Math.sin(state.crankAngleRad) * 0.035;
          }
          if (bikeGroup) {
            // Bike lean into corners (facing -Z)
            const bikeLean = -currentCurve * 0.35;
            bikeGroup.rotation.z = bikeLean;
            bikeGroup.rotation.x = -currentSlope * 0.5;
            bikeGroup.position.x = currentCurve * 0.35;
          }

          // 2. Deform Road & Scroll Scenery along -Z
          updateWorldGeometry(localDist);

          // 3. Update Camera Modes & Dynamic Inertia (Camera points toward -Z)
          const targetPitch = -currentSlope * 0.4;
          const targetRoll = -currentCurve * 0.15;
          cameraInertiaPitch += (targetPitch - cameraInertiaPitch) * 4.0 * dt;
          cameraInertiaRoll += (targetRoll - cameraInertiaRoll) * 4.0 * dt;

          if (state.cameraMode === 'POV') {
            // First-person cockpit: looking forward over the drops toward -Z
            cameraRig.position.set(bikeGroup.position.x, 1.35, -0.15);
            camera.position.set(0, 0, 0);
            camera.rotation.set(cameraInertiaPitch, 0, cameraInertiaRoll);
          } else if (state.cameraMode === 'DRONE') {
            // Elevated overview behind (+Z) looking down forward (-Z)
            cameraRig.position.set(bikeGroup.position.x * 0.6, 4.8, 8.5);
            camera.position.set(0, 0, 0);
            camera.rotation.set(-0.32 + cameraInertiaPitch * 0.5, 0, cameraInertiaRoll * 0.5);
          } else {
            // Dynamic 3/4 CHASE Mode: Lateral offset (+0.65m X) and slightly elevated,
            // revealing bicycle frame, deep wheels, curved spine, and 2-segment leg articulation
            cameraRig.position.set(bikeGroup.position.x * 0.75 + 0.65, 1.68, 3.35);
            camera.position.set(0, 0, 0);
            camera.rotation.set(-0.11 + cameraInertiaPitch, -0.16 + cameraInertiaRoll * 0.5, cameraInertiaRoll);
          }

          // Subtle visor inertia lag relative to camera
          if (visorMesh) {
            visorMesh.visible = true;
            visorMesh.position.set(-cameraInertiaRoll * 0.06, cameraInertiaPitch * 0.05, 0);
            visorMesh.rotation.set(0, 0, -cameraInertiaRoll * 0.2);
          }

          // 4. Update Visor HUD Canvas Texture (throttled to ~30 FPS to save GPU memory bandwidth & prevent thermal throttling)
          if (now - lastHudRenderTime >= 32) {
            renderVisorHud(now);
            lastHudRenderTime = now;
          }

          // 5. Render Three.js Scene
          renderer.render(scene, camera);
        }

        // Interactive map if modal is open or in MAP camera mode
        if (state.isMapModalOpen || state.cameraMode === 'MAP') {
          renderGpsMap(fullMapCtx, 0, 0, fullMapCanvas.width, fullMapCanvas.height, mapZoom);
        }
      } catch (err) {
        console.error('Render error:', err);
      } finally {
        requestAnimationFrame(animate);
      }
    }

    function resize() {
      const w = window.innerWidth || document.documentElement.clientWidth || 800;
      const h = window.innerHeight || document.documentElement.clientHeight || 450;

      fallback2dCanvas.width = w;
      fallback2dCanvas.height = h;

      if (renderer && camera) {
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
        updateVisorFrustumScale(w, h);
      }

      if (state.isMapModalOpen || state.cameraMode === 'MAP') {
        const leftOffset = state.isMapModalOpen ? 340 : 28;
        fullMapCanvas.width = Math.max(240, fullMapContainer.clientWidth || (w - leftOffset));
        fullMapCanvas.height = Math.max(160, fullMapContainer.clientHeight || (h - 200));
      }
    }

    // Single Guarded Bootstrap
    let hasBootstrapped = false;
    function bootstrap() {
      if (hasBootstrapped) return;
      hasBootstrapped = true;
      initThree();
      resize();
      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', resize);
    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', bootstrap);
    } else {
      bootstrap();
    }
  </script>
</body>
</html>
