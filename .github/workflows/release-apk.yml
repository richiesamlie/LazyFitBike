name: Build & Publish LazyFitBike APKs

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build Phone and Galaxy Watch 4 APKs
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :wear:testDebugUnitTest :app:assembleDebug :wear:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk LazyFitBike-phone.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk LazyFitBike-watch.apk

      - name: Publish APKs to Latest GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.2.${{ github.run_number }}"
          gh release create "$TAG" LazyFitBike-phone.apk LazyFitBike-watch.apk \
            --title "LazyFitBike $TAG (Phone + Galaxy Watch 4)" \
            --notes "Automated OTA build from commit ${{ github.sha }} signed with shared project keystore." \
            --latest
