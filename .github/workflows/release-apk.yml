name: Build & Publish LazyFitBike APKs

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Prepare Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding repository secret keystore..."
            echo "$KEYSTORE_BASE64" | base64 --decode > keystore/lazyfitbike.jks
          elif [ ! -f keystore/lazyfitbike.jks ]; then
            echo "Generating default release signing keystore..."
            keytool -genkeypair -v \
              -keystore keystore/lazyfitbike.jks \
              -alias lazyfitbike \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass lazyfitbike123 \
              -keypass lazyfitbike123 \
              -dname "CN=LazyFitBike, OU=Engineering, O=LazyFitBike, L=SanFrancisco, S=CA, C=US"
          fi

      - name: Build Minified Release Phone and Galaxy Watch 4 APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'lazyfitbike123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'lazyfitbike' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'lazyfitbike123' }}
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :wear:testDebugUnitTest :app:assembleRelease :wear:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk LazyFitBike-phone.apk
          cp wear/build/outputs/apk/release/wear-release.apk LazyFitBike-watch.apk

      - name: Clean up Keystore File
        if: always()
        run: |
          rm -f keystore/lazyfitbike.jks

      - name: Publish APKs to Matching Version GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          TAG="v${VERSION_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" LazyFitBike-phone.apk LazyFitBike-watch.apk --clobber
          else
            gh release create "$TAG" LazyFitBike-phone.apk LazyFitBike-watch.apk \
              --title "LazyFitBike $TAG (Phone + Galaxy Watch 4)" \
              --notes "R8-minified OTA build ($TAG) with Structured Workout & Interval Training Engine." \
              --latest
          fi
